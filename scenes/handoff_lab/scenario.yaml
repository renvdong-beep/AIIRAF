schema_version: iraf.scenario-catalog/v1
# S2 脚本化场景（决策 6.A：先 S2 再 S1，S3 遥操作本轮不做）。
# 执行器已由步骤 18 交付（`scripts/scenario.py list|run`）；本文件只声明步骤、判据与故障注入项，
# 阈值不在这里之外的地方出现（铁律 5.3）。执行器可评测的判据只有三个（口径见其模块 docstring）：
# `min_stable_hold_s`（本步推进的仿真时间）、`max_speed_m_s`（步骤结束时实测末速）、`timeout_s`（墙钟）。
# 其余判据名（pose_tolerance_m / min_lift_delta_m / …）属尚在研究中的步骤，声明它们会让预检失败（退出码 2）。
# 步骤状态机沿用 docs/iraf-piper-quadruped-simulation.md §5 的 delivery_handoff：
# VERIFY_READY -> DOG_DOCKING -> ARM_PERCEIVE -> ARM_GRASP -> PLACE_IN_TRAY -> DOG_CONFIRM -> DOG_DELIVER，异常进 SAFE_HOLD。
scene: scene.yaml
simulation: true

scenarios:
  # 本战役（x86-first）**可执行**的场景：只用已验收的 stand/stop 能力，判据取实测值 + 余量
  # （实测证据 build/iraf-24h/18/probe-step-metrics.json：stand 推进 8.0 s / 末速 3.04e-05 m/s / 墙钟 0.43 s；
  # stop 推进 3.0 s / 末速 9.18e-04 m/s / 墙钟 0.60 s）。停靠/抓取/放置/载荷确认属 U5/U6，
  # 在 `nominal` 里登记为待交付。
  stand_stop:
    description: 可执行子集（S2 回归）：四足站立保持 → 松力停机。判据全部是"结果"判据（仿真时间推进量 + 实测末速 + 墙钟），不是"命令已发出"。
    steps:
      - id: ss01_stand
        action: stand
        robot: unitree_go2
        params: {}
        criteria:
          # 8.0 s 推进量 ≥ 3.0：站立窗口成立（物理稳定性证据见步骤 15 的 loopback 验收，两者不可互换）。
          min_stable_hold_s: 3.0
          # 末速上限取机型声明里已有的 stop.speed_tolerance_mps = 0.05 m/s（不另造数字），实测 3.04e-05。
          max_speed_m_s: 0.05
          # 墙钟上限：实测 0.43 s，技能租约 30 s，留 23 倍余量。
          timeout_s: 10.0
      - id: ss02_stop
        action: stop
        robot: unitree_go2
        params: {}
        criteria:
          # 停机同样要推进声明的停机时长（3.0 s），否则"停"只是一条命令。
          min_stable_hold_s: 1.0
          max_speed_m_s: 0.05
          timeout_s: 5.0
    faults: []

  # 故障注入（本战役交付的"传感器不可用"类）：注入点必须是**可执行**步骤，
  # 否则故障无法注入，只会被登记为"未注入"（见 fault_sensor_loss）。
  fault_sensor_unavailable:
    description: 站立阶段载荷雷达不可用：拒绝进入机动序列，只允许声明的安全动作（stop），进入 SAFE_HOLD，禁止伪造成功（AGENTS.md 1.5/1.6）。
    steps:
      - id: u01_stand
        action: stand
        robot: unitree_go2
        params: {}
        criteria:
          min_stable_hold_s: 3.0
          max_speed_m_s: 0.05
      - id: u02_safe_hold
        action: stop
        robot: unitree_go2
        params: {}
        criteria:
          min_stable_hold_s: 1.0
          max_speed_m_s: 0.05
    faults:
      - id: lidar_loss
        at_step: u01_stand
        kind: sensor_unavailable
        target: payload_lidar
        expect:
          terminal_state: SAFE_HOLD
          fake_success_forbidden: true

  nominal:
    description: delivery_handoff 标称序列：四足站立并停靠 -> 机械臂抓取 -> 放入托盘 -> 载荷确认。判据全部是"结果"判据，不是"命令已发出"。
    steps:
      - id: s01_verify_ready
        action: stand
        robot: unitree_go2
        params: {}
        criteria:
          # 末速上限 0.05 = 机型声明的 stop.speed_tolerance_mps（原写 0.0 是未实测的愿望值：
          # 实测末速 3.04e-05 m/s，永远不可能恰好为 0）。判据只允许来自声明与实测。
          min_stable_hold_s: 3.0
          max_speed_m_s: 0.05
      - id: s02_dock
        action: dock_for_handoff
        robot: unitree_go2
        params: {}
        # 2026-09-24：`dock_for_handoff` 能力已声明（适配器层 9/9 + 技能层跑通）⇒ 本步骤
        # **解除待交付登记**，恢复为可执行步骤。判据 `translation_error_max_m` / `yaw_error_max_deg`
        # 的测量口径已于提交 224f925 补齐（取自技能 evidence 的 `final_translation_error_m` /
        # |`final_yaw_error_deg`|）⇒ 预检不再因"判据无依据"失败。
        criteria:
          translation_error_max_m: 0.03
          yaw_error_max_deg: 2.0
          max_speed_m_s: 0.05
      # 参数名必须与技能输入契约一致（`skills/pick_object/pick_object.input.json` 的必填键是
      # `target_id`，不是 `target`；实测预检直接报 'target_id' is a required property）。
      # 取值 = 场景声明里的道具 id（`scene.yaml: props[].id = box_01`），也是报告 `target_id` 的值。
      - id: s03_pick
        action: pick_object
        robot: piper
        params:
          target_id: box_01
          # 参数来源键：由场景报告 targets[] 组装世界系 grasp_pose（见下方说明与
          # scripts/scenario.py: resolve_param_sources）。声明里不复制坐标。
          grasp_pose_from: report_target
          # 时长必须在声明里给出（技能入参契约允许 duration_ms，1..30000；缺省时每段只剩极短时间
          # ⇒ 到位精度不达标）。取值依据是**实测**（2026-09-24）：每段 1600 ms（本值 8000/5）下
          # 门禁残差 7.551e-06 m（远小于 0.005），同一路径不带前馈时为 1.2113e-02 m。
          duration_ms: 8000
        # 输入来源（2026-09-24 落地，原"待交付"登记已解除）——`pick_object` 必填的 `grasp_pose`
        # 是**目标体在世界系的位置 + 朝向**（不是 TCP/指尖位姿）：适配器会拿 `position` 与
        # `data.xpos[target_body]` 在 `pose_tolerance_m` 内核对、拿 `orientation` 推出接近轴
        # （`iraf_adapters/mujoco/mujoco_backend.py: pick_object` / `_resolve_grasp_axis`）。
        # 声明侧唯一合法来源是**场景报告的 `targets[]`**（报告由构建器从模型写出 ⇒ 与模型同源）
        # ⇒ 用来源键 `grasp_pose_from: report_target` 做契约适配，场景声明里不写坐标。
        # ⚠ 更正一处我先前的误判（留痕）：曾把来源写成臂侧参考姿态求解器
        # `scripts/build_piper_baseline.py: build_reference_poses` —— 它给的是 home/approach/
        # grasp/lift 的**关节空间**参考姿态（TCP 轨迹用）。结论以适配器对该参数的**用法**为准，
        # 不从名字推断。
        # ~~以下为已解除的待交付登记（保留原文供追溯）~~
        # ⚠ 待交付（卡的**不是**判据，是本步的**输入**）：`pick_object` 的输入契约
        # （`skills/pick_object/pick_object.input.json`）还要求 `grasp_pose`
        # = {frame_id, position{x,y,z}, orientation{x,y,z,w}}（**世界系笛卡尔**）。
        # 而声明里现有的抓取位姿来源是臂侧参考姿态求解器
        # （`scripts/build_piper_baseline.py: build_reference_poses` ⇒ `config/piper_simulation_baseline.yaml`
        # 的 `grasp` 段），它给出的是 **home/approach/grasp/lift 四个关节空间参考姿态** +
        # 指尖中点笛卡尔量（`grasp.finger_center_m`）与 `approach_direction_world`。
        # "关节空间参考 + 接近方向 → 技能输入的世界系位姿"是一次**契约适配**（属臂侧工作项），
        # 不得在这里手抄一组数字当第二份事实（AGENTS.md 5.3）。
        # （原待交付登记已于 2026-09-24 解除：输入来源由 grasp_pose_from 解析，判据口径已落地。
        #   解除依据是"先看适配器的用法，再定来源"——见上方的误判更正。）
        # 判据口径（2026-09-24 落地，此前 exit 2 的卡点已解除）：
        #   · 三项判据的**测量量全部来自技能证据**（不推算）——
        #     `pose_tolerance_m` ← evidence.grasp_alignment.center_distance_m（抓取点对齐误差）
        #     `min_lift_delta_m` ← evidence.lift_delta_m（提起高度）
        #     `require_bilateral_contact` ← evidence.bilateral_contact（布尔量，按 1.0/0.0 与 true 比）
        #   · 阈值出处是声明而不是脚本默认值：`config/machines/piper.yaml:
        #     robot.backend_config.target_tolerance_m = 0.005`（与臂侧基线 acceptance.pose_tolerance_m
        #     同值）与 `gripper.min_lift_delta_m = 0.02`；
        #   · 评测期缺字段 ⇒ 该条判据**判失败**（不静默通过），见 scripts/scenario.py 的
        #     CRITERION_SPEC / measure_step。
        criteria:
          pose_tolerance_m: 0.005
          min_lift_delta_m: 0.02
          require_bilateral_contact: true
      - id: s04_place_in_tray
        action: place_object
        robot: piper
        params:
          place_target_id: tray_01
          payload_id: box_01
          duration_ms: 12000
        # 临时启用做验收（§11.23(41)(g)：焊缝 release_gripper + 滑移判据 + 静态台架 + 自碰撞排除）。
        criteria:
          require_release: true
          require_payload_in_tray: true
          max_offset_from_tray_center_m: 0.06
      - id: s05_confirm_payload
        action: accept_payload
        robot: unitree_go2
        params:
          payload_id: box_01
          place_target_id: tray_01
        # 载荷确认（2026-09-28 §11.23(42)）：由**四足侧独立复核**载荷是否落在接收体承载面上且整链静止
        # —— 不复用臂侧 s04 的证据（否则等于"自己证明自己"）。判据口径见 scripts/scenario.py 的 CRITERION_SPEC：
        #   require_payload_confirmation ← evidence.payload_on_target（与接收体有接触 且 最低点不高于承载面）
        #   max_accept_offset_m 0.06     ← 与 s04 同口径（托盘 0.24×0.16、方块 0.05）
        #   max_accept_speed_mps 0.01    ← "已静止"工程上界（s02 停靠实测 0.000196922、s03 抓取 0.000208312；
        #                                   整链末速取所有自由关节线速度上界 ⇒ 留约两个数量级余量）
        criteria:
          require_payload_confirmation: true
          max_accept_offset_m: 0.06
          max_accept_speed_mps: 0.01
      # 【2026-09-29 新增 · I2】s02b：从 A 站走到**B 站**（第二台臂 UR5e 侧）并停靠。
      # 为什么排在这里：前面的 s03/s04 是"Piper 把方块放进**停在 A 站**的托盘"，
      # 全程要求狗在 A 站 ⇒ 换站必须发生在载荷确认**之后**（改前序步骤的时序会废掉既有验收数字）。
      # 目标用**站名**（声明 config/go2_joint.yaml 的 dock_for_handoff.stations.handoff_b），
      # 步骤里**不出现坐标**；`station` 是 dock_for_handoff 唯一允许的输入键（见技能输入契约）。
      # 判据与 s02 同口径（同一停靠能力、同一测量依据：技能 evidence 的
      # final_translation_error_m / |final_yaw_error_deg| / final_speed_mps）。
      - id: s02b_dock_station_b
        action: dock_for_handoff
        robot: unitree_go2
        params:
          station: handoff_b
        criteria:
          translation_error_max_m: 0.03
          yaw_error_max_deg: 2.0
          max_speed_m_s: 0.05
      # 【2026-09-29 新增 · I2】s05b：到达 B 站后**再复核一次载荷仍在托盘**。
      # 为什么必须有（不是重复劳动）：s04/s05 证明的是"停在 A 站时载荷进了托盘"；
      # 狗从 A 走到 B 是**带载行走**，方块可能被颠出托盘 ⇒ 这一段必须有自己的实测证据，
      # 否则"运输"就只是"走过去"而没有"东西还在"。判据与 s05 同口径（同一测量函数）。
      - id: s05b_confirm_payload_at_b
        action: accept_payload
        robot: unitree_go2
        params:
          payload_id: box_01
          place_target_id: tray_01
        criteria:
          require_payload_confirmation: true
          max_accept_offset_m: 0.06
          max_accept_speed_mps: 0.01
    faults: []

  fault_sensor_loss:
    description: 停靠阶段雷达不可用：不得继续自主停靠，必须进 SAFE_HOLD 且禁止伪造成功（AGENTS.md 1.5/1.6）。
    steps:
      - id: f01_stand
        action: stand
        robot: unitree_go2
        params: {}
        criteria:
          min_stable_hold_s: 3.0
          max_speed_m_s: 0.05
      - id: f02_dock
        action: dock_for_handoff
        robot: unitree_go2
        params: {}
        # 2026-09-24：与 nominal.s02_dock 同因、同步解除（能力已声明）⇒ 本故障注入点恢复可执行，
        # 故障可被真正注入（不再是"注入点待交付 ⇒ 未注入"）。
        criteria:
          translation_error_max_m: 0.03
          yaw_error_max_deg: 2.0
          max_speed_m_s: 0.05
      - id: f03_safe_hold
        action: stop
        robot: unitree_go2
        # 停机原因由本场景的 fault 声明承载：`stop` 技能的输入 schema 是
        # `additionalProperties: false` 且没有 properties，塞 `reason` 会被 Policy 判为参数非法
        # （声明合法但参数非法 = 运行时才炸，属声明缺陷，已在步骤 18 修正）。
        params: {}
        criteria:
          min_stable_hold_s: 3.0
          max_speed_m_s: 0.05
    faults:
      # 本故障的注入点是 f02_dock（待交付步骤）⇒ 本战役**无法注入**，只会被登记为未注入
      # （报告 faults[].injected=false + 原因）；`--require-injected-faults` 会让它变成硬失败。
      # 可注入的同型故障见 fault_sensor_unavailable（注入点是可执行的 stand）。
      - id: lidar_loss
        at_step: f02_dock
        kind: sensor_unavailable
        target: payload_lidar
        expect:
          terminal_state: SAFE_HOLD
          fake_success_forbidden: true
