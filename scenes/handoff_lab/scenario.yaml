schema_version: iraf.scenario-catalog/v1
# S2 脚本化场景（决策 6.A：先 S2 再 S1，S3 遥操作本轮不做）。
# 执行器已由步骤 18 交付（`scripts/scenario.py list|run`）；本文件只声明步骤、判据与故障注入项，
# 阈值不在这里之外的地方出现（铁律 5.3）。执行器可评测的判据只有三个（口径见其模块 docstring）：
# `min_stable_hold_s`（本步推进的仿真时间）、`max_speed_m_s`（步骤结束时实测末速）、`timeout_s`（墙钟）。
# 其余判据名（pose_tolerance_m / min_lift_delta_m / …）属尚在研究中的步骤，声明它们会让预检失败（退出码 2）。
# 步骤状态机沿用 docs/iraf-piper-quadruped-simulation.md §5 的 delivery_handoff：
# VERIFY_READY -> DOG_DOCKING -> ARM_PERCEIVE -> ARM_GRASP -> PLACE_IN_TRAY -> DOG_CONFIRM -> DOG_DELIVER，异常进 SAFE_HOLD。
scene: scene.yaml
simulation: true

scenarios:
  # 本战役（x86-first）**可执行**的场景：只用已验收的 stand/stop 能力，判据取实测值 + 余量
  # （实测证据 build/iraf-24h/18/probe-step-metrics.json：stand 推进 8.0 s / 末速 3.04e-05 m/s / 墙钟 0.43 s；
  # stop 推进 3.0 s / 末速 9.18e-04 m/s / 墙钟 0.60 s）。停靠/抓取/放置/载荷确认属 U5/U6，
  # 在 `nominal` 里登记为待交付。
  stand_stop:
    description: 可执行子集（S2 回归）：四足站立保持 → 松力停机。判据全部是"结果"判据（仿真时间推进量 + 实测末速 + 墙钟），不是"命令已发出"。
    steps:
      - id: ss01_stand
        action: stand
        robot: unitree_go2
        params: {}
        criteria:
          # 8.0 s 推进量 ≥ 3.0：站立窗口成立（物理稳定性证据见步骤 15 的 loopback 验收，两者不可互换）。
          min_stable_hold_s: 3.0
          # 末速上限取机型声明里已有的 stop.speed_tolerance_mps = 0.05 m/s（不另造数字），实测 3.04e-05。
          max_speed_m_s: 0.05
          # 墙钟上限：实测 0.43 s，技能租约 30 s，留 23 倍余量。
          timeout_s: 10.0
      - id: ss02_stop
        action: stop
        robot: unitree_go2
        params: {}
        criteria:
          # 停机同样要推进声明的停机时长（3.0 s），否则"停"只是一条命令。
          min_stable_hold_s: 1.0
          max_speed_m_s: 0.05
          timeout_s: 5.0
    faults: []

  # 故障注入（本战役交付的"传感器不可用"类）：注入点必须是**可执行**步骤，
  # 否则故障无法注入，只会被登记为"未注入"（见 fault_sensor_loss）。
  fault_sensor_unavailable:
    description: 站立阶段载荷雷达不可用：拒绝进入机动序列，只允许声明的安全动作（stop），进入 SAFE_HOLD，禁止伪造成功（AGENTS.md 1.5/1.6）。
    steps:
      - id: u01_stand
        action: stand
        robot: unitree_go2
        params: {}
        criteria:
          min_stable_hold_s: 3.0
          max_speed_m_s: 0.05
      - id: u02_safe_hold
        action: stop
        robot: unitree_go2
        params: {}
        criteria:
          min_stable_hold_s: 1.0
          max_speed_m_s: 0.05
    faults:
      - id: lidar_loss
        at_step: u01_stand
        kind: sensor_unavailable
        target: payload_lidar
        expect:
          terminal_state: SAFE_HOLD
          fake_success_forbidden: true

  nominal:
    description: delivery_handoff 标称序列：四足站立并停靠 -> 机械臂抓取 -> 放入托盘 -> 载荷确认。判据全部是"结果"判据，不是"命令已发出"。
    steps:
      - id: s01_verify_ready
        action: stand
        robot: unitree_go2
        params: {}
        criteria:
          # 末速上限 0.05 = 机型声明的 stop.speed_tolerance_mps（原写 0.0 是未实测的愿望值：
          # 实测末速 3.04e-05 m/s，永远不可能恰好为 0）。判据只允许来自声明与实测。
          min_stable_hold_s: 3.0
          max_speed_m_s: 0.05
      - id: s02_dock
        action: dock_for_handoff
        robot: unitree_go2
        params: {}
        # 停靠（DOG_DOCKING）属 U5/U6 集成：需要 navigate/dock 能力，本战役不交付
        # （四足首期只有 stand/stop，locomote 都只交付拒绝路径），必须显式登记待交付，
        # 不得因为"本体 profile 已交付"就默认该能力已具备。
        pending_closed_by: "步骤 18"
        pending_reason: 停靠/导航能力未验收（决策 4.B 首期只交付 stand/stop）；本步骤只声明目标序列与判据。
        criteria:
          translation_error_max_m: 0.03
          yaw_error_max_deg: 2.0
          max_speed_m_s: 0.05
      - id: s03_pick
        action: pick_object
        robot: piper
        params:
          target: box_01
        # ⚠ 失败口径更正（2026-09-24 实测）：本文原先写"未声明 robot.backend 绑定 ⇒ 退出码 3"，
        # 但机型运行时绑定 `config/machines/piper.yaml` 已经存在 ⇒ **绑定普查通过**，
        # 预检真正卡在**判据**：本步的三项判据在本执行器里没有评测依据（下面的 criteria 段），
        # 实测 `scenario.py run --scenario nominal` ⇒ **退出码 2**（SCENARIO_DECLARATION_ERROR），
        # 报 `步骤 s03_pick 声明了本执行器没有评测依据的判据 ['pose_tolerance_m', 'min_lift_delta_m',
        # 'require_bilateral_contact']`。
        # 这三项的量测口径依赖"机械臂已接入同一个仿真模型"——而当前场景构建产物里**没有臂**
        # （`build/scenes/handoff_lab/handoff_lab.xml` 是 `<mujoco model="go2">`、19 个 body；
        # `scripts/build_scene.py` 每次只装配一个本体）⇒ 与四足侧"世界固定站位帧"是同一根因，
        # 见 `.hermes/plans/2026-09-23-dock-for-handoff.md` §11（A/B/C 三方案待人工决策）。
        # 可执行子集见 stand_stop。
        criteria:
          pose_tolerance_m: 0.005
          min_lift_delta_m: 0.02
          require_bilateral_contact: true
      - id: s04_place_in_tray
        action: place_object
        robot: piper
        params:
          target: box_01
          destination: tray_01
        # place_object 属 U6 交接集成，不在本战役实现范围内：显式登记待交付，
        # 不得因为"piper 是既有本体"就默认该能力已具备（scene_check 会拒绝无登记的步骤）。
        pending_closed_by: "步骤 18"
        pending_reason: 交接集成的放置技能（PLACE_IN_TRAY）属 U6，本轮只声明目标序列，执行器未实现。
        criteria:
          pose_tolerance_m: 0.01
      - id: s05_confirm_payload
        action: accept_payload
        robot: unitree_go2
        params: {}
        # 载荷确认（DOG_CONFIRM）依赖托盘载荷传感与交接集成（U6），本战役未交付：显式登记。
        pending_closed_by: "步骤 18"
        pending_reason: 载荷确认能力未验收（需要载荷传感与 U6 交接集成），本轮只声明判据。
        criteria:
          require_payload_confirmation: true
          max_speed_m_s: 0.0
    faults: []

  fault_sensor_loss:
    description: 停靠阶段雷达不可用：不得继续自主停靠，必须进 SAFE_HOLD 且禁止伪造成功（AGENTS.md 1.5/1.6）。
    steps:
      - id: f01_stand
        action: stand
        robot: unitree_go2
        params: {}
        criteria:
          min_stable_hold_s: 3.0
          max_speed_m_s: 0.05
      - id: f02_dock
        action: dock_for_handoff
        robot: unitree_go2
        params: {}
        # 与 nominal.s02_dock 同因：停靠能力未验收，显式登记待交付。
        pending_closed_by: "步骤 18"
        pending_reason: 停靠/导航能力未验收（决策 4.B 首期只交付 stand/stop）。
        criteria:
          translation_error_max_m: 0.03
          yaw_error_max_deg: 2.0
          max_speed_m_s: 0.05
      - id: f03_safe_hold
        action: stop
        robot: unitree_go2
        # 停机原因由本场景的 fault 声明承载：`stop` 技能的输入 schema 是
        # `additionalProperties: false` 且没有 properties，塞 `reason` 会被 Policy 判为参数非法
        # （声明合法但参数非法 = 运行时才炸，属声明缺陷，已在步骤 18 修正）。
        params: {}
        criteria:
          min_stable_hold_s: 3.0
          max_speed_m_s: 0.05
    faults:
      # 本故障的注入点是 f02_dock（待交付步骤）⇒ 本战役**无法注入**，只会被登记为未注入
      # （报告 faults[].injected=false + 原因）；`--require-injected-faults` 会让它变成硬失败。
      # 可注入的同型故障见 fault_sensor_unavailable（注入点是可执行的 stand）。
      - id: lidar_loss
        at_step: f02_dock
        kind: sensor_unavailable
        target: payload_lidar
        expect:
          terminal_state: SAFE_HOLD
          fake_success_forbidden: true
