schema_version: iraf.scene/v1
id: handoff_lab
description: 交接实验室场景（Piper 机械臂 + 宇树 Go2 + 人形静态实体）：delivery_handoff 场景交互演示与回归的载体。本文件是场景的唯一事实来源，脚本只读不写。
# 仿真场景必须显式声明（AGENTS.md 1.7）：任何基于本场景的结论都不得表述为真机/实时能力。
simulation: true

# 物理口径（存在附加本体的联合世界必须声明；缺声明即拒绝构建，见 §11.23）：
# 合成产物的 <option> 会从**主模型**（厂商 Go2 模型 vendor/unitree_go2/.../go2.xml:4）
# 继承 `cone=elliptic impratio=100`，而同一台 Piper 在**自己的世界**里用的是 MuJoCo 默认
# （cone=pyramidal impratio=1）——之前"夹持能搬 0.20 m 以上"就是在后者量的 ⇒ 跨世界不可移植。
# 【本轮 A/B 实测】改声明会**真实改变**结论：声明为 pyramidal/1（臂世界默认）后，s03 pick 直接
# 失败、s02 停靠误差 0.028569272 → 0.026639029 —— 证明"跨世界口径"确实有因果。
# 因此本场景**冻结为现行通过 s01–s03 的那一组**（= 厂商 Go2 模型的取值），把它从隐式继承变成显式声明；
# 单本体世界（piper 自己世界，无 <option> ⇒ pyramidal/1）与这里的差异是**已登记的债**：
# 单本体侧的夹持/接触结论在引用到联合世界前必须在同一口径下重测。
# **共享植物的推进口径（2026-10-05 §11.87）**：联合世界必须显式声明（缺声明即失败，
# 与 world_physics 同一纪律——否则会静默跑一次"每次初始状态都不同"的验收）。
#   true  = 需求闸门：guest（臂）执行步骤期间，owner 的自由推进线程只在 guest 登记的目标
#           之内推进，没人要时间就一步不推 ⇒ 推进量与挂钟无关 ⇒ 结果可复现
#           （实测：置 true 后 A、B 两站末态逐位复现；false 时 B 站在 1.8785~5.2865° 之间跳）。
#   false = 旧行为（驻留线程并发推进，实际步数 = 请求量 + 挂钟决定的超出量，实测 17×）。
plant_demand_gate: true

world_physics:
  cone: elliptic
  impratio: 100
  # **步长（2026-09-30 §11.35/§11.36）**：这里保持继承（MuJoCo 默认 0.002 s），**但已判死其副作用**：
  # UR5e 的厂商标定位置伺服（kp=2000/500、kv=400/100）在小惯量腕关节上 `kv·dt/J` 远超稳定界 ⇒
  # **逐步数值颤动**（实测肘 qvel 每 2 步翻符号、周期 0.004016 s = 2.008·dt、wrist_2 全程饱和、
  # 静态保持残余 0.049657413 rad）。**把 dt 降到 0.001 确实消除颤动**（残余 −8.2e-08 rad），
  # 但同时动了步态动力学与植物步进节奏：实测 s02_dock 临界失败（平移 0.030162 > 判据 0.030）⇒
  # s03 报"等待 owner 推进到第 29501 步超时（0.030 s，当前 29500 步）"⇒ s04/s05/s05b 连锁失败。
  # ⇒ 换步长不能单独启用。可行的两条路（下一步择一，都要全量重跑验收）：
  #   ① 保持 dt=0.002，给**附加本体**注入与 dt 匹配的**阻尼上界**（只缩 kv、不动 kp 的细口径）；
  #   ② 启用 dt=0.001，同时重调 s02 停靠验收与植物步进节奏（涉及 go2/MPC 与 residency 时序）。
  # timestep: 0.001

seed:
  base: 20260920
  randomization: false

terrain:
  kind: flat
  friction: "1.0 0.02 0.001"
  # 工作台字段名与 config/*_simulation_baseline.yaml 的 workbench 段一致（复用既有字段名）。
  workbench:
    top_z_m: 0.0
    # 台面半边长（m）：0.8 → 1.5（3 m 见方）。依据：使用者实测反馈
    # 「台阶做大一点，不然机器人容易跑不见了」——原地踏步含重心转移，边距越大越不容易走到台边；
    # 顶面 z 与摩擦不变（不改物理接触面，只扩大水平范围）。
    half_size_m: 1.5
    half_thickness_m: 0.025
    friction: "1.0 0.02 0.001"

# 本体清单。capabilities 只写**已交付并验收过**的能力：
# 未交付的本体用 profile: {state: unverified, closed_by, reason} 显式占位，能力数组留空。
robots:
  - id: piper
    kind: arm
    role: manipulator
    profile: profiles/piper_mujoco.yaml
    # 场景 id（piper）与 Profile 身份（piper_mujoco）不同名 ⇒ 显式映射（硬校验，不隐式放行）
    profile_name: piper_mujoco
    capabilities: [move_joint, pick_object, visual_pick, place_object, stop]
    # 联合模型里的**相对位姿**（世界系）：只有 `--attach piper` 时才被消费（单本体产物不变）。
    # 取值依据：① 距交接站位 `handoff_station_frame`(0.45, 0) 的水平距离 = 0.45 m
    #   ≤ 工具点在托盘高度（z≈0.347 m）的可达环带上界 0.594284 m（§11.1 实测）；
    #   ② 落在四足出生点→站位的路径之外（y = −0.45，四足躯干半宽 ~0.2 m ⇒ 不挡路）；
    #   ③ 台面 half_size_m=1.5 ⇒ 在台面内。yaw=90°（quat_wxyz 绕 z 转 90°）令臂正面朝站位。
    # 继承 manipulation 事实的来源（臂自己的场景报告）：联合报告据此得到 gripper/targets，
    # 名字按"仅当加前缀后存在于联合模型"的规则改写（见 scene_builder._joint_manipulation）。
    manipulation_report: build/models/piper-pick-scene.json
    # 联合模式的**参考姿态求解器**（构建器只按此声明调用；构建器内不出现机型/脚本名，AGENTS.md 6.3）。
    # 为什么必须有：继承来的 home/approach/grasp/lift_positions 是在**臂自己基座系**里解出的关节解
    #   （MJCF 的 qpos 是局部量），附加本体一旦有 placement 就直接不适用
    #   （实测残差 0.367696068 m；把目标换算到基座系重解 ⇒ 0.018389447 m；连 pad_offset 一起重解
    #    ⇒ 5.681e-06 m。见 docs/debug/2026-09-24-joint-model-dog-arm.md §11.5）。
    # 契约（见 `src/iraf_adapters/unitree/scene_builder.py: _joint_reference_resolution`）：
    #   · entry(root, baseline_doc, target_xy_override_m=[x,y], target_z_override_m=z)
    #       → {home, approach, grasp, lift}（home 为扁平字典，其余为 {joint_positions: {...}}）
    #         且含 finger_height_correction_m —— 即该场景下的 `pad_offset_m`（不是通用常数：
    #         它由本场景的方块尺寸与指尖离台配平决定）。
    # 机型数字不写在这里：`baseline` 指向臂侧基线配置（单一事实来源）。
    reference_solver:
      module: scripts/build_piper_baseline.py
      entry: build_reference_poses
      # 放置四段（构建期解出、后端回放；见 §11.16/§11.17/§11.18）。
      # ⚠ 这是**构建期**声明，与"能力声明"无关：它只让构建期解出放置航点并做自检，
      # 不会让任何东西在运行期执行（能力仍由 profile/场景 capabilities/策略/适配器四处决定）。
      # ⚠ 回退"临时启用"时**不要**用 `git checkout -- scenes/handoff_lab/scene.yaml`：本文件同时承载
      # 能力列表与本声明，整体回退会把本声明一起删掉（这个坑我踩了两次）。请只改 `capabilities:` 那一行。
      place_entry: build_place_reference_poses
      # 前馈在**联合模型**上重算：增量 = τ_g / kp，且必须按相位的**完整**位置指令（含夹爪 joint7/8 开合），
      # 否则量到的是"手指卡在方块里"的动力学。自带判据：四姿态静态保持残余 ≤
      # config/piper_simulation_baseline.yaml: gravity_feedforward.tolerance_rad（0.001），否则构建失败。
      # 2026-09-28：方块移到臂旁边（0.240416306 m）后重解姿态不再侵入方块 ⇒ 该判据首次可通过。
      feedforward_entry: build_reference_feedforward
      baseline: config/piper_simulation_baseline.yaml
    placement:
      # 基座高度 = 0.0（台面）。**已实测的两难**（§11.23(30)）：托盘顶面 0.449 m 处要求腕部
      # 0.67 m > 可达 0.594 m（Go2 背高 0.288 m ⇒ 这条臂够不到狗背托盘），放置航点因此落在
      # **翻转分支**；把基座抬到 +0.06 警告仍在，抬到 +0.10 则 **pick 门禁被打破**
      # （残差 0.0999928 ≫ 0.005）⇒ **不存在同时满足两侧的基座高度**，属布置层面问题：
      # 需要抬高拾取点（如给方块加台架）或改用更低/侧向的交接平台。
      # **基座高度 0.0（台面）**。2026-09-28 §11.23(41) 曾据一次误读把它抬到 0.02/0.008，
      # 已回退：`piper_link1 ↔ world` 的 9.21×10⁸ N 接触**不是**基座扎地面，而是厂商 MJCF 的
      # **安装基座网格（挂在 world 下、并入主世界）与 link1 网格的自重叠**（设计上重叠 6 mm；
      # link1 是铰链子体 ⇒ MuJoCo 不跳过这一对）。真正的修法是声明化的自碰撞排除
      # （`profiles/piper_mujoco.yaml: spec.model.self_collision_excludes`），与基座高度无关。
      # 抬高 8 mm 的副作用：s03 的抓取门禁暴露出"目标 z 来自臂侧基线而非联合世界 FK"的既有错位
      # （distance=0.008210m），故一并回退。
      # 历史两难（§11.23(30)）仍然有效：狗背托盘 0.449 m 处腕部需求 0.67 m > 可达 0.594 m。
      # 【2026-09-29 抬臂基座 0.12 m —— 本行生效】使用者要求"在机械臂下面新增基座、抬高机械臂，
      # 用于把方块放到狗的背上"。可达性只有一个不等式：腕部需求 = sqrt(0.45² + (Δh + 0.26)²) ≤ 0.594284，
      # Δh = 托盘承载面 − 臂 joint1 轴。托盘复位到狗背 `tray_frame` 后承载面 ≈ 0.350372 m、
      # joint1 轴 = 0.12 + 0.123 = 0.243 m ⇒ Δh = 0.107372 ⇒ 腕部需求 **0.58105 m** ≤ 0.594284（余量 1.3 cm）✓
      # 上面那段"两难"（抬到 +0.10 时 pick 门禁残差 0.0999928）为什么不再是障碍：
      #   那是在提交 9465e85 修掉两处"基座 z=0 时休眠"的坐标系 bug **之前**量的 —— `target_z_override_m`
      #   当时传的是**世界 z**（xy 却已是臂基座系）⇒ 抓取门禁残差恒等于基座高度（0.0999928 ≈ 0.10 即该假象）。
      #   修好后抬高布置**从未重建过** ⇒ 本次重建才是判据（0.12 的等价仪器已自检通过，见 §11.23(45)(d3)）。
      pos_m: [0.45, -0.45, 0.12]
      # 偏航 = 基座→方块方位角（135.000000°）：让 joint1≈0 ⇒ 夹爪面与方块面平行（§11.6 实测：
      # 偏航偏 31.3° 时指腹斜切方块棱边并与之重叠）。站位 (0.45, 0) 仍在可达范围内（距基座 0.45 m）。
      quat_wxyz: [0.382683432365090, 0.0, 0.0, 0.923879532511287]
    note: 既有能力（MuJoCo 仿真已验收）；本场景复用配置 config/piper_simulation_baseline.yaml，不改其语义。
  # 【2026-09-29 新增】第二台机械臂 UR5e+2F-85（双臂轮转演示的"卸货"侧）。
  # 与 piper 的差异全部落在**声明**里（构建器内不出现机型/脚本名）：
  #   · 参考姿态求解器指向**机型无关**的通用入口 scripts/build_robot_baseline.py: build_reference_poses
  #     （与 piper 的 build_piper_baseline.py 同一契约：entry(root, baseline_doc,
  #      target_xy_override_m, target_z_override_m)），基线指向 config/ur5_simulation_baseline.yaml；
  #   · 没有 place_entry（该基线未声明"放置段"）⇒ 联合报告的 place_targets 不由它提供；
  #   · 安装面 0.12 m 的抬高是 piper 的**可达性需要**（工具点可达环带上界 0.594284 m），
  #     本臂不需要：基座直接坐在台面 top_z_m = 0.0 上。
  # 安装面实测依据（scripts/ur5e_base_aabb_probe.py，从网格顶点算，不用包围球）：
  #   base body 的网格顶点世界系最低 z = −9.021622823790487e-10 m（即安装面就是基座原点平面），
  #   且该 body 的 2 个 geom 都是 visual（geom_contype/geom_conaffinity = 0）⇒ 与工作台不产生接触。
  # 【2026-09-29 修订】基座位置与朝向（修订原因见下，两处都是**我上一轮写错/需要让位**）：
  #   · 位置 (0.45, 0.45) → **(0.45, 0.90)**：B 站定在 (0.45, 0.45) 后，臂必须在"自己站位"
  #     正前方 0.45 m ⇒ 基座沿 +y 让出狗走的走廊（狗走 x=0.45、y ∈ [0, 0.45]）；
  #     这样 A 站(0.45,0) / B 站(0.45,0.45) / UR5e 基座(0.45,0.90) 三点共线且等距 0.45 m。
  #   · 偏航 270° → **90°**（**修正上一轮我写错的方向**）：厂商模型在 `shoulder_pan=0` 时
  #     前伸方向是 **−x**（scripts/probe_ur5_workspace.py 实测 pinch=[−0.492,−0.134,0.488]、
  #     "指向与 −z 的 cos"=1.0000）⇒ 要让"名义正面"朝 **−y** 的 B 站，偏航必须是 90°
  #     （270° 会把它转到 +y，即背对站位）。该臂 `shoulder_pan` 覆盖全周（方位 36/36），
  #     所以偏航不影响可达性，但声明必须与意图一致。
  #   · yaw=90° ⇒ quat_wxyz = (cos45°, 0, 0, sin45°)。
  # capabilities 为**空**：本增量只验证"第二条臂能进同一个物理世界"（同一份 MJCF、同一株共享植物、
  #   同一份 mjData）。它在联合场景里的技能（从狗背托盘卸载方块）尚未验收 ⇒ 不声明能力
  #   （AGENTS.md 1.5 / 6.3：未验收不得声明；能力四处必须成对同步）。
  - id: ur5e
    kind: arm
    role: manipulator
    profile: profiles/ur5_mujoco.yaml
    # 门禁要求"Profile 身份与本体 id 一致"（id 是 ur5e、Profile 名是 ur5_mujoco）⇒ 显式映射。
    profile_name: ur5_mujoco
    # 【2026-09-29 更新】I1b 完成后本臂已能在联合世界解析自己的关节/指爪/执行器
    # （per_robot[ur5e] resolved=true、name_map 47 条），且抓取位形经**区间包含**判据自证合格
    # （载荷高度区间 [0.350372, 0.400372] ⊇ 指腹接触带 [0.365991541, 0.36600234]；
    #   横向残差 9.4e-6；腕→指腹轴朝下 dot 1.0）。
    # ⇒ 声明 `pick_object`（该臂 Profile 已声明此能力；本场景的验收由 I3 的卸载步承担）。
    # ⚠ 声明能力 ≠ 已验收：卸载步（s06）跑绿后才有本场景的验收证据，未绿则按纪律剔回。
    # 【I4-a 2026-09-30】声明放置能力：卸载后把方块放到台面落点垫（s07）。
    # ⚠ 声明 ≠ 已验收：s07 跑绿后才有本场景的验收证据，未绿则按纪律剔回。
    # 能力五处同步：本文件 + 策略 allowed_skills + 适配器 CAPABILITY_METHODS/IMPLEMENTED + 机型规范词表。
    capabilities: [pick_object, place_object]
    manipulation_report: build/models/ur5-pick-scene.json
    reference_solver:
      module: scripts/build_robot_baseline.py
      entry: build_reference_poses
      baseline: config/ur5_simulation_baseline.yaml
      # 本臂在**本联合场景**里的目标是 **B 站托盘里的载荷**（世界系）：
      # 托盘名义承载面 0.350372 + 载荷半高 0.025 = 0.375372；站位 (0.45,0.21) 距基座 (0.45,0.90) 0.69 m ✓
      # ⚠ **本键与站位帧 `handoff_station_frame_b` 是同一事实的两处**（2026-10-08 实测教训）：
      #   站位 0.45 → 0.21 时若不同改，运行期报「实测目标 live=[0.425852,0.178727,0.371967] vs
      #   名义解 [0.45,0.45,0.375264] 差 0.272365942 m > 上限 0.07」⇒ s06 被拒（s07 级联失败）。
      #   已登记的消债项：本键应改为**从载体站位帧派生**（与 `place_targets[].nominal_pose_m`
      #   同一算法），而不是手抄世界坐标。
      # ⚠⚠ 2026-10-08 **联合可达性实测（本轮决定性负结果，改动已回滚）**：把本键与站位**同时**
      #   改到 (0.45,0.21) 后**构建直接拒绝装配**（fail-closed）：`参考姿态相位 home 的求解残差
      #   0.024677363 m 超过声明容差 0.000010000 m ⇒ 该位形不可用`。
      #   几何：臂基座 `placement.pos_m=(0.45,0.90,0)`、托盘到基座 dy=0.69、home 抬升 0.10 ⇒
      #   目标高 0.635 ⇒ √(0.69²+0.635²)=0.94 m > 可达 0.85 m。
      #   ⇒ 可达性边界：√(dy²+0.635²) ≤ 0.85 ⇒ **dy ≤ 0.565 m**，即站位最多只能移 −0.115 m
      #     （y ≥ 0.335）；而该处**放置侧净空只有 +0.022524 m**（< 停靠容差 0.030）。
      #   ⇒ **结论：单挪站位换净空这条路不成立**。要清碰撞必须**联合解**下面三者（任一单独动都撞墙）：
      #      · `placement.pos_m`（臂基座，现 (0.45,0.90,0)）——挪基座可同时改变"可达"与"净空"
      #      · `baseline_overrides.grasp.home_rise_m`（现 0.10）——降低可放宽可达边界（dy 可更大）
      #      · 站位 y 与放置四段航点朝向（④ `grasp.place_approach_direction`，UR5e 目前未声明）
      #   ⇒ 下一轮做法：先用净空探针 + 一个"可达性快速判据"（√(dy²+home_z²) ≤ reach）**扫基座位置**，
      #      找到"净空 ≥ 0.030 且 home 可达"的交集，再落声明；不要再单动站位。
      target_override_world_m: [0.45, 0.45, 0.375372]
      # **重力前馈**：本臂**暂时仍继承臂侧值**（2026-09-30 §11.31 判死记录）——
      # 声明 `feedforward_entry: build_reference_feedforward` 后，构建期在联合模型上重算**被它自己的
      # 静态保持门禁拦下**：4000ms × 最多 4 轮后最大关节误差 **0.049653448 rad**（限 0.001000000 rad），
      # 残余最差 elbow 0.049653448 / wrist_1 0.026336102（第 1 轮 0.049861021，收敛极慢）
      # ⇒ 共享公式 `增量 = τ_g / kp` 对本臂在**联合模型里**的执行器不成立（Piper 侧成立）。
      # **重力前馈**在本联合模型上重算（2026-09-30 §11.37 修复后**重开**）：此前失败的真因是
      # dt=0.002 下厂商标定增益的逐步数值颤动（§11.35 判死：残余 0.049657413 rad 是伪影），
      # 已由 `model.attached_actuator.armature_min_kg_m2: 0.5` 消除（残余 −8.2e-08 rad）⇒ 重算可过。
      feedforward_entry: build_reference_feedforward
      # **放置段入口（I4-a，暂缓——2026-09-30 §11.50 判死）**：本想走"共享转发"（同 §11.31 的前馈入口），
      # 但实测**共享实现不是机型无关的**：`build_piper_baseline.build_place_reference_poses` 内部按
      # **Piper 的资产名**找网格 ⇒ 转发后报 `Piper mesh 不存在: .../ur5e_2f85/base_0.obj`。
      # 而开启本入口会让本臂 `resolved=False`（本臂整段解不出）⇒ **会破坏当前能过的 s06** ⇒ 先注释。
      # 前置（下一轮）：把该求解器的**机型无关部分抽到 core**（几何/四段/判据），资产来源由各基线声明；
      # 在抽取完成前不开启本入口。已落地的其它 I4-a 改动（`place_pad_b` 接收体声明）保留。
      # 【§11.51 已修】共享实现改为**可注入场景生成器**（缺省仍是 Piper 的 ⇒ 对 Piper 逐位不变），
      # 本臂转发时注入自己的 `build_robot_pick_scene.build_scene` ⇒ 资产按其自身声明解析。
      place_entry: build_place_reference_poses
      # **接收体（构建期对齐运行期，§11.57）**：联合报告 `place_targets.targets` 里 `tray_01` 排在
      # `place_pad_b` 前面，而 first-fit 会让本臂也按**托盘**解放置四段 ⇒ 下行段几乎不动
      # （肩抬升只差约 25 mrad），运行期报 `触地纠偏需要竖向移动 -0.316249480 m > max_vertical_m=0.050`。
      # 本臂该放的是**落点垫**（与 `scenario.yaml` 的 s07 `place_target_id: place_pad_b` 同一接收体）。
      place_target_id: place_pad_b
      # **放置时狗停在哪一站（§11.63）**：构建期的航点/路径自检必须把载体摆到它**实际所在**的位姿
      # 再做 FK —— 否则碰撞（实测腕部本体撞狗前左髋 ×80、撞托盘 ×69、撞底座 ×121）**结构上看不见**，
      # 只能运行期才炸。缺声明 = 用模型里的载体初始位姿（旧行为，逐位不变）。
      place_carrier_frame: handoff_station_frame_b
      # **本场景对基线的覆盖**（§11.28，实测驱动）：基线的 `grasp.home_rise_m: 0.30` 在该臂自己的场景里
      # 得到 home 残差 1.5e-07 m；换到本场景（目标距基座 0.45 m、载荷在托盘里）后 home 目标
      # （局部 z = 0.375372 + 0.16 + 0.30 = 0.835372）**不可达** ⇒ 解出的 home 位形夹持区只在 0.420188
      # （残差 4.15e-01 m），且与托盘里的载荷重叠 **31.6 mm** ⇒ 运行期把载荷扫出托盘。
      # 0.10 使 home 高度降到比 approach 高 0.10 m（指腹中点目标 z ≈ 0.635372），仍在 reach 内；
      # 逐相位残差门禁会把这个数字的正确性钉住（构建期不过就是声明错）。
      baseline_overrides:
        grasp:
          home_rise_m: 0.10
    placement:
      pos_m: [0.45, 0.90, 0.0]
      quat_wxyz: [0.707106781186548, 0.0, 0.0, 0.707106781186548]
    note: >-
      UR5e 侧报告 build/models/ur5-pick-scene.json 已可复现（EXIT=0，抓取残差 8.852152079374226e-08）。
      在**本联合场景**里它尚未跑过技能：联合报告的顶层 manipulation/gripper/targets 由
      `model.joint_manipulator: piper` 指定取自 piper，UR5e 的事实以
      `manipulation.attached_manipulators[].resolved = false` **显式**登记为"未解"，
      不允许静默借用 piper 的数字。技能验收见
      .hermes/plans/2026-09-29-dual-arm-shuttle-demo.md 的 I3/I4。
      两台臂同为 manipulator 角色，各自独立进程/权限/设备所有权（AGENTS.md 6.11 不合并安全边界）。
  - id: unitree_go2
    kind: quadruped
    role: carrier
    # 步骤 17 闭合：Profile 与 stand/stop 能力已经过技能层全链路验收
    # （TaskFlow → SkillRuntime → Policy → Provider → 适配器），证据
    # build/acceptance/go2-skills/report.json（simulation=true）。
    # 引用从占位改为路径的同时，capabilities 必须至少一项（schema 的 if/then 门禁）。
    profile: profiles/unitree_go2_mujoco.yaml
    # 2026-09-23 同步：`locomote` 已在**两层验收通过后**声明（Profile 与适配器的
    # IMPLEMENTED_CAPABILITIES 同步更新）。本清单是**场景级**能力声明，必须跟着 Profile 走
    # （同一事实的第二处出现 ⇒ 改 Profile 时必须一并改这里，否则场景层会误拒）。
    #   证据：适配器四工况 build/acceptance/go2-locomote/report.json（passed=true，
    #         forward 误差 0.0659 / backward 0.0571 ≤0.10）+ 技能层
    #         build/iraf-a6a12/skill-layer-run.json（stand/locomote/stop 三步全 SUCCEEDED）
    # 2026-09-24 同步：`dock_for_handoff` 在**适配器层 9/9 验收 + 技能层跑通**后入列。
    # 停靠目标 = 本场景的 `frames[].handoff_station_frame`（worldbody site，世界固定）。
    capabilities: [stand, stop, locomote, dock_for_handoff, accept_payload]
    note: 厂家 MJCF 已探测（12 个力矩型 motor、imu site、无相机/无雷达），仅证明低层模型存在，不代表导航/停靠能力（AGENTS.md 6.8）；场景构建器按本场景声明注入相机/雷达/托盘/道具/光照，厂商文件只读。locomote 已在 MuJoCo 仿真里验收并声明（速度指令可走/转/退，受安全策略 max_speed_mps=0.5 约束；**上板部署证据另计**）；**停靠/放托盘/载荷确认仍未交付**，见 scenario.yaml 的 pending 登记（步骤 18）。
  - id: humanoid_static
    kind: humanoid
    role: scene_entity
    profile:
      state: unverified
      closed_by: "步骤 12"
      reason: 人形资产随 vendor 锁定时登记（哈希 + 许可证）；本战役只作静态场景实体。
    capabilities: [static_model_only]
    model_only: true
    evidence_level: 仅模型
    note: 决策 4.B —— 仅模型，不代表运动能力；不得注册 stand/locomote/navigate 类 Skill。

props:
  - id: box_01
    body: box_01
    kind: box
    geometry:
      type: box
      size_m: [0.025, 0.025, 0.025]
    mass_kg: 0.04
    friction: "2.0 0.05 0.001"
    rgba: [0.82, 0.22, 0.12, 1.0]
    pose:
      # ⚠ 2026-09-28（按使用者要求"方块要在机械臂旁边"）：从 (0.19, 0, 0.025) 移到 (0.28, −0.28, 0.025)。
      # 依据（实测，docs/debug/2026-09-24-joint-model-dog-arm.md §11.7）：原位置离臂基座 0.519711458 m
      #   （近可达上界 0.594284 m）⇒ 重解姿态把腕部 `piper_link6` 插进方块 −0.014516 m，接触力把臂顶离
      #   （保持残余 0.039962049 rad）。新位置：离基座 **0.240416 m**（折叠位形，与臂自己场景 0.19 m 同量级）、
      #   离四足走廊/站位 0.28 m（≥ 躯干半宽 0.2 m，不挡路）。
      pos_m: [0.28, -0.28, 0.025]
      # 朝向保持轴对齐（quat_wxyz [1,0,0,0]）。**已实测的遗留事实**（§11.23(16)）：这个朝向下
      # 夹爪的**闭合轴**在水平面内与方块本征轴成 58.357073° / 31.697082°（= 斜夹"棱"），
      # 斜法向在夹口轴向上有分量 ⇒ 搬运中把载荷楔出去（这就是 s04 丢件的机制）。
      # 修法（面抓）需要连 pick 的抓取/抬升时序一起重设计（转方块 45° 会让 s03 的 `grasped`
      # 判为 false），属**布置级设计决策**，未定案前不改本行。
      # 【诊断结论 2026-09-28】把方块转 45°（面抓）+ 闭爪位 0.015 时，运行时实测：
      #   left_normal_force_n 11.403717 / right_normal_force_n 11.443127 / force_ok **true**
      #   （与离线标定预测的 11.455/11.405 N 相差 0.05 N ⇒ 标定方法有效）
      #   但 lifted **false**、lift_delta_m 1.1e-05（限 0.02）⇒ **夹得住、抬不起来**。
      # ⇒ 面抓路线的真正缺口在 **pick 的抓取/抬升时序**：现在"合爪"发生在 `lift` 段（边升边合），
      #   这套时序是为**斜抓的过盈**调的；面抓没有过盈就抬不动。
      # 【面抓已量化，2026-09-28】改成绕 z 45° 时：闭合轴垂直于方块面（0.759491°/89.589236°），
      # 有效半宽 0.035113138 → 0.025455762，重建穿透 -0.009293 → -0.001092 m；
      # **接触起始**从 ~0.034 变到 ~0.0235（面更窄），而 11.4 N 仍在 0.015 ⇒ 接触后仍要走 8.5 mm。
      # 离线搬运测试（载荷钉住）证明面抓**能搬 +0.042192 m**；不钉住时合爪把载荷推移 1.44 cm。
      # ⇒ 真正要做的是让合爪不推载荷（见 docs/debug/... §11.23(19) 的三条路），不是改这里。
      # 【④ 落地验证 2026-09-28（结果）】"保持"已扩到 接近/下压/张开/合爪 四段（approach_hold +
      # close_hold: pin_payload）；离线真时序扫描（face_grip_closure_sweep_probe.py）在
      # closed ∈ [0.018, 0.023] 全部能托住（+3.8~+4.3 cm），**只有 0.015 被弹出**；
      # 但**运行时**在同档（0.020）仍 `lifted=false`（lift_delta_m 5e-06，载荷被留在台面）
      # ⇒ 离线与运行时仍有差异未查明（这是下一轮的入口，属有界问题）。
      # 【③ 落地后新发现】加 close_hold: pin_payload 后，载荷位移量**没变**
      # （(0.2843960490756126, -0.2655149101371577) ≈ 与之前同量级）⇒ **推移发生在合爪之前**，
      # 即"下压/接近段"就把方块推走了 1.44 cm ⇒ pin 合爪段无效（pin 的是已被推歪的位姿）。
      quat_wxyz: [1.0, 0.0, 0.0, 0.0]
    note: 方块在机械臂旁边（离基座 0.240416 m）；抓取判据按 body 命中，数值由联合模型 FK 回写报告（不看继承值）。
  - id: tray_01
    body: tray_01
    kind: tray
    geometry:
      type: box
      size_m: [0.12, 0.08, 0.01]
    mass_kg: 0.35
    friction: "1.4 0.03 0.001"
    rgba: [0.25, 0.3, 0.35, 1.0]
    pose:
      # 托盘固定在四足背上：位置由被挂载实体与参考系决定，不在这里重复写绝对坐标。
      # 【已落地的备选】把托盘放到**世界固定**的位置（方案②，如站位旁交接台台面 z≈0.20）：
      #   构建器已支持世界固定接收体（`_place_targets` 不再要求 `mount`），放置轴实测朝下
      #   （above/descend/retreat 轴 z = -0.543210901 / -0.549119639），但整链构建卡在
      #   **重力前馈验收**（joint2 静态保持残余 0.025750988 rad > 0.001，尚未诊断，见 §11.23(37)）。
      #   启用时把下面两行换成 `pos_m: [0.62, -0.40, 0.21]` + `quat_wxyz: [1.0, 0.0, 0.0, 0.0]`。
      # 【方案② 的位置扫描结论，2026-09-28 §11.23(38)】把托盘放到**世界固定**的台面上是可行的
      # 能力（见下方 `receiving: true`），但位置窗口很窄：
      #   · (0.62,-0.40,0.21)（|xy|≈0.18 m，贴臂基座）⇒ 放置轴朝下 ✓ 但整链构建卡在重力前馈验收；
      #   · (0.80,-0.75,0.01)（|xy|≈0.46 m，离狗远）⇒ `放置段 above 无可用解`
      #     （残差 0.036913913 m、axis_dot -0.409）⇒ "指腹朝下"的姿态 IK 在这个距离够不到。
      # ⇒ 启用前先做**位置扫描**（构建期，秒级/次）：在 (|xy| 0.2~0.45) × (z 0.02~0.22) 上找可行窗口。
      # **世界固定交接位**（2026-09-28 §11.23(39)）：位置由**构建期扫描**选出 ——
      # 192 个候选（|xy| 0.20~0.45 × 方位 8 个 × z 0.02~0.22）里 43 个可行
      # （IK 残差达标 + 指腹朝下 + 距交接站位 ≥0.40 m）；取贴近站位又不挡腿的一档：
      #   az=225°、|xy|=0.20 m、承载面 z=0.02 ⇒ 世界 (0.309,-0.591,0.02)
      #   实测残差 9.177e-06、下行夹爪轴 z=-0.813（朝下）、距站位 0.608 m（狗腿摆动半径 ~0.3 m）
      # 依据：把交接面放在狗背上几何无解（§11.23(31)：腕部半径 0.707 m > 可达 0.594 m），
      # 侧挂挡腿（§11.23(36)），故改到**站位旁边台面上的托盘**，狗仍走到站位接受交接。
      # 【方位修正 2026-09-28 §11.23(40)】原先取 az=225°（狗的另一侧）⇒ 关节级对账发现
      # **只有 joint1 没动（Δ -1.546856 rad ≈ -88.6°）**：基座偏航要摆近 90° 横穿狗所在区域，
      # 被挡住（其余 5 个关节都跟到位，Δ 1~6 mrad）⇒ 改用**同侧、只需小角度摆动**的可行档
      # （扫描里 az=180°、|xy|=0.20 m、承载面 z=0.02）。
      # 【承载面抬高 2026-09-28 §11.23(41)】**根因修法**：原先承载面只有 0.02 m ⇒ 搬运绕行航点
      # 高度 = 承载面 + 载荷半高 + pad_offset + 间隙 = 0.0839 m ⇒ 方块底面离地仅 ~2 cm。
      # 实测（diag-tray-sameside.log 逐样本）：above 段 j2/j3/j4/j5 全部到目标，**唯 j1 只走 2.7%**
      # （−0.000085 → 0.022176，目标 0.80755），而载荷被拽到指腹下方 −0.0801 m（规划 −0.0539）
      # ⇒ 方块压在台面上（接触 `world`）+ 硬 `<connect>` 约束被拉伸 2.6 cm ⇒ 几百牛的内部力，
      # 经 0.2 m 力臂顶死基座偏航（46° 需 ~350 N·m）⇒ **自锁**。
      # 修法不是"拍一个高度"，而是**扫描**（build/place_position_sweep_probe.py，判据：四段 IK 残差
      # ≤1e-5 + 放置三段夹爪轴 z ≤ −0.2 + 距站位 ≥0.40 + **离地余量 ≥0.15**）。结果：
      #   · 承载面 0.20 m ⇒ 构建被拦（transit 轴翻半球 dot −0.134477；重力前馈 joint3 残余 0.049133939 rad）；
      #   · 承载面 0.12 m ⇒ **77 个可行候选**；取同侧 az=180°、r=0.25 m（世界 (0.20,−0.45,0.12)）：
      #     残差 9.248e-06、轴 z(above/descend) −0.568/−0.596、离站位 0.515 m、离地余量 0.17 m
      #     （搬运绕行时方块底面 0.17 m，离承载面 0.05 m ⇒ 实测 2.6 cm 下垂无法建立自锁）。
      # 【2026-09-29 复位：托盘挂回四足背上（`tray_frame`）—— 上述"世界固定托盘"方案整体让位】
      # 使用者原始剧本就是"把方块放到狗的背上"。当年改走世界固定托盘的原因是**几何不可达**
      # （§11.23(31)：腕部半径 0.707 m > 可达 0.594284 m），而抬臂基座 0.12 m 后需求降到
      # **0.58105 m** ✓。位置改由挂载帧决定（不写绝对坐标）：标称位姿 = 「狗停在交接站位」时的 FK，
      # 构建器记 `pose_source: nominal_docked_station`；运行期一律以实测 FK 为准。
