schema_version: iraf.scene/v1
id: handoff_lab
description: 交接实验室场景（Piper 机械臂 + 宇树 Go2 + 人形静态实体）：delivery_handoff 场景交互演示与回归的载体。本文件是场景的唯一事实来源，脚本只读不写。
# 仿真场景必须显式声明（AGENTS.md 1.7）：任何基于本场景的结论都不得表述为真机/实时能力。
simulation: true

seed:
  base: 20260920
  randomization: false

terrain:
  kind: flat
  friction: "1.0 0.02 0.001"
  # 工作台字段名与 config/*_simulation_baseline.yaml 的 workbench 段一致（复用既有字段名）。
  workbench:
    top_z_m: 0.0
    # 台面半边长（m）：0.8 → 1.5（3 m 见方）。依据：使用者实测反馈
    # 「台阶做大一点，不然机器人容易跑不见了」——原地踏步含重心转移，边距越大越不容易走到台边；
    # 顶面 z 与摩擦不变（不改物理接触面，只扩大水平范围）。
    half_size_m: 1.5
    half_thickness_m: 0.025
    friction: "1.0 0.02 0.001"

# 本体清单。capabilities 只写**已交付并验收过**的能力：
# 未交付的本体用 profile: {state: unverified, closed_by, reason} 显式占位，能力数组留空。
robots:
  - id: piper
    kind: arm
    role: manipulator
    profile: profiles/piper_mujoco.yaml
    capabilities: [move_joint, pick_object, visual_pick, stop]
    note: 既有能力（MuJoCo 仿真已验收）；本场景复用配置 config/piper_simulation_baseline.yaml，不改其语义。
  - id: unitree_go2
    kind: quadruped
    role: carrier
    # 步骤 17 闭合：Profile 与 stand/stop 能力已经过技能层全链路验收
    # （TaskFlow → SkillRuntime → Policy → Provider → 适配器），证据
    # build/acceptance/go2-skills/report.json（simulation=true）。
    # 引用从占位改为路径的同时，capabilities 必须至少一项（schema 的 if/then 门禁）。
    profile: profiles/unitree_go2_mujoco.yaml
    # 2026-09-23 同步：`locomote` 已在**两层验收通过后**声明（Profile 与适配器的
    # IMPLEMENTED_CAPABILITIES 同步更新）。本清单是**场景级**能力声明，必须跟着 Profile 走
    # （同一事实的第二处出现 ⇒ 改 Profile 时必须一并改这里，否则场景层会误拒）。
    #   证据：适配器四工况 build/acceptance/go2-locomote/report.json（passed=true，
    #         forward 误差 0.0659 / backward 0.0571 ≤0.10）+ 技能层
    #         build/iraf-a6a12/skill-layer-run.json（stand/locomote/stop 三步全 SUCCEEDED）
    capabilities: [stand, stop, locomote]
    note: 厂家 MJCF 已探测（12 个力矩型 motor、imu site、无相机/无雷达），仅证明低层模型存在，不代表导航/停靠能力（AGENTS.md 6.8）；场景构建器按本场景声明注入相机/雷达/托盘/道具/光照，厂商文件只读。locomote 已在 MuJoCo 仿真里验收并声明（速度指令可走/转/退，受安全策略 max_speed_mps=0.5 约束；**上板部署证据另计**）；**停靠/放托盘/载荷确认仍未交付**，见 scenario.yaml 的 pending 登记（步骤 18）。
  - id: humanoid_static
    kind: humanoid
    role: scene_entity
    profile:
      state: unverified
      closed_by: "步骤 12"
      reason: 人形资产随 vendor 锁定时登记（哈希 + 许可证）；本战役只作静态场景实体。
    capabilities: [static_model_only]
    model_only: true
    evidence_level: 仅模型
    note: 决策 4.B —— 仅模型，不代表运动能力；不得注册 stand/locomote/navigate 类 Skill。

props:
  - id: box_01
    body: box_01
    kind: box
    geometry:
      type: box
      size_m: [0.025, 0.025, 0.025]
    mass_kg: 0.04
    friction: "2.0 0.05 0.001"
    rgba: [0.82, 0.22, 0.12, 1.0]
    pose:
      pos_m: [0.19, 0.0, 0.025]
      quat_wxyz: [1.0, 0.0, 0.0, 0.0]
    note: 与 config/piper_simulation_baseline.yaml 的 target 段保持一致（抓取判据按 body 命中）。
  - id: tray_01
    body: tray_01
    kind: tray
    geometry:
      type: box
      size_m: [0.12, 0.08, 0.01]
    mass_kg: 0.35
    friction: "1.4 0.03 0.001"
    rgba: [0.25, 0.3, 0.35, 1.0]
    pose:
      # 托盘固定在四足背上：位置由被挂载实体与参考系决定，不在这里重复写绝对坐标。
      mount:
        entity: unitree_go2
        frame: tray_frame
    note: 停靠判据（平移 ≤30mm、偏航 ≤2deg）针对 tray_frame，见 baseline.yaml 的 acceptance 段。

# 世界固定参考系（`frames:`）：导航/停靠/交接的目标帧。
# 为什么必须是"世界固定"而不是挂在机器人上：挂在四足躯干上的帧（如 `tray_frame`）与机身**同一刚体**
# ⇒ 停靠量到的是自指量（偏航恒 0、平移 = 帧本地偏置的投影），接近过程从不执行。
# 详见 docs/debug/2026-09-24-dock-target-self-frame.md 与提交 ba22c9e 的执行前门禁。
frames:
  - id: handoff_station_frame
    kind: site
    pose:
      # 站位：四足把背上的托盘停到这里，机械臂才够得着托盘。
      # 依据：工具点在托盘顶面高度（z ≈ 0.347 m）的可达水平环带 r ∈ [0.002028, 0.594284] m
      # （build/iraf-a6a14/reach_probe.py，20000 次 FK 采样，臂基座在原点）⇒ 取 0.55 m 保守内侧。
      pos_m: [0.55, 0.0, 0.0]
      # 期望机身朝向（yaw 0 = 与出生点朝向一致，故本工况不需要转向）
      quat_wxyz: [1.0, 0.0, 0.0, 0.0]
    note: >-
      前提：臂基座在台面原点附近（臂尚未装进同一模型，见 .hermes/plans/2026-09-23-dock-for-handoff.md
      §11）；只按**位置**可达筛选，**未约束工具姿态**。待臂的摆放（A/B/C 方案）确定后复核此坐标。

# 传感器声明。厂商 MJCF 不提供相机与雷达（实测 go2.xml 0 命中），
# 因此 source=scene 的必须由场景构建器按本声明注入，厂商文件保持只读。
sensors:
  - id: overhead_camera
    kind: camera
    source: scene
    anchor:
      object_kind: camera
      name: overhead_camera
      entity: piper
    pos_m: [0.28, -0.72, 0.72]
    look_at_m: [0.19, 0.0, 0.025]
    fovy_deg: 78
    note: 相机位姿与外参按机型独立；本场景沿用 Piper 基线已标定的视角，标定文件仍走 config/piper_simulation_baseline.yaml 的 vision 段。
  - id: payload_lidar
    kind: lidar
    source: scene
    anchor:
      object_kind: site
      name: payload_lidar_site
      entity: unitree_go2
    num_rays: 360
    range_m: 8.0
    mount_height_m: 0.12
    note: 首期只用于场景观测；导航能力未验收前不得据此声明 navigate 可用。
  - id: base_imu
    kind: imu
    source: vendor
    anchor:
      object_kind: site
      name: imu
      entity: unitree_go2
    rate_hz: 100
    note: 厂商 go2.xml 自带 <site name="imu">；场景构建器只读该 site，不修改厂商文件。

# 光照是检测链路的输入（不是装饰）：主光近垂直、castshadow 默认关闭。
lights:
  - name: key
    directional: true
    dir: [-0.16, 0.16, -1.0]
    diffuse: [0.85, 0.84, 0.82]
    specular: [0.25, 0.25, 0.25]
    castshadow: false
  - name: fill
    directional: true
    dir: [0.60, -0.25, -0.55]
    diffuse: [0.30, 0.30, 0.30]
    specular: [0.05, 0.05, 0.05]
    castshadow: false
  - name: rim
    directional: true
    dir: [0.25, 0.70, -0.40]
    diffuse: [0.22, 0.22, 0.24]
    specular: [0.0, 0.0, 0.0]
    castshadow: false

model:
  # 生成产物写入 build/（AGENTS.md 5.5）；生成器由步骤 13 交付。
  output: build/scenes/handoff_lab/handoff_lab.xml
  builder: scripts/build_scene.py
