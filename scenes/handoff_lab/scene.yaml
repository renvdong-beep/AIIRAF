    friction: "1.0 0.005 0.0001"
    rgba: [0.45, 0.45, 0.50, 1.0]
    pose:
      # 顶面 0.114 m = 臂安装面（0.12 m）下方 6 mm ⇒ 支撑住臂但不与厂商安装基座网格相碰
      # （`piper_link1 ↔ world` 的自重叠已由 `profiles/piper_mujoco.yaml: spec.model.self_collision_excludes`
      # 显式排除；这里再留 6 mm 间隙，避免把新的接触力引进来）。
      pos_m: [0.45, -0.45, 0.057]
      quat_wxyz: [1.0, 0.0, 0.0, 0.0]
    static: true
    note: >-
      机械臂基座（静态体，顶面 0.114 m，支撑 0.12 m 安装面）。静态体必须 `static: true`（不带自由关节）——
      带自由关节的台架会直接自由落体。不是接收体（未声明 receiving），不参与放置判据。
  # 【I4-a 落点，2026-09-30 §11.48】UR5e 卸载后的**世界固定**接收体：工作台上的一块落点标记垫，
  # 顶面与工作台面齐平（z = 0.0）⇒ 载荷置于其上时中心 z = 0.025（= 载荷半高），
  # 即 §11.48 已证明可解的落点。位置与尺寸依据（全部实测，见 §11.48 与附表）：
  #   · 距 UR5e 基座 (0.45,0.90)：r = 0.390512484 m（台面高度可达带 [0.042868, 1.027868] m 内）；
  #   · 四相位 IK 残差 9.76e-08 m、姿态偏差 0.007306° / 0.006877°（限 3°）⇒ 工具指向可用；
  #   · 邻近 5 点全解（裕度研究）⇒ 该区域整片可解，不是刀刃上的选择；
  #   · 距狗走廊（x=0.45、y∈[0,0.45]）x 向 0.250 m / y 向 0.150 m ⇒ 不挡狗。
  # `static: true`：这是**落点标记**（不参与动力学），避免引入可被撞飞的自由体。
  - id: place_pad_b
    body: place_pad_b
    kind: box
    static: true
    geometry:
      type: box
      # 尺寸由**判据**推出（2026-09-30 §11.52）：允许落点偏移 = 垫半宽 − 载荷半宽。
      # 取半宽 0.09（0.18×0.18）⇒ 允许偏移 0.09 − 0.025 = **0.065 m**，与托盘判据 0.06 同级
      # （托盘 0.24×0.16 的半宽 0.08 − 0.025 = 0.055，判据取 0.06）。中心点仍是已证明可解的 (0.70,0.60)。
      size_m: [0.18, 0.18, 0.01]
    mass_kg: 0.05
    friction: "1.4 0.03 0.001"
    rgba: [0.35, 0.45, 0.30, 1.0]
    pose:
      # ⚠ 2026-10-06 迭代记录（判据＝①构建期自检通过 ②`arm_contacts` 里不再出现任何 Go2 部位）：
      #   ① y=0.78（+y 朝基座）**否掉**：运行时 `wrist_1↔tray_01` −0.807→−1.146 mm、`↔FL_hip` −0.067→−1.113 mm。
      #   ② y=0.62（−y）**被构建期自检拒绝装配**：`SceneBuildError: 放置航点与载体接触
      #      [descend: ur5e_rq2f85_base ↔ base_link −0.000383 m]` ⇒ SCENARIO_DECLARATION_ERROR。
      #   ⇒ **y 方向窗口极窄（y=0.70 时仅 0.07 mm 接触）⇒ 不是正确杠杆**；
      #     下一候选＝**+x**（把整条臂在 x 上推离狗走廊 x=0.45），或改放置接近朝向（见 §11.17 / §11.63）。
      #   ③ x=0.88（+x，把臂在 x 上推离狗走廊）**部分有效**：`wrist_1↔tray_01` 与 `↔FL_hip`
      #      **消失** ✓，但残留 `wrist_1 ↔ base_link` −0.000835 m（狗躯干，place_above 相位），
      #      且 B 站 yaw −2.393° → −2.648°（更差）⇒ 不采用；⇒ 平移落点垫**不足以**清掉腕部
      #      ⇒ 下一手段＝④ **改放置接近朝向**（让腕部背向狗），必要时⑤挪 B 站（级联 s06）。
      pos_m: [0.78, 0.70, -0.005]
      quat_wxyz: [1.0, 0.0, 0.0, 0.0]
    receiving: true
    note: >-
      UR5e 卸载落点（I4-a，A 方案：B 站旁台面）。顶面 z=0.0 与工作台齐平；依据见
      docs/debug/2026-09-24-joint-model-dog-arm.md §11.48（可达带/残差/姿态偏差/裕度/净距）。
      【2026-09-30 §11.60 外移 0.70,0.60 → 0.78,0.70】运行期逐拍实测：载荷在 above 段下降时
      **擦到狗的前左髋 FL_hip**（`PLACE_TRACE` 的 `payload_contacts` 里出现 `FL_hip`），刚性焊缝
      把这股力传回臂、把臂拽离指令位姿（x 从 0.7374 外漂到 0.7848、z 停在 0.1512 而非构建期
      FK 的 0.020633）⇒ descend 永远到不了、末端报"触地纠偏需要竖向移动 -0.118808736 m"。
      与狗前左髋（狗在 B 站 (0.45,0.45)、躯干半长 ~0.19 ⇒ 髋 ≈ (0.64,0.55)）的净距：
      原 0.078 m → **0.205 m**；可达性复核 r = 0.386 m（带内 [0.042868, 1.027868]），
      三点可行性探针（0.75,0.65 / 0.78,0.70 / 0.70,0.70）均 pass=true。
# 世界固定参考系（`frames:`）：导航/停靠/交接的目标帧。
# 为什么必须是"世界固定"而不是挂在机器人上：挂在四足躯干上的帧（如 `tray_frame`）与机身**同一刚体**
# ⇒ 停靠量到的是自指量（偏航恒 0、平移 = 帧本地偏置的投影），接近过程从不执行。
# 详见 docs/debug/2026-09-24-dock-target-self-frame.md 与提交 ba22c9e 的执行前门禁。
frames:
  - id: handoff_station_frame
    kind: site
    pose:
      # 站位：四足把背上的托盘停到这里，机械臂才够得着托盘。
      # 依据：工具点在托盘顶面高度（z ≈ 0.347 m）的可达水平环带 r ∈ [0.002028, 0.594284] m
      # （build/iraf-a6a14/reach_probe.py，20000 次 FK 采样，臂基座在原点）⇒ 取 0.55 m 保守内侧。
      # ⚠ 0.55 → 0.45（2026-09-24）：0.55 落在安全策略声明的 `quadruped_limits.workspace_m`
      # （x ∈ [−0.5, 0.5]）**之外** ⇒ 声明冲突（站位必须在"允许走到的范围"内）。
      # 0.45 同时满足：① 在工作空间矩形内；② 在臂可达环带 r ≤ 0.594284 m 内（§11.1）。
      pos_m: [0.45, 0.0, 0.0]
      # 期望机身朝向（yaw 0 = 与出生点朝向一致，故本工况不需要转向）
      quat_wxyz: [1.0, 0.0, 0.0, 0.0]
    note: >-
      前提：臂基座在台面原点附近（臂尚未装进同一模型，见 .hermes/plans/2026-09-23-dock-for-handoff.md
      §11）；只按**位置**可达筛选，**未约束工具姿态**。待臂的摆放（A/B/C 方案）确定后复核此坐标。

  # 【2026-09-29 修订】B 站：第二台臂（UR5e）侧的交接站位。
  # 与 A 站同一构造规则（站位 = 臂基座正前方 0.45 m），依据全部实测：
  #   ① 落在四足安全策略 `quadruped_limits.workspace_m`（x,y ∈ [−0.5, 0.5]）**之内**
  #      —— 这正是 A 站从 0.55 改到 0.45 的那条硬约束；
  #   ② 距 UR5e 基座 (0.45, 0.90) 的水平距离 0.45 m（与 A 站距 Piper 基座同值）；
  #   ③ UR5e 在托盘高度 z=0.350372 的可达环带 r ∈ [0.023982, 1.051524] m、方位覆盖 36/36
  #      （scripts/probe_ur5_reach_band.py，20000 次 FK、只按位置不约束姿态 —— 与 A 站
  #      r ∈ [0.002028, 0.594284] 逐条同一口径）⇒ 0.45 m 余量充足；
  #   ④ 距 Piper 基座 (0.45,−0.45) 0.90 m > 0.594284 m ⇒ **A 臂够不到 B 站**
  #      （角色分离：装 = A 臂，卸 = B 臂，两台臂的职责不重叠）；
  #   ⑤ 期望偏航与 A 站**相同**（`[1,0,0,0]`）⇒ 托盘与方块在 B 站朝向一致，
  #      卸载的抓取姿态与 A 站可比（不引入一个 90° 的额外变量）；
  #   ⑥ 躯干半长 0.1881 m + 臂基座半宽 0.09 m < 0.45 m ⇒ 停靠时不与第二台臂基座干涉。
  - id: handoff_station_frame_b
    kind: site
    pose:
      # ⚠ 2026-10-08 **改动已回滚**（联合可达性把这条路封死，见 reference_solver.target_override_world_m
      # 条目的实测结论）：单动站位 −y 0.24 m 虽能把放置侧最坏净空从 −0.056840 m 拉到 **+0.099247 m**，
      # 但抓取侧 home 相位在 dy=0.69 时不可达（残差 0.024677363 m）⇒ 构建拒绝装配。
      # 可行窗口（dy ≤ 0.565）内净空只有 +0.022524 m < 停靠容差 0.030 ⇒ 必须与基座/抬升/朝向联合解。
      # 动机：UR5e 放置时腕部本体撞狗（使用者报"碰翻"）。运行期实测为**亚毫米擦蹭**
      #   （wrist_1↔tray_01 −0.000453、wrist_1↔FL_hip **+0.000892**），而**构建期看不见**
      #   （自检把载体摆在站位帧 z=0，比运行期低 **0.276627 m**；正确高度见
      #    `place_targets[].nominal_pose_m`（站 A 给 0.345372）——构建器**已有**正确的
      #    "标称停靠姿态"算法，但 `scene_builder.py:2086-2091` 的 FK 自检没有用它 ⇒ 仪器缺口）。
      # 静态净空探针扫描（`scripts/probe_place_carrier_dock_offset.py --scan`，载体按运行期实测
      # 躯干高度 0.276627 m 摆放，判据 = 臂↔载体全部对的有符号净空）：
      #   (0.450,0.450) −0.056840 ｜ (0.450,0.390) −0.041536 ｜ (0.535,0.245) +0.026166 ｜ (0.563,0.217) +0.047943
      #   **(0.450,0.210) 起：全部对 > 50 mm**（实测最坏 +0.099247 = 停靠容差 0.030 的 3.3 倍）
      # 实验（站位改到 (0.45,0.21)，受控重建 + 整链单轮）：
      #   ✓ 碰撞清除（净空 +0.099247）；腕部位姿**逐位不变**（放置航点只依赖落点垫）
      #   ✗ s02b：残差从"偏航 2.449925°（超）"变成"平移 0.030397 m（判据 0.030，超 0.4 mm）+
      #           偏航 1.124765°（过）" ⇒ 到位后漂移把余量在两个自由度间重分，两个都贴边
      #   ✗ s06：`实测目标 live=[0.425852, 0.178727, 0.371967]` 与 `名义解 [0.45,0.45,0.375264]`
      #           差 **0.272365942 m** > 声明上限 0.07 ⇒ 拒绝按名义解继续 ⇒ 臂的**抓取名义解里
      #           也编着老站位**（第三份数字；s07 因未夹住载荷级联失败）
      # ⇒ 要让这次布局改动成立，必须**三处同改**：
      #   ① 仪器：FK 自检的载体位姿改用**标称停靠姿态**（复用 `place_targets` 已有的算法/口径）
      #   ② 抓取侧：联合装配时按**实测托盘位姿**重解臂的抓取名义解（与放置侧 `place_reference`
      #      同一先例），并把 `max_lateral_m` 的比较对象改为"重解后解"而不是臂自己的老基线
      #   ③ 停靠：到位后漂移（0.011 m / 0.45°）先压下去，否则布局一动就把余量顶到另一个自由度上
      pos_m: [0.45, 0.45, 0.0]
      quat_wxyz: [1.0, 0.0, 0.0, 0.0]
    note: >-
      站位名在机型声明里登记（config/go2_joint.yaml 的 dock_for_handoff.stations.handoff_b）；
      步骤按**站名**选择，不写坐标。台面 half_size_m=1.5 ⇒ 在台面内。

# 传感器声明。厂商 MJCF 不提供相机与雷达（实测 go2.xml 0 命中），
# 因此 source=scene 的必须由场景构建器按本声明注入，厂商文件保持只读。
sensors:
  - id: overhead_camera
    kind: camera
    source: scene
    anchor:
      object_kind: camera
      name: overhead_camera
      entity: piper
    pos_m: [0.28, -0.72, 0.72]
    look_at_m: [0.28, -0.28, 0.025]
    fovy_deg: 78
    note: 相机位姿与外参按机型独立；本场景沿用 Piper 基线已标定的视角，标定文件仍走 config/piper_simulation_baseline.yaml 的 vision 段。
  - id: payload_lidar
    kind: lidar
    source: scene
    anchor:
      object_kind: site
      name: payload_lidar_site
      entity: unitree_go2
    num_rays: 360
    range_m: 8.0
    mount_height_m: 0.12
    note: 首期只用于场景观测；导航能力未验收前不得据此声明 navigate 可用。
  - id: base_imu
    kind: imu
    source: vendor
    anchor:
      object_kind: site
      name: imu
      entity: unitree_go2
    rate_hz: 100
    note: 厂商 go2.xml 自带 <site name="imu">；场景构建器只读该 site，不修改厂商文件。

# 光照是检测链路的输入（不是装饰）：主光近垂直、castshadow 默认关闭。
lights:
  - name: key
    directional: true
    dir: [-0.16, 0.16, -1.0]
    diffuse: [0.85, 0.84, 0.82]
    specular: [0.25, 0.25, 0.25]
    castshadow: false
  - name: fill
    directional: true
    dir: [0.60, -0.25, -0.55]
    diffuse: [0.30, 0.30, 0.30]
    specular: [0.05, 0.05, 0.05]
    castshadow: false
  - name: rim
    directional: true
    dir: [0.25, 0.70, -0.40]
    diffuse: [0.22, 0.22, 0.24]
    specular: [0.0, 0.0, 0.0]
    castshadow: false

model:
  # 生成产物写入 build/（AGENTS.md 5.5）；生成器由步骤 13 交付。
  output: build/scenes/handoff_lab/handoff_lab.xml
  # 联合产物（`--attach <本体>` 时写入本路径）：单本体产物保持逐个构建、互不影响。
  joint_output: build/scenes/handoff_lab/handoff_lab_joint.xml
  # 联合报告顶层 manipulation/gripper/targets 描述**哪一台**附加臂（臂后端按它装配）。
  # 为什么必须显式：`--attach piper --attach ur5e` 两台臂都带 manipulation_report 时，
  # 原实现按命令行顺序取第一台 ⇒ 另一台的操纵事实被静默丢弃（谁"带负载"绝不能由参数顺序决定）。
  joint_manipulator: piper
  # **附加本体关节的转子惯量下限**（2026-09-30 §11.35/§11.37 判死）：显式积分下 PD 位置伺服的稳定性
  # 由 `kv·dt/J` 决定；UR5e 厂商标定（kp=2000/500、kv=400/100）在小惯量腕关节上远超稳定界 ⇒
  # **逐步数值颤动**（实测肘 qvel 每 2 步翻符号、周期 0.004016 s = 2.008·dt、wrist_2 全程饱和、
  # 静态保持残余 0.049657413 rad）。实测对策：`armature ≥ 0.5 kg·m²` 时颤动消失、残余 −8.2e-08 rad，
  # 且**不动 kp/kv**（厂商标定保持）、**不动整株步长**（步态与植物步进节奏保持，对照 §11.36）。
  # 0.5 也符合物理量级（UR5e 关节经减速器折算的转子惯量在 0.1~1 kg·m²）。
  attached_actuator:
    armature_min_kg_m2: 0.5
  builder: scripts/build_scene.py
