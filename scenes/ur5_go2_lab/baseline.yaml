schema_version: iraf.scene-baseline/v1
scene: scene.yaml
robots:
  ur5e: config/machines/ur5e.yaml
  unitree_go2: config/go2_loopback.yaml
robots_joint:
  ur5e: config/machines/ur5e_joint.yaml
  unitree_go2: config/go2_joint.yaml
initial_state:
  piper:
    pose_source: profile
    note: 参考姿态来自 profiles/piper_mujoco.yaml 的 home 段。
  ur5e:
    pose_source: profile
    note: 臂侧基线 config/ur5_simulation_baseline.yaml；臂侧报告 build/models/ur5-pick-scene.json。
  unitree_go2:
    pose_source: profile
    note: 数值来源与验收证据见 build/acceptance/go2-loopback/report.json（步骤 15，simulation=true）。
  humanoid_static:
    pose_source: unverified
    closed_by: 步骤 12
    reason: 静态实体位姿随 scene.yaml 的实体声明；资产登记后回填，本战役不进入 Skill 闭环。
acceptance:
  pose_tolerance_m: 0.005
  min_lift_delta_m: 0.02
  dock_translation_error_max_m: 0.03
  dock_yaw_error_max_deg: 2.0
  min_stable_hold_s: 3.0
  max_speed_m_s: 0.0
  timeout_s: 180.0
sensor_acceptance:
  settle:
    steps: 10
    max_base_drift_m: 0.01
  camera:
    model_vs_declaration_rel_error_max: 1.0e-09
    calibration_fovy_rel_error_max: 0.05
    calibration_focal_rel_error_max: 0.05
    resolution_tolerance_px: 0
    min_nonblack_fraction: 0.02
  lidar:
    elevation_rings_deg:
    - -45.0
    - -25.0
    - -10.0
    - 0.0
    range_histogram_edges_m:
    - 0.0
    - 0.25
    - 0.5
    - 0.75
    - 1.0
    - 2.0
    - 8.0
    ground_geoms:
    - workbench
    min_points: 120
    max_miss_fraction: 0.75
    min_ground_fraction: 0.02
    workbench_geometry_tolerance_m: 1.0e-09
    ray_box_tolerance_m: 1.0e-06
  imu:
    quat_norm_tolerance: 1.0e-09
    gyro_max_abs_error_rad_s: 1.0e-09
    acc_rel_error_max: 0.01
    torque_max_abs_error_nm: 0.05
