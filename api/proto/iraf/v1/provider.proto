syntax = "proto3";
package iraf.v1;
import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";
import "iraf/v1/common.proto";
import "iraf/v1/skill.proto";
// Capability Provider 的**跨机**契约（2026-10-16 新增）。
//
// 与 runtime.proto 的 SkillRuntimeService 的区别（勿混用）：
//   SkillRuntimeService = **任务级**北向接口：客户端提交一个 SkillGoal，服务端跑完整
//     TaskFlow → Skill → Policy 链。它的服务端是"另一个完整 IRAF 实例"。
//   CapabilityProviderService = **能力级**南向接口：客户端（板卡上的 IRAF Runtime）
//     已自行完成策略判定与编排，这里只把**单个能力调用**投到仿真/控制域的 Provider 上执行。
//
// 分工（用户口径 2026-10-16）：板上跑 TaskFlow/Skill/Policy，x86 只把能力在 MuJoCo 里执行并显示。
//   ⇒ 策略判定**不在此接口**；本接口必须拒绝过期 fencing token 与终态执行的调用（铁律 2.12）。
message LeaseEnvelope {
  string execution_id = 1;                       // 服务端生成的执行 id（追溯锚点）
  string correlation_id = 2;
  string idempotency_key = 3;                    // 同键同摘要 ⇒ 返回既有结果，不重复执行
  string resource_id = 4;
  uint64 fencing_token = 5;                      // 单调递增；旧 token 必须被拒绝
  google.protobuf.Timestamp deadline = 6;        // 无 deadline 的调用必须被拒绝（铁律 2.3）
  VersionRef robot_profile = 7;
  VersionRef safety_policy = 8;
  string caller_subject = 9;                     // 仅用于审计展示；身份来自受信 transport
  string controller = 10;                        // 控制源（ControlAuthority 语义）
}
message CapabilityCall {
  string capability = 1;                         // move_joint | pick_object | place_object | accept_payload | stop | step | runtime_inventory
  google.protobuf.Struct inputs = 2;             // 能力参数（与本地 Provider 方法签名同名同义）
  LeaseEnvelope lease = 3;
}
message CapabilityResult {
  string capability = 1;
  bool accepted = 2;
  google.protobuf.Struct outputs = 3;            // 必须满足 skill 输出 schema（与本地 Provider 同形，禁止伪造成功）
  IrafError error = 4;
  uint64 fencing_token = 5;
  google.protobuf.Timestamp occurred_at = 6;
  string provider = 7;                           // 例如 iraf_adapters.mujoco.mujoco_backend:MujocoBackend
  bool simulation = 8;                           // 仿真结论必须为 true，不得表述为真机能力（铁律 1.7）
}
message ProviderHealthRequest { }
message ProviderHealthResponse {
  bool ready = 1;
  bool simulation = 2;
  string backend = 3;
  repeated string capabilities = 4;              // declared ⊆ implemented（装配期校验过）
  VersionRef robot_profile = 5;
  uint64 fencing_token = 6;                      // 当前租约代次
  string display_mode = 7;                       // interactive_viewer | offscreen_frames | unavailable
  bool window_opened = 8;                        // 显示通道是否真的建了窗口（禁止假绿）
  string detail = 9;
}
service CapabilityProviderService {
  rpc Health(ProviderHealthRequest) returns (ProviderHealthResponse);
  rpc Invoke(CapabilityCall) returns (CapabilityResult);
  rpc Cancel(CancelExecutionRequest) returns (CancelExecutionResponse);
}
