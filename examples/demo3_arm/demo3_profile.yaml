apiVersion: iraf.intewell.io/v1
kind: RobotProfile
metadata:
  name: demo3_mujoco
  version: 0.1.0
spec:
  simulation: true
  verification: development
  control_frequency_hz: 100
  # 3 个俯仰/偏航关节 + 2 个滑轨手指关节。命名与既有两台机型完全不同，
  # 用来证明"接入只依赖声明"。
  joints: [q1, q2, q3, q4, q5, q6, finger_l_joint, finger_r_joint]
  joint_limits:
    q1: [-3.1, 3.1]
    q2: [-2.9, 2.9]
    q3: [-2.9, 2.9]
    q4: [-2.9, 2.9]
    q5: [-3.1, 3.1]
    q6: [-2.9, 2.9]
    finger_l_joint: [-0.04, 0.04]
    finger_r_joint: [-0.04, 0.04]
  # 只声明本机型真正验证过的能力：没有视觉、没有标定能力。
  # 装配期能力契约是单向的（declared ⊆ implemented），因此后端实现了更多能力不受影响。
  capabilities: [move_joint, pick_object, stop]
  joint_roles:
    q1: arm
    q2: arm
    q3: arm
    q4: arm
    q5: arm
    q6: arm
    finger_l_joint: gripper_drive
    finger_r_joint: gripper_drive
  gripper:
    type: parallel
    drive_joints: [finger_l_joint, finger_r_joint]
    open_positions: {finger_l_joint: 0.030, finger_r_joint: -0.030}
    closed_positions: {finger_l_joint: 0.023, finger_r_joint: -0.023}
  home: {q1: 0.0, q2: 0.8, q3: 2.2, q4: -1.429, q5: 0.0, q6: 0.0}
  camera:
    lookat_m: [0.40, 0.0, 0.05]
    distance_m: 1.10
    azimuth_deg: 160.0
    elevation_deg: -22.0
