apiVersion: iraf.intewell.io/v1
kind: Skill
metadata: {name: engineering.inspect_robot, version: 1.0.0}
spec:
  verification: development
  inputSchema: inspect_robot.input.json
  outputSchema: inspect_robot.output.json
  requires: [engineering.inspect_robot]
  preconditions: []
  intentExamples: [解析机器人模型, 读取关节限位, inspect robot]
  timeoutSeconds: 30
  cancellation: cooperative_stop
  recovery: [request_handover]
  safetyClass: build_tooling
  providers:
    - name: engineering_inspect_robot
      type: python_adapter
      entrypoint: "iraf_skills.engineering.inspect_robot:InspectRobotProvider"
      selector: {mode: simulation}
      priority: 100
