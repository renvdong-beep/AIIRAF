# IRAF SDK 安装形态声明（iraf.install-profiles/v1）—— 安装包的唯一事实来源。
#
# 定位（2026-10-12 使用者口径）：IRAF 的安装交付物 = **SDK shell 脚本包**，分两种形态：
#   形态 A  single-ubuntu2204  全部装在一台 Ubuntu 22.04：仿真 + 运行都在这台（开发/单机演示/回归）
#   形态 B  split-x86-edge     仿真在 x86 Ubuntu 22.04（sim-x86）；其余在边缘侧 aarch64 Hyper 的
#                              **智能域**（edge-intel，TaskFlow/Skill/Policy/Bridge）
#                              与 **运控域**（edge-motion，控制域 Capability Provider 实时段）
#   形态 B 的两域即使落在同一台 Hyper 上，也必须独立进程/权限/资源限额/设备所有权（AGENTS 6.11）。
#
# 契约：config/install/install_profiles.schema.json（负向可验）。
# 校验入口：PYTHONPATH=src python3 scripts/install_profile_check.py [--profile <id>]
# 依赖：本文件只声明“装什么、装到哪、起什么、怎么验残留”，**不声明命令实现状态**；
#       命令在实现并通过验收前，不得在任何文档里写成“已可用”（AGENTS 6.4）。
#
# 术语对齐（避免同一事实两个名字，见 docs/iraf-agentos-hyper-compatibility.md §4 的相反用词）：
#   智能域 = TaskFlow / Skill Runtime / Policy Gateway / AgentOSBridge（Hyper VM0）
#   运控域 = Capability Provider 实时段（Hyper VM1 Motion、VM2 Master 各自独立角色）
schema_version: iraf.install-profiles/v1
sdk:
  # 版本单一来源：不在本文件复制版本号（AGENTS 5.3）。
  version_ref: pyproject.toml#project.version
  dist_name_ref: pyproject.toml#project.name

# 全角色共享默认值；单角色可覆盖。脚本只读本文件，禁止在脚本里再写一遍路径/端口（AGENTS 5.3）。
defaults:
  # 唯一的路径展开规则：仅允许把前导 `~` 展开为 $HOME；其余字符原样。解析后的生效值由
  # scripts/install_profile_check.py --profile <id> 打印（本项目最常踩“改动没生效/改错段”）。
  prefix: "~/.local/opt/iraf-sdk"
  version_dir_layout: "{prefix}/{version}"
  current_link: current
  config_dir: "~/.config/iraf"
  log_dir: "~/.local/state/iraf/log"
  data_dir: "~/.local/state/iraf/data"
  # 安装记录名：安装后写入 <version dir>/<file_record>；卸载**只**依据它决定删哪些文件，
  # 清单外文件/记录缺失/SHA 不符一律拒绝（不做“尽力而为”删除）。
  file_record: iraf-install-files.json
  python_min: "3.9"
  # 安装预检与渲染需要的部署期参数：**显式声明**，脚本里不得再内置默认值（铁律 5.3）。
  min_free_mb: 1024
  # 交付单元与自检用的解释器（目标端实测后应回填为该机的真实路径）。
  python_bin: /usr/bin/python3
  # 单元里的运行用户；特殊值 @current@ = 安装时的调用者（单机开发形态无需 root）。
  run_user: "@current@"
  # 运行期依赖：SDK wheel 的 METADATA **不声明**依赖（实测），因此运行期 import 需要的那几个包
  # 必须在这里显式声明并由安装器装进 <version>/lib（否则 `from jsonschema import …` 直接失败）。
  # 只列"组件真正 import 到"的包；仿真专用（mujoco/numpy/pillow/glfw）不在边缘角色里。
  runtime_dependencies:
    - pyyaml
    - jsonschema
    - grpcio
    - protobuf
  # proto 桩目录（运行期 `import iraf.v1.*` 需要；runtime 包内**不含**桩，实测）：
  # 由 scripts/gen_proto_stubs.sh 生成，安装器会把它拷进 <version>/lib 并纳入安装记录。
  python_stubs_dir: build/generated/python
  # venv = 单机/开发形态（快，需要网络或本地 wheel 缓存）；target = 交付形态（离线 wheelhouse，--target）
  install_method: venv
  # user = systemctl --user（无需 root，单机形态）；system = /etc/systemd/system（交付形态）
  systemd_scope: user
  # 依赖来源：index = 在线索引（快速）；wheelhouse = 离线目录（隔离网/板卡）
  dependency_source:
    kind: index
    index_url: https://mirrors.aliyun.com/pypi/simple/
  # 卸载保留项：数据与日志（AGENTS：日志/事件库属数据，卸载保留）；只有 --purge 才删。
  uninstall:
    keep: ["{data_dir}", "{log_dir}"]
    purge_flag: "--purge"
  # 明文声明：安装包不写系统 site-packages，不 dpkg/dnf 安装，不碰 AgentOS 自身文件。
  install_boundaries:
    write_system_site_packages: false
    use_system_package_manager: false
    touch_agentos_files: false

profiles:
  - id: single-ubuntu2204
    label: 单机（Ubuntu 22.04，仿真 + 运行同一台）
    purpose: development
    target:
      os: ubuntu
      os_version: "22.04"
      arch: x86_64
    # 单机形态：仿真 Provider 与运行面同机 ⇒ 一切结论都是 simulation=true，不得表述为真机能力（AGENTS 1.7）。
    verification: development
    simulation_only: true
    prefix: "~/.local/opt/iraf-sdk"
    config_dir: "~/.config/iraf"
    log_dir: "~/.local/state/iraf/log"
    data_dir: "~/.local/state/iraf/data"
    systemd_scope: user
    components:
      - sdk_core
      - core
      - skills
      - profiles
      - scenarios
      - config
      - adapters_sim
      - adapters_http
      - adapters_grpc
      - adapters_agentos
    # 仿真档的运行期依赖：**角色级**覆盖 defaults（defaults 里刻意不含仿真包，避免被边缘角色继承）。
    # 依据：src/iraf_adapters/mujoco/*.py 实测 import 到 mujoco 与 numpy；
    # mujoco 的 wheel 自带 glfw/absl-py/etils/pyopengl，无需在此重复声明。
    runtime_dependencies:
      - pyyaml
      - jsonschema
      - grpcio
      - protobuf
      - mujoco
      - numpy
    backend_entrypoint: iraf_adapters.mujoco.mujoco_backend:MujocoBackend
    services:
      - name: iraf-runtime-http
        # 用**占位符模板**（deploy/sdk/units/*.tmpl）：机器相关的路径/用户/解释器一律由安装器
        # 从本声明的生效值渲染。deploy/iraf-runtime.service 是开发机专用单元（写死
        # /home/coretek、User=coretek、miniconda 解释器），**不得**作为交付单元使用 ——
        # 校验器会强制检查模板含必需占位符，缺一即拒（铁律 5.3）。
        template: deploy/sdk/units/iraf-runtime-http.service.tmpl
        scope: user
        ports: [8765]
        optional: true
      - name: iraf-runtime-grpc
        template: deploy/sdk/units/iraf-runtime-grpc.service.tmpl
        scope: user
        ports: [50051]
        optional: true
    residue:
      scan_roots: ["{prefix}", "{config_dir}", "{log_dir}", "{data_dir}"]
      units: ["iraf-runtime-http.service", "iraf-runtime-grpc.service"]
      ports: [8765, 50051]
      processes: ["iraf-runtime-http", "iraf-runtime-grpc", "iraf-agentos"]

  - id: sim-x86
    label: x86 仿真侧（Ubuntu 22.04，只提供仿真 Provider 与场景）
    purpose: simulation
    target:
      os: ubuntu
      os_version: "22.04"
      arch: x86_64
    verification: development
    simulation_only: true
    components:
      - sdk_core
      - core
      - skills
      - profiles
      - scenarios
      - config
      - adapters_sim
      - adapters_remote
    # 仿真侧的运行期依赖（角色级）：mujoco 与 numpy 由 src/iraf_adapters/mujoco/* 实测 import；
    # grpcio/protobuf 是**服务端**要的（CapabilityProviderService + iraf.v1 桩），2026-10-26 补。
    runtime_dependencies:
      - pyyaml
      - jsonschema
      - grpcio
      - protobuf
      - mujoco
      - numpy
    backend_entrypoint: iraf_adapters.mujoco.mujoco_backend:MujocoBackend
    # 仿真装配（2026-10-26「装完 SDK 就有 Provider」）：
    #   robot_profile / safety_policy 来自仓库声明（相对路径，单元 WorkingDirectory 指向 current）；
    #   sim_scene 由安装器拷进 <version>/models，并用旁挂报告在**目标端**生成 IRAF_BACKEND_CONFIG；
    #   provider_display 决定开窗与否（window 需部署期给 PROVIDER_DISPLAY/PROVIDER_XAUTHORITY）。
    robot_profile: profiles/piper_mujoco.yaml
    safety_policy: profiles/safety/simulation_lab.yaml
    sim_scene: build/models/piper-pick-scene.xml
    provider_display: window
    env_template: deploy/sdk/env/sim-x86.env.tmpl
    services:
      - name: iraf-provider
        template: deploy/sdk/units/iraf-provider.service.tmpl
        scope: user
        ports: [50052]
        optional: false
    cross_domain:
      role: upstream
      peers: ["edge-intel"]
      transport: grpc
      deadline_ms: 30000
    residue:
      scan_roots: ["{prefix}", "{config_dir}", "{log_dir}", "{data_dir}"]
      # 单元/端口必须与服务清单一致（install_profile_check 会逐项比对），否则卸载必留残留。
      units: ["iraf-provider.service"]
      ports: [50052]
      processes: ["iraf_provider_cli", "scenario.py", "view_mujoco.py"]

  - id: edge-intel
    label: 边缘智能域（aarch64 Hyper，TaskFlow/Skill/Policy/AgentOSBridge）
    purpose: edge_runtime
    target:
      # OS/内核/标签的取值只能来自板卡上**签名 HyperProfile / Release manifest**（AGENTS 6.10）；
      # 未采集前保持 unverified，禁止猜测（AGENTS 3.2）。
      os: unverified
      os_version: unverified
      arch: aarch64
      kernel: unverified
      python_tag: unverified
      platform_tag: unverified
      glibc_min: unverified
    verification: unverified
    simulation_only: false
    prefix: /opt/iraf-sdk
    config_dir: /etc/iraf
    log_dir: /var/log/iraf
    data_dir: /var/lib/iraf
    systemd_scope: system
    install_method: target
    dependency_source:
      kind: wheelhouse
      index_url: https://mirrors.aliyun.com/pypi/simple/
      wheelhouse_root: build/wheelhouse
      # 本角色的离线 wheelhouse 来自哪个**构建目标**（config/sdk/package_matrix.yaml 的 id）。
      # 声明它才能在安装前校验"抓的包与目标端 ABI 一致"，避免装错标签的包（本机实测踩到过一次）。
      target_id: aarch64-manylinux_2_28-cp311
    components:
      - sdk_core
      - core
      - skills
      - profiles
      - config
      - adapters_grpc
      - adapters_agentos
      - adapters_remote
    # 真机/边缘：Provider 在**运控域**，本域只做上游；仿真适配器禁止装入本域（AGENTS 1.7/6.9）。
    forbidden_components: [adapters_sim]
    # 2026-10-16：本域 runtime 的 Capability Provider 经跨机 gRPC 调 **x86 仿真 Provider**
    # （板上跑 TaskFlow/Skill/Policy，x86 只把能力执行出来并显示）。
    # 设计见 .hermes/plans/2026-10-16-agentos-semantic-mcp-bridge.md；
    # verification 仍为 unverified —— 真机验收前不得声明已验证（AGENTS 4）。
    backend_entrypoint: iraf_adapters.remote.provider_backend:RemoteProviderBackend
    # 运行装配单模板（占位符化：端点/机型 Profile/目录都由部署期值填充，见 deploy/sdk/env/）
    env_template: deploy/sdk/env/edge-intel.env.tmpl
    services:
      - name: iraf-runtime-grpc
        template: deploy/sdk/units/iraf-runtime-grpc.service.tmpl
        scope: system
        ports: [50051]
        optional: false
        # 独立资源限额（AGENTS 6.11）：与运控域同机部署时不得共享同一份 CPU/内存额度。
        # 取值依据 E300 实测（2 核 / 3979 MB）：智能域 1.5 核 / 1G，留足 TaskFlow+Policy 余量。
        cpu_quota: "150%"
        memory_max: "1G"
    cross_domain:
      role: upstream
      peers: ["edge-motion"]
      transport: grpc
      deadline_ms: 30000
      authenticated: true
    safety_boundary:
      # 铁律 6.11：2VM/多角色合并部署时不得合并安全边界。
      merge_allowed: false
      independent_process: true
      independent_limits: true
      independent_device_ownership: true
    residue:
      scan_roots: ["{prefix}", "{config_dir}"]
      units: ["iraf-runtime-grpc.service"]
      ports: [50051]
      processes: ["iraf-runtime-grpc", "iraf-agentos"]

  - id: edge-motion
    label: 边缘运控域（aarch64 Hyper，控制域 Capability Provider 实时段）
    purpose: edge_control
    target:
      os: unverified
      os_version: unverified
      arch: aarch64
      kernel: unverified
      python_tag: unverified
      platform_tag: unverified
      glibc_min: unverified
    verification: unverified
    simulation_only: false
    # ── 同机复核部署的路径隔离（2026-10-19 使用者口径：运控域部分也装在智控域）──────────
    # 为什么必须隔离：安装器把安装记录写成 <prefix>/<version>/<file_record>，而 file_record 取自
    # effective["file_record"]、**不含角色 id**（deploy/sdk/lib_install.py:181/207）。两角色共用
    # /opt/iraf-sdk 时会互相覆盖同一个记录文件，卸载将删错文件。
    # 单元本身已天然独立（iraf-runtime-grpc vs iraf-control-provider），满足 AGENTS 6.11 的"独立进程"。
    # ⚠ 未闭合项：独立资源限额（CPUQuota/MemoryMax）**尚未**写进单元模板 ⇒ 不得声称 6.11 全款已满足。
    prefix: /opt/iraf-sdk-motion
    config_dir: /etc/iraf-motion
    log_dir: /var/log/iraf-motion
    data_dir: /var/lib/iraf-motion
    systemd_scope: system
    install_method: target
    dependency_source:
      kind: wheelhouse
      index_url: https://mirrors.aliyun.com/pypi/simple/
      wheelhouse_root: build/wheelhouse
      # 本角色的离线 wheelhouse 来自哪个**构建目标**（config/sdk/package_matrix.yaml 的 id）。
      # 声明它才能在安装前校验"抓的包与目标端 ABI 一致"，避免装错标签的包（本机实测踩到过一次）。
      target_id: aarch64-manylinux_2_28-cp311
    # 本域只装能力实现与声明；TaskFlow/Skill/Policy 不落这里（不得跨域合并安全边界）。
    components:
      - sdk_core
      - profiles
      - config
      - adapters_grpc
      - control_provider_stub
    forbidden_components: [adapters_sim, adapters_http, adapters_agentos]
    backend_entrypoint: unverified
    services:
      - name: iraf-control-provider
        # 用与其它交付单元**同一套占位符**的模板。原先指向 deploy/sdk/iraf-sdk-board.service
        # 是错配：那是 bundle 通道的模板（占位符集合不同，由 lib_board_bundle.py 渲染），
        # 装到本通道会因"未知占位符"直接失败 —— 实测踩到，已改。
        # ⚠ 本单元是**就绪占位**：控制域真机入口未定义前只允许桩（铁律 6.8），不得据此声称运行时已启动。
        template: deploy/sdk/units/iraf-control-provider.service.tmpl
        scope: system
        ports: []
        optional: false
        # 独立资源限额（AGENTS 6.11）：运控域额度较小且固定，避免与智能域互相饿死。
        cpu_quota: "100%"
        memory_max: "512M"
    cross_domain:
      role: downstream
      peers: ["edge-intel"]
      transport: grpc
      deadline_ms: 30000
      authenticated: true
    safety_boundary:
      merge_allowed: false
      independent_process: true
      independent_limits: true
      independent_device_ownership: true
    residue:
      scan_roots: ["{prefix}", "{config_dir}"]
      units: ["iraf-control-provider.service"]
      ports: []
      processes: ["iraf-control-provider"]

  # ── 第三种边缘形态：**单系统（无 Hypervisor）** aarch64 边缘机（2026-10-19 新增）─────────────
  # 为什么它不是一个"机型特例"：edge-intel / edge-motion 描述的是 **Hyper VM 内的域角色**，
  #   而这一条描述的是**没有 Hypervisor 的整机**（一台 Linux 就是全部）——差别在**部署形态**，
  #   不在机型。任何非 Hyper 的 aarch64 边缘机都走本角色，机型差异仍只在 profiles/ 与 config/。
  # 为什么必须单列而不是复用 edge-intel：edge-intel 的 target/dependency_source 绑在
  #   `aarch64-manylinux_2_28-cp311` 上，而本机实测解释器是 3.10.12（cp310）⇒ 复用会让预检
  #   正确地 fail-closed。target 里的取值全部是**实测回填**（不是猜的），证据见
  #   build/board/rk3588-topeet/（22 探针）。
  # 认证档位：Ubuntu 20.04 **不在** AGENTS 6.7 的 22.04/Humble 认证基线 ⇒ verification=unverified，
  #   一切结论只能表述为"实验档 / 未认证"，不得写"受支持"。
  - id: edge-linux-standalone
    label: 边缘 aarch64 单系统（无 Hypervisor，实验档）
    purpose: edge_runtime
    target:
      # 以下为实测值：uname 5.10.198 / Ubuntu 20.04.6 / glibc 2.31 / python3.10.12。
      # ⚠ 换板必须重新采集回填（scripts/board_collect.sh），不得沿用。
      os: ubuntu
      os_version: "20.04"
      arch: aarch64
      kernel: "5.10.198"
      python_tag: cp310
      platform_tag: manylinux_2_28_aarch64
      glibc_min: "2.31"
    verification: unverified
    simulation_only: false
    prefix: /opt/iraf-sdk
    config_dir: /etc/iraf
    log_dir: /var/log/iraf
    data_dir: /var/lib/iraf
    systemd_scope: system
    # 目标端解释器必须是板上真有的那一个（系统 python3 是 3.8.10，装不了本 SDK 声明的 cp310 轮）。
    python_bin: /usr/local/bin/python3.10
    install_method: target
    dependency_source:
      kind: wheelhouse
      index_url: https://mirrors.aliyun.com/pypi/simple/
      wheelhouse_root: build/wheelhouse
      target_id: aarch64-manylinux_2_28-cp310
    # 与 edge-intel 同一套运行面：板卡只跑 TaskFlow/Skill/Policy，Provider 在 x86 仿真侧。
    components:
      - sdk_core
      - core
      - skills
      - profiles
      - config
      - adapters_grpc
      - adapters_agentos
      - adapters_remote
    forbidden_components: [adapters_sim]
    backend_entrypoint: iraf_adapters.remote.provider_backend:RemoteProviderBackend
    env_template: deploy/sdk/env/edge-intel.env.tmpl
    services:
      - name: iraf-runtime-grpc
        template: deploy/sdk/units/iraf-runtime-grpc.service.tmpl
        scope: system
        ports: [50051]
        optional: false
        # 单系统板上只有一个角色，但限额照旧声明：# 理由与 edge-intel 相同（6.11 要求
        # "独立资源限额"是单元属性，不因当前是否同机而改变判据）。
        cpu_quota: "150%"
        memory_max: "1G"
    cross_domain:
      role: upstream
      peers: ["sim-x86"]
      transport: grpc
      deadline_ms: 30000
      authenticated: true
    safety_boundary:
      # 单系统上没有第二个域可合并；但"不得合并"的语义仍然成立（没有第二个域就不存在合并）。
      merge_allowed: false
      independent_process: true
      independent_limits: true
      independent_device_ownership: true
    residue:
      scan_roots: ["{prefix}", "{config_dir}"]
      units: ["iraf-runtime-grpc.service"]
      ports: [50051]
      processes: ["iraf-runtime-grpc", "iraf-agentos"]

# 允许的组件 id（受控枚举；schema 亦校验）。新增组件必须同时改本表与 schema。
# 说明：组件是“装什么”的最小粒度，不含版本（版本来自 sdk.version_ref）。
components_enum:
  sdk_core: 北向 SDK（iraf_sdk：客户端/错误码/身份）
  core: 平台无关逻辑（iraf_core：TaskFlow/Policy/Authority/Registry）
  skills: Skill 契约与实现（iraf_skills + skills/<name>/*.{input,output}.json）
  profiles: RobotProfile 与 SafetyPolicy（profiles/**）
  scenarios: 场景包与机型基线（scenes/**、config/**）
  config: 安装/运行期配置（config/sdk/**、config/install/**）
  adapters_sim: 仿真 Provider（iraf_adapters.mujoco，需 MuJoCo 依赖）
  adapters_http: 开发态 HTTP/意图入口（iraf_adapters.http）
  adapters_grpc: 跨域版本化接口（iraf_adapters.grpc，服务端 + SDK 客户端）
  adapters_remote: 跨机 Capability Provider 客户端（iraf_adapters.remote：把能力调用转发到 x86 仿真 Provider）
  adapters_agentos: 北向 AgentOS 适配（Bridge/Dispatcher/CLI）
  control_provider_stub: 控制域 Provider 替身（真机入口定义前只允许桩；铁律 6.8）
