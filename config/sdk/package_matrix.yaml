# IRAF SDK 产物矩阵（iraf.sdk-matrix/v1）—— 版本、Python 标签、平台标签、包清单、镜像源、板卡映射的
# 唯一事实来源。脚本只读不写；禁止在其他脚本/文档里散落硬编码这些值（AGENTS.md 铁律 5.3）。
#
# 契约：config/sdk/package_matrix.schema.json（根结构）；BoardProfile 契约在同一文件的
# definitions.board_profile 内，校验 profiles/boards/*.yaml。
# 依据：docs/iraf-multiplatform-sdk-design.md §7（集中声明）、§11（决策 2 更新为 A）、plans/iraf-24h/00-执行规则.md §0。
#
# 说明：本文件只声明“构建目标”（为哪个架构/标签抓包）,目标端真实的 OS/Python/平台标签由
# profiles/boards/*.yaml 声明（未实测即 unverified），两者在 install.sh 预检阶段比对，不一致即退出码 2。
# 因此这里不重复声明目标端 OS，避免同一事实出现两个来源。
schema_version: iraf.sdk-matrix/v1
sdk:
  name: iraf-sdk
  module: iraf_sdk
  # 版本单一来源：不在本文件复制版本号（铁律 5.3）。
  version_ref: pyproject.toml#project.version
idlv1_version: 1.0.0
# 交付形态声明（设计 §4 产物 3 / §5 脚本契约 / §6 预检）。install 下的路径是**目标端**路径，
# 不是构建机路径；install.sh 从 bundle 内的本文件读取，脚本里禁止再写一遍（铁律 5.3）。
delivery:
  board_bundle:
    name_template: "iraf-board-{board}-{version}-{arch}.tar.gz"
    manifest_name: iraf-board-bundle.json
    checksum_suffix: .sha256
    staging_dir_name: iraf-sdk-staging
  install:
    # 版本化安装目录 <prefix>/<version> + 激活入口 <prefix>/current 符号链接（切换与回滚都只动链接）。
    prefix: /opt/iraf-sdk
    config_dir: /etc/iraf
    log_dir: /var/log/iraf
    systemd_dir: /etc/systemd/system
    service_unit: iraf-sdk-board.service
    env_file: iraf-sdk.env
    current_link: current
    python_min: "3.9"
    # 板级服务解释器（声明单一来源）；目标端实测 Python 未回填前不得由脚本猜。
    python_bin: /usr/bin/python3
    # 安装记录名：verify.sh 在安装后写入 <prefix>/<version>/<file_record>，
    # uninstall.sh 只依据它决定删哪些文件（清单外文件即拒绝卸载）。
    file_record: iraf-sdk-files.json
  # 目标端自检端点与参数（verify.sh 唯一来源；脚本禁止写死 URL/端口/路径）。
  # 端口取值与 deploy/iraf-runtime.env（IRAF_RUNTIME_PORT/IRAF_GRPC_PORT）一致；
  # 事件库环境变量名与 src/iraf_adapters/bootstrap.py 的 IRAF_EVENT_STORE 一致。
  health:
    http_url: "http://127.0.0.1:8765/health"
    expect_http_status: 200
    grpc_target: "127.0.0.1:50051"
    timeout_s: 5
    event_store_env: IRAF_EVENT_STORE
    event_store_default: /var/lib/iraf/iraf-events.db
targets:
  - id: aarch64-manylinux_2_28-cp310
    arch: aarch64
    platform_tag: manylinux_2_28_aarch64
    python_tag: cp310
    # 纯 Python 依赖：无 ABI 要求，可直接取 py3-none-any wheel。
    pure_python:
      - jsonschema
      - pyyaml
    # 二进制依赖：必须按 platform_tag 过滤（实测索引混杂 win_arm64/macosx 干扰项）。
    wheels:
      - mujoco
      - numpy
      - grpcio
      - protobuf
      - pyyaml
      - pillow
    # 决策 2（2026-09-20 更新为 A）：先用 aliyun 镜像（实测可达，且实测含 aarch64 wheel：
    # mujoco 492 / grpcio 953 / numpy 1088 / protobuf 212 / pyyaml 210 / pillow 1224）。
    # 拿到内网私有源后只改本字段一行；脚本禁止写死源地址（设计 §11.2）。
    index_url: https://mirrors.aliyun.com/pypi/simple/
    index_url_declared_at: "2026-09-20"
    index_url_note: >-
      决策 2 更新为 A：先用 aliyun 镜像；官方 PyPI 实测不可达，因此不得写死官方源。
      换内网私有源时只替换 index_url 一行，并同步更新 index_url_declared_at。
    boards:
      - e300
      - firefly_rk3588
    # 抓取时必须拒绝的平台标签子串（实测 numpy 索引含 win_arm64、还有 macosx 条目）。
    reject_platform_tags:
      - win_arm64
      - win32
      - win_amd64
      - macosx
