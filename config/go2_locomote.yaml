# 四足 locomotion 验收判据声明（② 速度跟踪）—— 契约先于实现（铁律 1.2）
#
# 为什么单独一份文件、而不是塞进 config/go2_loopback.yaml：
#   · loopback 声明（schema iraf.quadruped-loopback/v1）管的是 **stand / stop** 两条既有验收路径；
#   · 本文件管的是 **locomote 的速度跟踪**（②），属另一条验收路径 ⇒ 独立声明，互不影响，
#     也不改写任何既有声明（避免动到既有验收门禁）。
#
# 现状（诚实标注）：locomote 的**实现尚未接入框架**（待 A6：MPC Provider → 技能层）；
#   本声明是"先写契约与验收场景"的产物，用来把判据写死，防止事后按实测反填阈值。
#
# 阈值来源与"不反填"说明：
#   · 硬判据 `max_mean_rel_error: 0.10`（相对误差均值 ≤ 10%）在**测量之前**已确定
#     （见 .hermes/plans/2026-09-23-continuous-execution-queue.md 的 A3）；
#   · 实测（本机、仿真、我们的厂商 MJCF + 摩擦配对 0.4）：
#       直行 vx +0.5 m/s ⇒ 误差均值 +6.95%（1099 样本）/ +7.94%（699 样本）
#       倒退 vx −0.3 m/s ⇒ 误差均值 +6.39%（699 样本）
#     ⇒ 硬判据**通过**；`|误差|` 均值 0.0455~0.0478、P95 0.1022~0.1036、max 0.1248 m/s 仅**记录**，
#       **不设阈**（等工况足够再定，避免用单点数据定阈值）。
#   · 转弯（yaw）与侧行（vy）工况的 `vx` 指令为 0 ⇒ **本判据不适用**；它们各自的口径属 A4/A5。
#
# 复算方式（任何人可复跑，铁律 5.2）：
#   PYTHONPATH=src python3 scripts/recompute_locomote_tracking.py --all
#   只读 build/research/mpc-repo/eval_trot_23-*.json（证据区），不产生新仿真。

schema_version: iraf.quadruped-locomote-acceptance/v1
simulation: true

robot:
  id: unitree_go2
  profile: profiles/unitree_go2_mujoco.yaml
# 安全边界不在这里（唯一事实来源是安全策略；本文件只写"验收判据"）
safety_policy: profiles/safety/quadruped_lab.yaml

# 速度跟踪验收（②）
velocity_tracking:
  # 稳态窗口：从运动开始后第 N 秒起，直到本次运行结束（去掉起步瞬态）
  steady_window_start_s: 2.5
  # 硬判据：相对指令速度的**误差均值**上限（无量纲，0.10 = 10%）
  max_mean_rel_error: 0.10
  # 方向门禁（**纯符号判据**，不引入新阈值）：判据不得只看速度大小 —— 实测暴露过一次
  # 「前进指令实际后退 0.9642 m」被 `mean_rel_error`（只比大小）判成通过。
  #   `check_translation`：`vx≠0` 的工况，稳态窗位移在**指令方向**上的投影必须 > 0；
  #   `check_yaw`：`wz≠0` 的工况，稳态窗平均偏航率符号必须与指令同号。
  # 转向工况仍按 `applies_when` 不设量值判据（上游未定义转向跟踪容差），只加方向门禁。
  direction_gate:
    check_translation: true
    check_yaw: true
  # 仅记录、不设阈的指标（先用数据积累，再定阈值）
  record_only:
    - abs_err_mean_mps
    - abs_err_p95_mps
    - abs_err_max_mps
  # 适用性：本判据只适用于"直行/倒退"（指令 vx ≠ 0）；vx = 0 的工况记 NA，不判不通过
  applies_when: "abs(vx_cmd) > 0"

# 前置与失败路径（与铁律一致，写死）
preconditions:
  # 被控对象不得从"足端穿透支撑面"的初始条件起跑（实测沉入 18.372 mm 会使仿真处于
  # 浮点舍入级敏感，见 docs/debug/2026-09-22-mpc-qp-latency.md §25）
  require_initial_alignment: true
  # 执行必须经 TaskFlow → SkillRuntime → PolicyGateway（不得旁路）
  require_policy_gateway: true
failure_paths:
  # QP 无解/超时/解过期 ⇒ damped_hold（移动中），不得继续跑旧解
  on_stale_or_failed_solver: damped_hold
  on_emergency_or_safety_event: torque_zero_release

# 证据要求
evidence:
  report_dir: build/acceptance/go2-locomote
  must_record:
    - profile_sha256
    - safety_policy_sha256
    - control_frequency_hz
    - friction_pairing            # 同摩擦配对：(我们 0.4 / 它 0.4)、(我们 0.8 / 它 0.8)
    - qp_overrun_count            # 移动中 QP 越界次数（记录项）

# MPC Provider 的**部署参数**（A6a-2；铁律 5.3：集中在版本化声明，业务代码不得硬编码）
# 只放"怎么起、等多久、多久更新"，**不放**任何安全阈值（阈值只在安全策略）与判据（在上面的 velocity_tracking）。
mpc_provider:
  # 独立进程入口（模块形式，见 src/iraf_adapters/unitree/mpc/worker.py）
  worker_module: iraf_adapters.unitree.mpc.worker
  # 求解器来源（"模块:可调用对象"），worker 侧经 IRAF_MPC_SOLVER 注入；默认即生产实现
  solver: iraf_adapters.unitree.mpc.osqp_native:solve_native
  # 单次调用的墙钟超时（ms）：父侧超时即 kill+重启并按 damped_hold 处理
  call_timeout_ms: 200.0
  # MPC 更新率（Hz）：必须整除 control_frequency_hz（100 Hz ⇒ 50 或 25…），且 ≤ 预算口径
  update_hz: 50.0
  # 解新鲜度：由 adapters/unitree/mpc/freshness.py 的单一事实来源保证（= 2 × 20.0 ms = 40.0 ms），
  # 这里只登记"与 update_hz 一致"的自洽关系，不重复写数字。
  staleness_periods: 2.0

# MPC **模型与代价常量**（A6a-3b 第①步；铁律 5.3：常量集中在版本化声明，代码里不得写数字）
# 来源：上游 `src/convex_mpc/centroidal_mpc.py:12-17` 的实测值；逐位校验见
# docs/debug/2026-09-23-qp-builder-port-plan.md §2（用 traj_parity 门禁对研究侧 200 样本比对）。
mpc_model:
  # 状态代价对角（12 个状态：p(3) rpy(3) v(3) ω(3)）—— 上游 COST_MATRIX_Q 原值
  q_diag: [1.0, 1.0, 50.0, 10.0, 20.0, 1.0, 2.0, 2.0, 1.0, 1.0, 1.0, 1.0]
  # 输入代价对角（4 足 × 3 维接触力）—— 上游 COST_MATRIX_R = diag(1e-5 × 12)
  # ⚠ 这个 1e-5 是"H 对角跨度 5×10⁶ ⇒ OSQP 迭代 P50 340"的病态来源，
  #   也是必须做**等价变量缩放**的原因（调试记录 §13）；此处如实登记，不得擅自放大（那是改问题）。
  r_diag: [1.0e-5, 1.0e-5, 1.0e-5, 1.0e-5, 1.0e-5, 1.0e-5, 1.0e-5, 1.0e-5, 1.0e-5, 1.0e-5, 1.0e-5, 1.0e-5]
  # 摩擦系数：**必须与足端 geom 摩擦配对**（上游 MU=0.8 与其 MJCF 足端 0.8 成对；
  # 我们的厂商 MJCF 足端是 0.4 ⇒ 这里取 0.4，与 `eval_trot_23 --friction 0.4` 的实测口径一致）
  mu: 0.4
  # 时域与步态（上游 GAIT_HZ=3 / DUTY=0.6；horizon = GAIT_T / dt = 16，dt = GAIT_T/16 = 0.020833 s）
  horizon: 16
  gait_hz: 3.0
  duty: 0.6
  swing_height_m: 0.1
  stand_height_m: 0.27
  # 落足点（Raibert）规划常量 —— 上游 `gait.compute_touchdown_world_for_traj_purpose_only` 的
  # 硬编码常量与系数，逐项落声明（铁律 5.3：代码不得写数字）。语义：
  #   nominal_z_m：标称落足点的**世界系 z**（上游写死 0.02 m，**不是**机身高度）
  #   swing_factor / stance_half_factor：
  #       T = swing_factor·t_swing + stance_half_factor·t_stance
  #       （上游 `T = t_swing + 0.5*t_stance`：在**离地瞬间**规划，对该腿摆动期 +
  #        另一对角组剩余半个支撑期做前瞻）
  #   lookahead_factor：`pred_time = lookahead_factor · T`（上游 `T/2`）
  #   其中 t_swing / t_stance **不在这里声明**：它们由 trot 步态声明的 `duty_factor` 与
  #   `period_s` 派生（`t_swing = (1−duty)·period`、`t_stance = duty·period`），避免同一事实两处。
  # 支撑腿法向力下限（N）：上游 `_compute_bounds` 里硬编码 `fz_min = 10`（注释 "Prevent slipping"），
  # 按铁律 5.3 落声明；语义 = 支撑相足端法向力的下界（lbx 的 z 行），上界仍为 +inf。
  min_normal_force_n: 10.0
  # 期望质心位置的**逐轴钳位阈值**（m）：`reference.reference_state_trajectory` 用它与当前质心的
  # 距离做钳位（超出即夹回）。上游 `max_pos_error` 实测值 0.1（A6a-3b 第②步 §2.2 的逐位校验
  # 就是用这个值对齐的）；本键缺失即显式失败（plan 组装层不设默认值）。
  max_pos_error_m: 0.1
  # QP 的水平/偏航参考从哪来（**按通道**声明；缺键、缺子键或非法取值一律显式失败）：
  #   `translation`：`p(x,y)` 与 `v(x,y)` 的参考；
  #   `yaw`        ：偏航率参考。
  # 取值只允许 `command`（参考由指令给出）或 `measured`（参考取**实测**值，QP 该通道零误差 ⇒ 交还给
  # 机械/步态层）。两条实测依据（2026-09-23，同一 `vx=±0.2` / 4 s 工况，均为 `walk.enabled: true`）：
  #   1. 两者都取 `command`（既有行为）⇒ 支撑足退让与 QP 参考**都在实现同一个指令速度**
  #      （等效回路增益≈2）：前进净位移 +0.128 m（指令的 16%、往复振荡）；
  #      后退**发散** −2.232 m、Σfz 3630.53 N = 23.8×mg、3.0 s 摔倒、tick 348 QP max_iter。
  #   2. 两者都取 `measured` ⇒ **发散消失**（两方向都 SUCCEEDED、无 max_iter），
  #      但偏航失去闭环 ⇒ 后退 4 s 偏航 **+30.51°**、横漂 Δy −0.571 m；
  #      前进 47.4% 误差（横漂 Δy −0.457 m，x 几乎不动）。
  # ⇒ 预期分工：**平移交给足端退让、偏航与高度/姿态留给 MPC**。
  # 判据（未验证）：`translation: measured` + `yaw: command` 时，前进/后退净位移方向正确、
  #   `mean_rel_error ≤ 0.10`、|Δ偏航| ≤ 10°、倾角 ≤15°、无 `max_iter`。
  horizontal_reference_from:
    translation: command
    yaw: command
  # 口径 B（动力学自洽性）的判据阈值：`scripts/verify_mpc_dynamics_consistency.py` 用独立算路
  # （连续时间 RK4 质心动力学）对照 `Ad/Bd/gd` 的一步预测，残差上限取本值。
  # 为什么需要它：上游 `x0/Ad/Bd/gd` 来自 pinocchio/URDF 而我们是 MuJoCo 厂商 MJCF
  # ⇒ 逐位对照不可达；真正要验的是"我们的模型说得对不对"（见 docs/debug/2026-09-23-a6a4-state-bridge-facts.md §6.1）。
  # 实测（2026-09-23，scripts/verify_mpc_dynamics_consistency.py 4 例 home/roll/pitch/yaw90）：
  #   重力语义残差 = 0.000e+00 m/s（期望 −0.204375 = −9.81×0.0208333）；独立 RK4 对照残差 = 2.776e-17。
  # ⇒ 阈值取 1.0e-9（比实测大 8 个量级、仍远紧于任何物理差异），任何"模型说错话"都会被它拦下。
  dynamics_consistency_tol: 1.0e-9
  touchdown:
    nominal_z_m: 0.02
    swing_factor: 1.0
    stance_half_factor: 0.5
    lookahead_factor: 0.5

# MPC 的 **trot 步态来源**（A6a-3b 第②步下半；接触表要的 period/duty/相位偏移必须来自声明）
#
# 为什么不是「再写一份 trot 声明」：
#   `config/go2_loopback.yaml` 的 `gait:` 段**本来就是 trot 原地踏步的声明**（其
#   `gait.verification.report` = `build/acceptance/go2-trot-in-place/report.json`，line 471；
#   kind 后被改成 wave），14 个验收阈值、关节绑定、接触几何、机身阻尼已全部在那一处声明。
#   再抄一份 = 制造第二份事实来源（违反移植清单 §1.1）。因此这里**只声明 trot 与 wave 不同的项**，
#   其余键从基准声明**继承**，合并结果再交给既有 `gait.load_gait_declaration` 跑全部门禁。
mpc_gait:
  base_declaration: config/go2_loopback.yaml
  # 必须移除的段（键不存在即显式失败，防止 drop 名字写错后静默失效）：
  #   sway = 逐相位重心转移（wave 的静态稳定项，trot 不得声明）；
  #   foothold = 落足点规划（同上）。
  drop: [sway, foothold]
  # 只允许 kind / duty_factor / frequency_hz / legs / walk 五类覆盖键（多余键即显式失败）
  overrides:
    kind: trot
    # 占空比：上游 `DUTY = 0.6`（trot 门禁要求 ∈ [0.5, 1.0)）
    duty_factor: 0.6
    # 步频：上游 `GAIT_HZ = 3.0` ⇒ period_s = 0.333333…；
    # 与 `mpc_model.horizon = 16` 的整除关系由 mpc.gait_trot 的自洽门禁强制
    # （period_s 必须 = 1 / mpc_model.gait_hz）
    frequency_hz: 3.0
    # 支撑足**按指令速度反向退让**（世界系钉住足端）⇒ 机身以指令速度前进，而支撑腿位置环
    # 权重可保持 1.0 继续守构型。这是「能走路」的开关：`enabled: false` 完全回到
    # 「原地踏步」目标（`foot_offset` 的 `dx ≡ 0`，逐位一致，用于 A/B 对照）。
    # 依据（2026-09-23 实测，同一 `vx=+0.2` / 4 s 工况，每次只改一处声明）：
    #   基线（摆动 1.0 / 支撑 1.0） ⇒ 位移 −0.9642 m（**反向**，位置环把机身钉在站立点）
    #   只降摆动腿权重到 0.3        ⇒ 位移 −0.4604 m（仍反向，减半）
    #   只降支撑腿权重到 0.2        ⇒ 位移 +0.6090 m（方向正确）但倾角 179.29°（腿构型失守、翻倒）
    # 详见 `gait.walk_foot_offset_m` docstring 与 `docs/debug/2026-09-23-go2-walk-foot-retraction.md`。
    walk:
      enabled: true
      # 摆动相把退让位移按 1−cos 归零（两端速度为零 ⇒ 落足无冲击）
      return_profile: cosine
    # 相位偏移：上游 `PHASE_OFFSET = [0.5, 0.0, 0.0, 0.5]`，**其索引顺序是 [FL, FR, RL, RR]
    # （RL 在 RR 之前）** ⇒ FL 0.5 / FR 0.0 / RL 0.0 / RR 0.5。
    # 对角配对由门禁强制：恰好两组、每组 2 条腿、两组相差 0.5。
    legs:
      FL: {phase_offset: 0.5}
      FR: {phase_offset: 0.0}
      RL: {phase_offset: 0.0}
      RR: {phase_offset: 0.5}
  # 注意（不覆盖 base 的 `step_height_m: 0.08`）：那一项是**原地踏步**的摆动腿步高，
  # MPC 路径不消费它；MPC 的摆动抬升高度是 `mpc_model.swing_height_m`。两处不是同一事实，
  # 故不强行对齐（避免再造一次重复声明）。
  #
  # ⚠ 继承项的适用边界（如实登记，勿误用）：`verification` 段是从 wave 声明继承来的
  #   （`duration_s: 10.0`、`min_clear_swing_cycles_per_leg: 8`、`profile_bins: 20` 等是按
  #   1.25 Hz / 0.8 s 周期标定的）。本 trot 声明**只服务 MPC 路径**（消费 period/duty/相位偏移，
  #   不消费 verification）；若哪天要用它跑原地踏步验收，那些阈值必须按 3.0 Hz 重新推导后
  #   在**基准声明**里改（不得在本文件里另立一套）。



