schema_version: iraf.piper-simulation-baseline/v1
description: Piper 受控仿真抓取基线（无视觉真值验收）

model:
  vendor_dir: vendor/agilex_piper
  source_lock: vendor/agilex_piper/source-lock.json
  source: vendor/agilex_piper/piper_description/mujoco_model/piper_description.xml
  arm_joints: [joint1, joint2, joint3, joint4, joint5, joint6]
  bodies:
    wrist: link6
    left_finger: link7
    right_finger: link8
  finger_geoms:
    left: piper_left_finger
    right: piper_right_finger

workbench:
  top_z_m: 0.0
  half_size_m: 0.8
  half_thickness_m: 0.025
  friction: "1.0 0.02 0.001"

target:
  id: box_01
  # 夹爪最大开度为 joint7/8 = 0.035m，指尖内表面间距约 70mm；
  # 50mm 方块在完全张开时两侧各留约 10mm 进近余量，避免下降阶段刮碰目标。
  half_size_m: 0.025
  mass_kg: 0.04
  friction: "2.0 0.05 0.001"
  rgba: "0.82 0.22 0.12 1"

grasp:
  # 双指指尖 geom 中点的目标抓取位置（世界坐标）。
  # z 不在此声明，必须由 workbench.top_z_m + target.half_size_m 推出，保证方块贴台面。
  finger_center_xy_m: [0.19, 0.0]
  pregrasp_offset_m: 0.04
  # 预抓取相对抓取点后退的方向，默认沿重力反方向抬起，避免沿夹爪朝向撞入工作台
  approach_direction: [0.0, 0.0, 1.0]
  # 放置段的**净间隙**（指腹距承载面的额外抬高）：与 pick 的 `pregrasp_offset_m`(0.04) 分开声明。
  # 依据（2026-09-28 实测，§11.21）：放置航点本身已在臂的可达边缘（托盘顶面 0.355 m + pad_offset
  # 0.0289 + 载荷半高 0.025 + 间隙 0.04 ⇒ 指腹 0.449 m、腕部 ≈0.50 m ⇒ 距基座 ≈0.587 m vs 可达
  # 0.594284 m）。带 0.04 间隙运行时：transit 段一路夹持正常（指腹 0.13→0.43、双侧接触 true），
  # 但**指腹-载荷间隙在缓慢增大**（−0.0558 → −0.0613 m），而每个航点后还有 8 s 稳定窗
  # （后端 settle_ms = duration×4）⇒ 在高位持续受载下把方块**挤出**夹口。
  # 取 0.01：把航点从边缘拉回（腕部余量约 +0.045 m），同时仍保证不蹭到承载面。
  place_clearance_m: 0.01
  # 指尖相对台面的最小间隙。指腹 geom 中心比抓取点高约 25mm，
  # 直接用方块中心作为指尖中心会让指尖扎进工作台，因此由求解器自动配平高度。
  tip_clearance_m: 0.005
  clearance_iterations: 8
  # 抬升阶段相对抓取点沿接近方向抬起的位移
  lift_offset_m: 0.08
  solver:
    iterations: 800
    step: 0.5
    tolerance_m: 1.0e-05

gripper:
  joints: [joint7, joint8]
  open:
    joint7: 0.035
    joint8: -0.035
  # 闭合不能命令到 0：夹爪是位置控制，命令到行程末端会以巨大接触力挤压目标并让仿真发散。
  # ⚠ 别再试图用"FK 推指腹内表面间距"来定这个值（2026-09-28 实测否掉）：指腹是 **mesh geom**，
  # `geom_size` 只是包围盒 ⇒ 由它推的"内表面间距"（joint7=0.027768 时刚好 = 方块宽 0.05）不是接触面位置。
  # 按那个推论把闭爪位改到 0.0275 后，**臂自己场景的 pick 直接回归红**（Backend 未确认目标已抓取）
  # ⇒ 该推论无效、且证明 0.0275 夹不住。要定"到底多紧才夹得住"必须**测接触力/可搬运高度**，
  # 不能靠几何推断。详见 docs/debug/2026-09-24-joint-model-dog-arm.md §11.14。
  closed:
    joint7: 0.023
    joint8: -0.023
  lift:
    joint1: 0.0
    joint2: 0.2
    joint3: -0.25
    joint4: 0.0
    joint5: 0.0
    joint6: 0.0

scene:
  # --- 本节原先声明的物理参数在 2026-09-20 的光源改动中被误删，已从 85d0073 恢复 ---
  # finger_friction 是纯摩擦抬升的关键；arm_position_kp 决定臂的跟随刚度；
  # gravity/timestep_s 决定动力学步进。
  inject_arm_position_gains: true
  arm_position_kp: 200.0
  # 位置执行器刚度的**下限规则**：kp := max(arm_position_kp, 关节阻尼 × 本系数)。
  # 依据（实测）：joint1 的 damping=300，若 kp 压到 200 则阻尼主导、臂到不了目标角（只能走到一半）。
  # ⚠ 该规则**两个消费者**：臂自己场景（scripts/build_piper_pick_scene.py）与联合构建器
  #   （scene_builder._apply_declared_position_gains）—— 联合模型里的臂必须与已验收的臂场景同一口径，
  #   否则静态保持残余 0.029975223/0.036213257/0.206096435 rad（容差 0.001）会卡死抓取精度。
  arm_position_kp_damping_ratio: 1.5
  timestep_s: 0.002
  gravity: "0 0 -9.81"
  finger_friction: "2.0 0.05 0.001"
  camera:
    name: overhead_camera
    pos_m: [0.28, -0.72, 0.72]
    fovy_deg: 78
    look_at_m: [0.19, 0.0, 0.025]
  # 光源声明（纯视觉，不参与物理）。缺省不注入时 MuJoCo 只有默认头灯，
  # 离屏相机图接近全黑（实测均值 16~24/255、98% 像素≈近黑），人看/截图都不可读。
  # 用**方向光**：与机型工作空间位置无关，两台机型可复用同一组；key 带阴影。
  lights:
    - name: key
      directional: true
      # 主光**近垂直**：顶面受光充足、侧面掠射很暗。
      # 为什么关键：侧脸被照亮后也会落进颜色阈值，最大支撑平面从"顶面"变成"侧面"，
      # 位姿拟合随即被尺寸门禁拦下（实测 fitted=[0.0776, 0.0393] vs 期望 0.050）。
      # 顶视相机 + 近垂直光 = 顶面主导，既看得清又不破坏颜色分割。
      dir: [-0.16, 0.16, -1.0]
      diffuse: [0.85, 0.84, 0.82]
      specular: [0.25, 0.25, 0.25]
      # castshadow 默认关闭：主光阴影会把台面染成与目标相近的色调，掩码被放大。
      # 需要阴影时设为 true，但必须重跑视觉验收（检测器依赖渲染颜色）。
      castshadow: false
    - name: fill
      directional: true
      dir: [0.60, -0.25, -0.55]
      diffuse: [0.30, 0.30, 0.30]
      specular: [0.05, 0.05, 0.05]
    - name: rim
      directional: true
      dir: [0.25, 0.70, -0.40]
      diffuse: [0.22, 0.22, 0.24]
      specular: [0.0, 0.0, 0.0]

acceptance:
  pose_tolerance_m: 0.005
  min_lift_delta_m: 0.02
  min_normal_force_n: 0.2
  max_force_imbalance_ratio: 4.0
  # 求解残差必须显著小于门禁容差，避免用临界解伪造成功
  solver_error_factor: 0.1
  # true 时不使用抓取锚点焊接夹具，抬升位移必须完全由双指摩擦力承担
  require_friction_lift: true

# --- 视觉 Provider 声明（声明式；后端不含任何机型专有路径）---
# 检测器命令支持占位符：{python} {model} {evidence} {config} {target_id}。
# 换机器人时只改本段：证据文件位置、检测器入口、参数真源都随配置走。
vision:
  # 目标在 world 系下的位姿证据（检测器输出或外部感知服务落盘）。
  evidence_file: build/calibration/piper-vision-target.json
  # always：每次抓取前刷新；on_missing：仅证据缺失时刷新；never：只读现有证据。
  refresh: always
  detector:
    command:
      - "{python}"
      - scripts/detect_targets.py
      - --model
      - "{model}"
      - --config
      - "{config}"
      - --output
      - "{evidence}"
      - --extrinsics
      - "{calibration}"
    # 检测器参数真源（其 depth 段覆盖后端内置默认值）。
    config_file: config/piper_multi_target.yaml
    # 相机标定**按机型独立**：里面是"这台相机相对这个基座"的外参，
    # 复用别机型的标定会得到看似合理但实际错误的坐标。
    calibration_file: build/calibration/camera_to_base.json

# --- 重力前馈（构建期生成，与 UR5e 同源配方）---
# 为什么必须生成（2026-09-24 实测判死，docs/debug/2026-09-24-joint-model-dog-arm.md §8）：
# 纯 PD 执行器在重力矩不为零的位形下停在 `ctrl − τ_g/gain` —— 实测 Piper 抓取相位的稳态
# 关节残差 5.314844537182922e-03 rad，经串联臂放大到末端 z 向 11.904 mm，超过 5 mm 抓取门禁
# （s03_pick 因此报「末端未到达目标抓取位姿: distance=0.012113m tolerance=0.005000m」）。
# 生成方式：iraf_core.kinematics.gravity_hold_ctrl（qfrc_bias(qvel=0)/gainprm[0]，并做静态保持
# **自证**：把增量加到目标 ctrl 上保持 hold_ms，要求残余关节误差 ≤ tolerance_rad）。
# 这两个量必须在声明里给出（实现层不写默认值）。
gravity_feedforward:
  hold_ms: 4000
  tolerance_rad: 0.001

# --- 统一入口声明（AGENTS.md 6.4 金路径）---
build:
  baseline_module: build_piper_baseline
  scene: build/models/piper-pick-scene.xml
  pose_evidence: build/calibration/piper-baseline-pose.json
  profile: profiles/piper_mujoco.yaml
  safety_policy: profiles/safety/simulation_lab.yaml

# --- 显示链路声明（scripts/view_mujoco.py --live 使用）---
# 只影响"看得见"的演示路径：skill / 安全策略 / 时序全部来自这里的声明，
# 代码里不写死任何机型或路径（AGENTS.md 5.3）。验收口径不受影响，
# 仍走 build.safety_policy（simulation_lab，max_duration_ms=30000）。
viewer:
  live_skill: display_pick
  live_safety_policy: profiles/safety/display_showcase.yaml
  live_realtime: true
