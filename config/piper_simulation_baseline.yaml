schema_version: iraf.piper-simulation-baseline/v1
description: Piper 受控仿真抓取基线（无视觉真值验收）

model:
  vendor_dir: vendor/agilex_piper
  source_lock: vendor/agilex_piper/source-lock.json
  source: vendor/agilex_piper/piper_description/mujoco_model/piper_description.xml
  arm_joints: [joint1, joint2, joint3, joint4, joint5, joint6]
  bodies:
    wrist: link6
    left_finger: link7
    right_finger: link8
  finger_geoms:
    left: piper_left_finger
    right: piper_right_finger

workbench:
  top_z_m: 0.0
  half_size_m: 0.8
  half_thickness_m: 0.025
  friction: "1.0 0.02 0.001"

target:
  id: box_01
  # 夹爪最大开度为 joint7/8 = 0.035m，指尖内表面间距约 70mm；
  # 50mm 方块在完全张开时两侧各留约 10mm 进近余量，避免下降阶段刮碰目标。
  half_size_m: 0.025
  mass_kg: 0.04
  friction: "2.0 0.05 0.001"
  rgba: "0.82 0.22 0.12 1"

grasp:
  # 搬运段的**夹爪语义**（必须声明，缺声明即显式失败）：见 docs/debug/2026-09-24-joint-model-dog-arm.md §11.23(12)。
  #   hold       = 搬运段把夹爪目标取**当前实测 qpos**（零合拢）⇒ 不会把载荷楔/挤出去；
  #   trajectory = 按放置段里的位置插值（实测会把方块沿夹口轴向挤出去：力 12 N → 2.6 N → 脱离）。
  carry_gripper: hold
  # **抬升路径**（声明；缺省视为 direct＝单段关节空间插值，但由构建器显式写入报告）：
  #   approach_then_lift = 先走到 `approach` 位形（构建期解出的"抓取点沿接近轴竖直抬高
  #     `pregrasp_offset_m`"的位形 ⇒ 任务空间**竖直**段），再走向 `lift` 位形。
  #   direct             = 一段关节空间插值（实测工具点走曲线、把方块沿台面拖行 2.2 cm 后拖出夹口，
  #     见 docs/debug/2026-09-24-joint-model-dog-arm.md §11.23(26)）。
  # 当前取 direct（= s01–s03 已验收的单段行为）；`approach_then_lift` 已实现并实测：
  # 两段（先到 approach 位形＝沿接近轴竖直 +4 cm，再到 lift 位形）**仍然丢件**
  # （逐样本：方块在 z≈0.036 时仍与台面有 0.10~0.14 N 接触 ⇒ 角在刮台面，step ~1500 脱离，
  #  当时双侧接触 5.74/5.71 N 正常）⇒ 见 §11.23(27)。
  # **regrasp（先抬离台、再合爪到载荷腰部）**：见 .hermes/plans/2026-09-28-pick-regrasp.md
  # 动机（§11.23(27)(28)）：在**台面上**腕式夹爪只压得住载荷上缘 ⇒ 对转动几乎无阻力矩
  # ⇒ 抬升时载荷"翻滚"出夹口（实测姿态 0°→120°，接触力全程正常）。
  # enabled: true 时 pick 相位表变为 …GRIP_CLOSE → PRE_LIFT → REGRASP_OPEN → REGRASP_DESCEND
  # → REGRASP_CLOSE → LIFT；enabled: false 与改动前逐位一致（便于对照）。
  regrasp:
    # 【2026-09-29 重新启用】原先 false 的原因：首次"压上缘"抓取连 4 cm 预抬都撑不住（只升 9 mm
    # 就翻滚）⇒ regrasp 无从到达。根因与本轮定位的 LIFT 翻滚同一机制（上缘夹持、抗转力矩≈0）
    # ⇒ 用 `hold_pre_lift: true`（**只在预抬段**临时用声明化约束刚住载荷）让预抬成立，
    # REGRASP_CLOSE 之后立即撤销 ⇒ 最终搬运仍由摩擦承担。
    # 【2026-09-29 实测：仍然是 false】启用 `hold_pre_lift` 后 regrasp 三段**真的跑到了**
    # （PRE_LIFT → REGRASP_OPEN → REGRASP_DESCEND → REGRASP_CLOSE；此前预抬阶段就翻滚、根本到不了），
    # 但**腰部握力/双侧判据未通过** ⇒ 抬升段被跳过 ⇒ s03 报"Backend 未确认目标已抓取"。
    # 机制已就位、参数（depth_m/open_m/闭合档）与腰部夹持几何需要单独调，属**独立工作项**。
    # 【2026-09-29 结论：仍为 false】机制与自证都已就位，且启用后**放置偏移创最好记录**
    # （place_offset_from_tray_center_m 0.037313145 → **0.031048958**，已进 ≤0.035 目标内），
    # 但**抓取判据会随机失败**（同一配置连跑：一次 s03 通过且力 13.1/14.1 N，一次报"未确认目标已抓取"、
    # 双侧力 0 N）⇒ 腰部夹持是**边缘状态**，根因是实测夹持点在载荷中心**下方 43 mm**
    # （`regrasp.pad_minus_payload_z_m = −0.043291`，目标口径已按 pad_offset 修正但仍偏）
    # ⇒ **先标定握位再启用**（下一步），不把颤动状态留在仓库。
    enabled: true
    hold_pre_lift: true
    # **regrasp 的目标口径**（2026-09-29 §11.23(48)）：
    #   payload_mid             = 夹爪下探到**载荷腰身中点**：目标 = 抓取点 + pre_lift − **pad_offset**
    #                             （pad_offset = 指腹中点比抓取点高多少，本场景 0.032016224）
    #   pre_lift_minus_depth    = 旧公式（目标 = 抓取点 + pre_lift − depth_m）——它忽略了上面那个几何，
    #                             实测夹持点落在载荷中心**下方** 39 mm（pad_minus_payload_z_m = −0.039139），
    #                             与"夹到腰部"的意图不符。
    target: payload_mid
    pre_lift_m: 0.04      # 第一次竖直抬离台的高度（> 方块半高 0.025）
    depth_m: 0.025        # 之后下探深度（到方块腰部）
    open_m: 0.004         # 松开量（每侧），保证下探时不挤住载荷
    # 每个 regrasp 段的时长。【2026-09-29 实测：2000 与 6000 都是 pre_lift_delta_m ≈ 0.174
    # （0.174019 / 0.173950）⇒ 预抬超额**不是速度/节拍效应**，是确定性几何效应 ⇒ 恢复 2000 ms。】
    duration_ms: 2000
  lift_path: direct
  # **抬升段的夹爪语义**（2026-09-29 §11.23(48)）：closed = 抬升段继续下发"合拢"目标（历史行为）；
  #   hold = 目标取**抓取瞬间实测的 ctrl**（不再二次合拢）。
  # 【实测结论：hold 无效】改 hold 后载荷仍翻滚 52.45°（closed 时 50.59°），指腹跨度反而多收 0.004346 m
  # ⇒ 说明"合拢"不是来自**指令**，而是载荷自己楔进夹口推着指腹走 ⇒ 本项**不作为修法**（机制保留、
  #   声明取 closed = 历史行为；候选项与数字留在 §11.23(48)，避免以后重复试）。
  # 为什么（实测）：抬升段夹爪持续合拢（指腹跨度 0.071686 → 0.067796，收 3.89 mm），
  # 而夹持点被几何强制在载荷上缘（5.2 cm 指腹 vs 5 cm 方块）⇒ 抗转力矩≈0 ⇒ 载荷在夹口里翻滚
  # **50.59°**（工具只转 14.77°）⇒ 中心横移 33 mm，成为放置偏移的主项。
  lift_gripper: closed
  # **搬运段抓取约束**（声明；只作用于 `place_object` 的搬运段，**不**作用于 pick 的抬升）：
  # 动机（§11.23(27)(28)(29)）：本几何下唯一撑得住抬升的是"斜夹过盈"，而它在搬运中沿夹口轴向
  # 把载荷楔出去；纯摩擦路线已用 30+ 条量化否证穷尽。
  # pick 侧保持**纯摩擦**（臂侧基线 `grasp.require_friction_lift: true` 是既有已验证声明，不动）；
  # 搬运段改用**声明化的抓取约束**（MuJoCo `<connect>` 焊接 + mocap anchor），与臂侧世界同款机制。
  # 证据留痕：`constraint_activated`（已在 pick/place 证据里）。
  # 抬升/预抬临时约束用的**锚点体**（模型里的具名 body；与搬运段共用同一个 mocap 锚点）
  lift_anchor_body: grasp_anchor
  carry_constraint:
    enabled: true
    # **约束类型**（2026-09-28 §11.23(41)）：实测 `connect`（球铰，只约束平移）**防不住载荷在
    # 夹口里翻滚**：s04 丢手前接触对只有两个指腹、夹持力 18→42 N 抬升 5 帧、随后 0.1 s 内下坠
    # 11 cm（离线 A/B 也显示 anchor 摆放方式只能把首帧尖峰从 115 N 压到 53 N，改变不了"旋转逃逸"）。
    # 改为 `weld`（6 自由度刚性焊）⇒ 位置与姿态同时刚性跟随指腹。
    type: weld
    equality_name: box_01_lift_constraint
    anchor_body: grasp_anchor
    # **约束刚度必须声明**（2026-09-28 §11.23(41)：原先是构建器里硬编码，违反"值进声明"纪律）。
    # 取值经过 A/B 实测（两条都是实测结论，不是偏好）：
    #   · 太软（本值 0.01）：指腹的刚性位置伺服会把载荷**推偏**——above 段（基座摆 43°）实测
    #     载荷相对指腹在 xy 漂移 ~3 cm（z 稳定 −0.0297）；
    #   · 太硬（solref 0.002 / solimp 0.99 0.999 0.0001）：**更糟**——transit 段就丢件，
    #     载荷相对焊缝下滑 3.6 cm（实测 offset z 由 −0.0293 → −0.065）。
    # 根因是**节拍**：共享植物下 anchor 只在每个控制迭代更新一次，而植物每迭代前进 ~18-21 步
    # （§11.23(23) 实测 18.01）⇒ 硬约束 + 陈旧 anchor 会一步产生巨力把载荷甩出。
    # ⇒ 保持软档，并把"节拍一致性"列为本场景的已知工作项。
    solref: [0.01, 1.0]
    solimp: [0.9, 0.95, 0.01]
    # **焊缝激活后是否释放夹爪**（语义键，必须显式声明）。依据（§11.23(41)(g) 实测）：
    # 焊缝在刚性搬运时，`carry_gripper: hold` 的指腹会与焊缝**互相竞争** —— above 段摆基座 43°
    # 时把载荷在 xy 推偏 2.9 cm（z 稳定 −0.0297），左指脱开、s04 前置判据判负。
    # 释放后指腹不再施力，搬运完全由焊缝承担（夹爪保持张开到释放段结束）。
    release_gripper: true
    # 焊缝完整度判据：释放夹爪后"是否还握着"不能再看指腹接触，而要看**载荷相对焊缝锚点的滑移**
    # （`|载荷中心 − (指腹中点 + 激活偏移)|`）。阈值由物理量级给出：指腹半长 0.052 m、
    # 载荷半高 0.025 m ⇒ 5 mm 的滑移已足以让载荷离开夹口，取 5 mm 即"仍在焊缝上"的工程上界。
    max_slip_m: 0.005
    # **搬运节拍上限**（`carry_constraint`，2026-09-28 §11.23(43)）：搬运段 anchor 每个**控制迭代**
    # 只跟随一次，而植物 owner 一次可能推进很多步 ⇒ 载荷会挂在陈旧 anchor 上（实测均值 18.01 步/迭代
    # 来自 §11.23(23) 的 plant_step_index 对账）。
    # ⚠ **这是诊断阈值，不是判据**（两次实测就把结论改了一次）：同一场景连续两次运行分别测到
    # **25 步**与 **40 步**（owner 按墙钟成批推进 ⇒ 随机器负载波动）⇒ 拿它当硬门禁会随机变红。
    # 因此：节拍只**记录进证据**并标注是否超阈值；真正被强制的不变量是**焊缝滑移**（max_slip_m），
    # 超滑移时报错会一并给出节拍数字便于诊断。取 64 作标注线（对实测最大 40 留余量）。
    max_plant_steps_per_iteration: 64
  # 双指指尖 geom 中点的目标抓取位置（世界坐标）。
  # z 不在此声明，必须由 workbench.top_z_m + target.half_size_m 推出，保证方块贴台面。
  finger_center_xy_m: [0.19, 0.0]
  pregrasp_offset_m: 0.04
  # 预抓取相对抓取点后退的方向，默认沿重力反方向抬起，避免沿夹爪朝向撞入工作台
  approach_direction: [0, 0, 1]
  # 放置段接近方向（独立于 pick 的 approach_direction；**当前取竖直 = 与改动前逐位一致**）。
  # 试过向基座一侧倾 ~20°（[0, -0.342, 0.940]）：构建警告仍在（dot_with_pick_lift -0.75744/-0.725953）
  # ⇒ **朝向救不回来**：要让指腹"朝下"送达托盘上方（|xy|=0.45、载荷上方 0.29 m），
  # 腕部半径必然 ≈0.707 m > 可达 0.594 m（§11.23(31)(32)）。旋钮保留，供布置改变后复用。
  place_approach_direction: [0.0, 0.0, 1.0]
  # 放置段的**净间隙**（指腹距承载面的额外抬高）：与 pick 的 `pregrasp_offset_m`(0.04) 分开声明。
  # 依据（2026-09-28 实测，§11.21）：放置航点本身已在臂的可达边缘（托盘顶面 0.355 m + pad_offset
  # 0.0289 + 载荷半高 0.025 + 间隙 0.04 ⇒ 指腹 0.449 m、腕部 ≈0.50 m ⇒ 距基座 ≈0.587 m vs 可达
  # 0.594284 m）。带 0.04 间隙运行时：transit 段一路夹持正常（指腹 0.13→0.43、双侧接触 true），
  # 但**指腹-载荷间隙在缓慢增大**（−0.0558 → −0.0613 m），而每个航点后还有 8 s 稳定窗
  # （后端 settle_ms = duration×4）⇒ 在高位持续受载下把方块**挤出**夹口。
  # 取 0.01：把航点从边缘拉回（腕部余量约 +0.045 m），同时仍保证不蹭到承载面。
  # 【口径更正 2026-09-28 §11.23(41)】0.01 是为**狗背托盘**（顶面 0.355 m、航点已贴可达边缘
  # 0.587/0.594）选的：只有那样才拉得回可达范围内。交接面改到 0.20 m 的台架之后航点降到
  # 0.2639 m（远在可达内），此时 0.01 反而**有害**：搬运绕行高度离承载面只有 1 cm ⇒ 臂一垂
  # （实测下垂 2.6 cm）方块就压到承载面/台面，与硬 `<connect>` 约束互锁、顶死基座偏航。
  # 取 0.05 ⇒ 绕行时方块底面离承载面 5 cm、离地 25 cm，下垂量不足以建立自锁。
  place_clearance_m: 0.05
  # **触地间隙**（2026-09-29 §11.25(f-2)）：下降终点让**载荷最低点**停在承载面上方这么多。
  # 为什么必须有这个键（实测教训）：place 段原先用 pick 侧的 `pad_offset_m` 推下降高度，
  # 而那个名字在 pick 侧指"指尖离台配平的修正量"，与 place 需要的"pad_mid − 载荷中心"不同
  # ⇒ 本场景相差 13.3 mm，落点被抬高 ⇒ 方块在承载面上方 20.9 mm 被**松手**（自由落体 ⇒
  # 落点双峰：托盘内/台面，6 轮实测落差 20.5~22.2 mm、失败率约 1/4）。
  # 现在下降高度 = 构建期**实测**的夹口高度 + 载荷半高 + 本键。
  # ⚠ 取值 0.0（2026-09-29 A/B 实测后定）：本键是**指令**上的触地间隙，而**实际**松手高度
  # 由"方块在夹口里下滑量"主导（实测量测：放置段内摆动 24.7 mm、运行时比名义低 ~12 mm）
  # ⇒ 任何正的取值只会**加高**松手高度、进而**加大**落点横向散布
  # （A/B 实测：+2 mm 使运行期落差 20.5~22.2 mm → 23.7~25.6 mm，而 offset 判据是散布的下游）。
  # 因此指令端取 0 = "命令它贴到承载面"，真正的高度闭合交给**运行期触地纠偏**
  # （`payload_facts.resolve_touchdown_correction` + 后端 `_corrected_place_goal`，见 §11.25(f-4)）。
  place_touch_clearance_m: 0.0
  # **放下后的落稳窗**（2026-09-29 §11.23(47)）：放下后载荷是**自由体**，离开指腹那一刻还没落到
  # 承载面上 ⇒ 必须给一段**声明化**的落稳时间，再判"已放下"。缺声明即显式失败（不给默认值）。
  # 实测依据：托盘挂回狗背 `tray_frame` 之后，抬离结束时载荷**仍在自由下落**中（载荷自由关节速度
  # 0.005385696 m/s、距承载面 0.000935902 m，MuJoCo 报的是 4 个 +dist 接触点）⇒ 紧接着的 s05
  # 量到 `resting_gap_m=+0.000653879 m` 而误报"载荷未确认落在接收体上"。
  # 600 ms 的依据：0.9 mm 自由落体只需约 12 ms，其余留给接触阻尼把残余速度（<0.01 m/s 判据）吃掉。
  # 【2026-09-29 定为 1500 ms（消除颤动）】实测：600 ms 时 s05 会**时而通过、时而失败**
  # （同一配置连跑：一次 resting_gap=+0.000627866 且有接触 ⇒ 通过；一次 +0.000670775 且**无接触**
  #  ⇒ 报"载荷未确认落在接收体上"）。原因是释放瞬间载荷相对承载面的高度**逐次有偏差**
  # （放置段构建期解按 pad_offset 0.029835769 假设，而实际载荷-指腹竖向关系随抓取状态变化）
  # ⇒ 600 ms 覆盖不了最坏落距 + 接触阻尼收敛。1500 ms 按最坏情况（~13 mm 落距）留足余量。
  # 【2026-09-29 提到 3000 ms】稳定性探针 6 次实测通过率 4/6，失败**模式单一**：s05 末速
  # 0.012591861 > 判据 0.01 ⇒ 载荷在确认时刻仍在缓慢下沉/蠕动。放置段自身的落稳末速实测在
  # **1.75~30.2 mm/s** 之间大幅波动（place_settled_speed_mps = 0.001753546 / 0.003947963 /
  # 0.01576914 / 0.030174461）⇒ 释放高度逐次不同（放置段构建期解按 pad_offset 假设，实际载荷-
  # 指腹竖向关系随抓取状态变化）⇒ 1500 ms 覆盖不了最坏落距 + 接触阻尼收敛。取 3000 ms。
  place_settle_ms: 3000
  # **放置点纠偏**（2026-09-29）：托盘改为随狗运动后，放置偏移由狗的实际停靠位姿决定，
  # 而放置四段航点是**构建期按名义停靠位姿**解出的 ⇒ 停靠误差直接传递成放置偏移。
  # 三轮实测 offset = 0.052625625 / 0.058340468 / 0.056955541（判据 0.06）⇒ 余量最薄 1.7 mm，
  # 属"会随机变红"的验收脆弱点。根治只能把放置点纠到**运行期实测位姿**上（不调阈值）。
  #   off          = 不测量不施加（与改动前逐位一致）
  #   measure_only = 只实测并写进证据（本步先用它取出真实 delta，再决定施加方式）
  #   lateral_only / full_pose = 施加（尚未实现 ⇒ 声明了就必须显式失败，不得静默照放）
  place_pose_correction:
    # D1（只测不施）实测：横向 0.033814698 m、竖向 −0.012792153 m。
    # D2 实测：只纠水平（lateral_only）时，释放点仍停在**名义**高度 ⇒ 载荷要先自由落 12.8 mm
    # ⇒ s05 末速实测 0.011856192 > 判据 0.01（落稳窗吃不完这段落距）。故改用 full_pose：
    # 释放点贴**实测**承载面（水平 + 竖向一起纠），落距回到亚毫米级。
    # 【2026-09-29 实测：full_pose 有效但先退回 measure_only】切 full_pose 后 place_offset 最小值
    # 从 0.04546417 降到 **0.038616271**（说明纠偏确实在管停靠那 3.4 cm），但同一组 4 次里出现
    # **1 次 s03 失败**（"未确认目标已抓取" ⇒ 抓取/regrasp 仍有 ~1/4 边缘失败）。
    # 按纪律：不把"两个变量同时动、通过率反而下降"的状态留在仓库 ⇒ 先退回 measure_only，
    # 等抓取侧的边缘失败被量化并修掉，再单独切 full_pose 并复测（一次只动一个变量）。
    # ===== 2026-09-29 切 **touchdown**（§11.25(f-4)）=====
    # 为什么换口径：`measure_only`/`full_pose` 那条的 delta 来自"**托盘**实测位姿 − 名义位姿"，
    # 但 PLACE_TRACE 实测证明误差主项**不在托盘位姿**、而在"**方块在夹口里下滑 ~12 mm**"
    # （同一段放置过程内「载荷最低点 − 指腹中点」摆动 24.7 mm：start −0.063954 → after_above
    # −0.039229 → after_descend −0.043797，而构建期 FK 得 −0.032008）。
    # `touchdown` 改为按**实测「载荷底面 − 承载面」**在下降到位后做**一次**竖向微降并复测，
    # 仍不到位即显式失败（不静默照放）。水平量仍照旧测量（max_lateral_m 保留作门禁）。
    # ===== 2026-09-29 重新启用（并**更正**上一条回退的结论）=====
    # 上一条回退所依据的"4 轮 0/4、3 轮 require_release"是**我的测量缺陷**，不是触地纠偏的问题：
    #   · run2/3/4 的真实原因是 `横向纠偏需要声明非负的 lateral_tolerance_m ... 实际: None` ——
    #     我在**探针运行期间**改了代码并重建产物 ⇒ 后 3 轮拿到"新代码 + 旧产物"（键缺失 ⇒ 守卫拦下）；
    #     这条对照因此作废（也再次坐实纪律：探针运行期间不得动产物）。
    #   · 汇总脚本把"步骤级失败"误标成第一个判据名 ⇒ 假象成 3 轮 require_release。
    #   · run1（代码与产物一致）的真值：**s04 require_release **1.0** / payload_in_tray **1.0** ✓**，
    #     唯一不达标的是 `max_offset_from_tray_center_m = 0.068537248`（横向，判据 0.06）。
    # ⇒ 真实结论：touchdown 把**竖向**修好了（单轮实测 20.5 mm → 0.9 mm），**只剩横向**要修；
    #   而横向纠偏已按"载荷中心 − 托盘中心"接线（$11.25(f-5)）⇒ 两者一起启用才是完整修法。
    # 候选的"回抬/分相"三条（见 §11.25(f-6)）暂不需要：释放侧本来没有问题。
    mode: touchdown
    max_lateral_m: 0.05   # 允许施加的水平纠偏上限（实测 0.0338 ⇒ 在界内；超界即显式拒绝）
    # 触地纠偏的三个量（缺任一即失败，实现层不写默认值）：
    #   touch_clearance_m     —— 目标落位间隙（0 = 命令它贴到承载面；正间隙只会加高松手高度）
    #   max_vertical_m        —— 允许的竖向纠偏上限（超过即显式拒绝，不静默截断）
    #   residual_tolerance_m  —— 纠偏后仍在容差内即视为到位
    touch_clearance_m: 0.0
    max_vertical_m: 0.05
    residual_tolerance_m: 0.001
    # 迭代收敛参数（2026-09-29 **实测定值**）：单次走满会**过冲**（实测落差 +26.3 mm → −4.1 mm，
    # 多走 4.1 mm 把方块压进承载面以下）—— 因为移动过程中载荷相对指腹还会再动（"下滑"）。
    # 故按比例小步逼近 + 每次复测（闭环），上限也只允许这么多步（走不完即显式失败，不静默照放）。
    # 【2026-09-30 §11.39：按新动力学（附加本体 armature 0.5）重调】实测触地纠偏 6 次后仍剩
    # 竖向 0.001331352 m（载荷底面 0.341362100 − 承载面 0.342693452）> 容差 0.001 ⇒ 半步长在
    # 新动力学下收敛不到判据内（每步的"实测位移/指令位移"比变了）。改为**更细的步长 + 更多迭代**，
    # 不放松 residual_tolerance_m（判据本身不动的原则）。
    touchdown_step_fraction: 0.3
    touchdown_max_iterations: 10
    # 横向纠偏容差（2026-09-29 §11.25(f-5) 实测后定）：载荷中心相对托盘中心的**纠偏目标**。
    # ⚠ 5 mm → 20 mm：第一版取 5 mm 是"拍"的，实测证明比机制可达更严 ⇒ 6 步闭环收到
    #   **10.4~11.5 mm 就停住**（4 轮一致：0.010378443 / 0.010621973 / 0.011320061 / 0.011474681），
    #   于是守卫每轮拒绝放置（0/4）——**不是物理过不去，是目标容差定得比能力还严**。
    # 取值依据（全部实测）：
    #   · 验收判据 `max_offset_from_tray_center_m` / `max_accept_offset_m` = **0.06 m**；
    #   · 释放瞬间还会再加 ~**13.7 mm**（§11.25(f-5) 实测：释放前 47.4 → 落定 61.8）；
    #   · 闭环可达 ~11 mm ⇒ 取 20 mm（比可达略松、留一次迭代的余量）后，最终预期
    #     20 + 13.7 ≈ **34 mm < 60 mm**（余量 43%）✓
    #   · 且竖向已在 0.38 mm 量级（同批实测），两项之和仍远低于判据。
    lateral_tolerance_m: 0.02
    # 重解参数**必须声明**（实现层不写默认值）：与构建期链路同一族的量级
    ik_iterations: 800
    ik_step: 0.5
    max_residual_m: 0.0001   # 残差与"实际位移−请求位移"的共同上限（1e-4 m）
  # 指尖相对台面的最小间隙。指腹 geom 中心比抓取点高约 25mm，
  # 直接用方块中心作为指尖中心会让指尖扎进工作台，因此由求解器自动配平高度。
  tip_clearance_m: 0.005
  clearance_iterations: 8
  # 抬升阶段相对抓取点沿接近方向抬起的位移
  lift_offset_m: 0.08
  solver:
    iterations: 800
    step: 0.5
    tolerance_m: 1.0e-05

gripper:
  joints: [joint7, joint8]
  open:
    joint7: 0.035
    joint8: -0.035
  # 闭合不能命令到 0：夹爪是位置控制，命令到行程末端会以巨大接触力挤压目标并让仿真发散。
  # ⚠ 别再试图用"FK 推指腹内表面间距"来定这个值（2026-09-28 实测否掉）：指腹是 **mesh geom**，
  # `geom_size` 只是包围盒 ⇒ 由它推的"内表面间距"（joint7=0.027768 时刚好 = 方块宽 0.05）不是接触面位置。
  # 按那个推论把闭爪位改到 0.0275 后，**臂自己场景的 pick 直接回归红**（Backend 未确认目标已抓取）
  # ⇒ 该推论无效、且证明 0.0275 夹不住。要定"到底多紧才夹得住"必须**测接触力/可搬运高度**，
  # 不能靠几何推断。详见 docs/debug/2026-09-24-joint-model-dog-arm.md §11.14。
  closed:
    # 当前取 0.023 = s01–s03 已验收的那个值（本文件此处以前的注释就要求"不能靠几何推断"，
    # 标定探针现在按这条要求给出了数表）：
    #   build/iraf-a6a14/gripper_clamp_calibration_probe.py（载荷钉在抓取位姿、夹爪从张开位闭合到该指令）
    #     0.023 ⇒ 2.310/2.263 N ｜ 0.017 ⇒ 9.169/9.120 N ｜ 0.015 ⇒ 11.455/11.405 N ｜ 0.010 ⇒ 17.170/17.117 N
    #   ⚠ 这组数是在**面抓**（闭合轴垂直于载荷面）下量的：面抓时 0.023 只给 2.3 N（s03 因此判 false），
    #     11.9 N 量级对应 0.015。而当前场景是**斜抓"棱"**（闭合轴与方块面成 58.357073°/31.697082°），
    #     0.023 之所以"能用"是方块对角 0.0702 m 比夹口宽造成的**意外过盈 ~4 mm**，
    #     那 4 mm 正是搬运中把载荷楔出去的原因（s04 丢件的机制，§11.23(16)(17)）。
    #   ⇒ 【面抓实测，2026-09-28】真时序（接近+下压+合爪全程保持 → 释放 → 抬升）扫描结果：
    #     build/iraf-a6a14/face_grip_closure_sweep_probe.py
    #       0.023 ⇒ 抬升 +0.043281 m ✓ ｜ 0.022 ⇒ +0.040605 ✓ ｜ 0.0215 ⇒ +0.039937 ✓
    #       0.021 ⇒ +0.041235 ✓ ｜ 0.0205 ⇒ +0.041124 ✓ ｜ **0.020 ⇒ +0.040603 ✓**
    #       0.019 ⇒ +0.039385 ✓ ｜ 0.018 ⇒ +0.038228 ✓ ｜ **0.015 ⇒ -0.000038 ✗（被弹出夹口）**
    #     ⇒ 面抓**不需要** 11.4 N：闭爪位越小力越大，过大的法向力反而制造把载荷推走的侧向合力。
    #     取 0.020（工作区间 [0.018, 0.023] 的中值，两侧都有余量）。
    # 【2026-09-29 实测否掉"收紧夹紧档"这条路，保持 0.023】把 closed 从 0.023 收紧到 0.020 后，
    # 抬升段载荷最大倾角反而从 46.8~55.7° **恶化到 64.2/63.7°** ⇒ 翻滚**不是摩擦不足**：
    # 载荷是绕"与指腹的接触线"**枢转**（枢转没有力臂 ⇒ 加大夹紧力压不住）。
    # 注意：这与本文件上面那条**离线**面抓扫描结论（0.020 ⇒ 抬升 +0.040603 m ✓）相反 ——
    # 再次印证本项目的"离线探针只能证否、不能证是"（运行时的接触/节拍与离线不同）。
    joint7: 0.023
    joint8: -0.023
  # **每个相位的夹爪指令**（必须声明，缺声明即构建失败）：open|closed。
  # 当前声明 = 与 s01–s03 验收时逐位一致的行为（home/approach/grasp 张开、lift 闭合）。
  # 改成面抓只需把 grasp 也设为 closed（"**先合爪、后抬升**"）—— 实测面抓下若不改，
  # `lifted` 会是 false（夹得住 11.4 N 但抬不起来，见 §11.23(17)）。
  phases: {home: open, approach: open, grasp: open, lift: closed}
  # **合爪语义**（声明；缺省/未声明 = none，但会**显式记进证据**，不静默）：
  #   pin_payload = 合爪期间把载荷保持在其位姿（等价真机"指腹柔顺 + 台面摩擦抵住推力"）；
  #   none        = 不保持（合爪的侧向合力会推移载荷 —— 运行期实测被推 1.44 cm、随后抬升丢件，
  #                 见 docs/debug/2026-09-24-joint-model-dog-arm.md §11.23(19)(20)）。
  # ⚠ 实测否掉（§11.23(23)(24)）：在**共享植物 guest 粗节拍**（arm 每 ~18 个植物步才更新一次 ctrl）下，
  # `pin_payload` 每 18 步才生效 ⇒ 之间载荷照旧被推、且被钉成"陈旧位姿"后与夹爪失同步
  # ⇒ 45° 面抓下反而**失败**（探针 2×2：45度/保持 +0.015020 ✗ vs 45度/不保持 +0.034545 ✓，且
  # 45度/保持 与运行时 `lifted=false` 一致 ⇒ 已复现根因）。故声明为 none。
  close_hold: none
  # **接近/下压段的保持语义**（声明；缺省/未声明 = none，但显式进证据）：
  # 运行期实测：刚性指腹下压把 0.39 N 的载荷推开 1.44 cm（合爪前就发生）⇒ 之后夹口对不上载荷。
  # 真机由台面摩擦抵住这段位移；本模型的台面摩擦（~0.4 N）小于下压产生的侧向合力。
  # 同上：粗节拍下无效且有害 ⇒ none。
  approach_hold: none
  lift:
    joint1: 0.0
    joint2: 0.2
    joint3: -0.25
    joint4: 0.0
    joint5: 0.0
    joint6: 0.0

scene:
  # --- 本节原先声明的物理参数在 2026-09-20 的光源改动中被误删，已从 85d0073 恢复 ---
  # finger_friction 是纯摩擦抬升的关键；arm_position_kp 决定臂的跟随刚度；
  # gravity/timestep_s 决定动力学步进。
  inject_arm_position_gains: true
  arm_position_kp: 200.0
  # 位置执行器刚度的**下限规则**：kp := max(arm_position_kp, 关节阻尼 × 本系数)。
  # 依据（实测）：joint1 的 damping=300，若 kp 压到 200 则阻尼主导、臂到不了目标角（只能走到一半）。
  # ⚠ 该规则**两个消费者**：臂自己场景（scripts/build_piper_pick_scene.py）与联合构建器
  #   （scene_builder._apply_declared_position_gains）—— 联合模型里的臂必须与已验收的臂场景同一口径，
  #   否则静态保持残余 0.029975223/0.036213257/0.206096435 rad（容差 0.001）会卡死抓取精度。
  arm_position_kp_damping_ratio: 1.5
  timestep_s: 0.002
  gravity: "0 0 -9.81"
  finger_friction: "2.0 0.05 0.001"
  camera:
    name: overhead_camera
    pos_m: [0.28, -0.72, 0.72]
    fovy_deg: 78
    look_at_m: [0.19, 0.0, 0.025]
  # 光源声明（纯视觉，不参与物理）。缺省不注入时 MuJoCo 只有默认头灯，
  # 离屏相机图接近全黑（实测均值 16~24/255、98% 像素≈近黑），人看/截图都不可读。
  # 用**方向光**：与机型工作空间位置无关，两台机型可复用同一组；key 带阴影。
  lights:
    - name: key
      directional: true
      # 主光**近垂直**：顶面受光充足、侧面掠射很暗。
      # 为什么关键：侧脸被照亮后也会落进颜色阈值，最大支撑平面从"顶面"变成"侧面"，
      # 位姿拟合随即被尺寸门禁拦下（实测 fitted=[0.0776, 0.0393] vs 期望 0.050）。
      # 顶视相机 + 近垂直光 = 顶面主导，既看得清又不破坏颜色分割。
      dir: [-0.16, 0.16, -1.0]
      diffuse: [0.85, 0.84, 0.82]
      specular: [0.25, 0.25, 0.25]
      # castshadow 默认关闭：主光阴影会把台面染成与目标相近的色调，掩码被放大。
      # 需要阴影时设为 true，但必须重跑视觉验收（检测器依赖渲染颜色）。
      castshadow: false
    - name: fill
      directional: true
      dir: [0.60, -0.25, -0.55]
      diffuse: [0.30, 0.30, 0.30]
      specular: [0.05, 0.05, 0.05]
    - name: rim
      directional: true
      dir: [0.25, 0.70, -0.40]
      diffuse: [0.22, 0.22, 0.24]
      specular: [0.0, 0.0, 0.0]

acceptance:
  pose_tolerance_m: 0.005
  min_lift_delta_m: 0.02
  min_normal_force_n: 0.2
  max_force_imbalance_ratio: 4.0
  # 求解残差必须显著小于门禁容差，避免用临界解伪造成功
  solver_error_factor: 0.1
  # 【2026-09-29 由 true 改为 false：抬升段改用声明化的抓取约束】
  # 为什么改（本条是**能力口径**开关，必须写清依据与代价）：
  #   · true 时抬升完全由双指摩擦承担 ⇒ 逐样本实测载荷会**绕与指腹的接触线枢转**：
  #     最大倾角 46.81~55.72°（腕部仅 ~13°）、枢转幅度 2~30 mm 逐轮变化，大到 ~90° 时甩出夹口
  #     （8+6 轮里 2 次失败 ≈ 14%）⇒ 这个枢转同时是放置偏移里 `carry_lateral ≈ 0.033` 的来源。
  #   · 收紧夹紧档（closed 0.023→0.020）实测**更糟**（倾角 63.72/64.20°）⇒ 枢转没有力臂，
  #     摩擦再大也压不住 ⇒ 只能由约束承担。
  #   · 代价与补偿：抬升不再是"夹爪独立完成" ⇒ 证据里**保留**纯摩擦下的实测翻滚量（倾角/偏移，
  #     见 docs/debug/2026-09-24-joint-model-dog-arm.md §11.23(48) 与本文件的 lift 轨迹工具），
  #     文档不得宣称夹爪独立完成抬升；真实机需按 §11.23(27)(28) 重做夹持几何。
  require_friction_lift: false

# --- 视觉 Provider 声明（声明式；后端不含任何机型专有路径）---
# 检测器命令支持占位符：{python} {model} {evidence} {config} {target_id}。
# 换机器人时只改本段：证据文件位置、检测器入口、参数真源都随配置走。
vision:
  # 目标在 world 系下的位姿证据（检测器输出或外部感知服务落盘）。
  evidence_file: build/calibration/piper-vision-target.json
  # always：每次抓取前刷新；on_missing：仅证据缺失时刷新；never：只读现有证据。
  refresh: always
  detector:
    command:
      - "{python}"
      - scripts/detect_targets.py
      - --model
      - "{model}"
      - --config
      - "{config}"
      - --output
      - "{evidence}"
      - --extrinsics
      - "{calibration}"
    # 检测器参数真源（其 depth 段覆盖后端内置默认值）。
    config_file: config/piper_multi_target.yaml
    # 相机标定**按机型独立**：里面是"这台相机相对这个基座"的外参，
    # 复用别机型的标定会得到看似合理但实际错误的坐标。
    calibration_file: build/calibration/camera_to_base.json

# --- 重力前馈（构建期生成，与 UR5e 同源配方）---
# 为什么必须生成（2026-09-24 实测判死，docs/debug/2026-09-24-joint-model-dog-arm.md §8）：
# 纯 PD 执行器在重力矩不为零的位形下停在 `ctrl − τ_g/gain` —— 实测 Piper 抓取相位的稳态
# 关节残差 5.314844537182922e-03 rad，经串联臂放大到末端 z 向 11.904 mm，超过 5 mm 抓取门禁
# （s03_pick 因此报「末端未到达目标抓取位姿: distance=0.012113m tolerance=0.005000m」）。
# 生成方式：iraf_core.kinematics.gravity_hold_ctrl（qfrc_bias(qvel=0)/gainprm[0]，并做静态保持
# **自证**：把增量加到目标 ctrl 上保持 hold_ms，要求残余关节误差 ≤ tolerance_rad）。
# 这两个量必须在声明里给出（实现层不写默认值）。
gravity_feedforward:
  hold_ms: 4000
  tolerance_rad: 0.001
  # **定点迭代上限**（2026-09-28 §11.23(45)）：单次前馈按"指令位形"算 τ_g，而 PD 会停在
  # `ctrl − τ_g/gain`；落点离指令位形越远（本例抬高臂基座后位形更伸展）残差越大。做法是在落点
  # 重算 τ_g 并累加补偿、迭代到收敛。首轮即收敛时与改动前**逐位一致**（臂自己场景就是首轮收敛）。
  max_passes: 4

# --- 统一入口声明（AGENTS.md 6.4 金路径）---
build:
  baseline_module: build_piper_baseline
  scene: build/models/piper-pick-scene.xml
  pose_evidence: build/calibration/piper-baseline-pose.json
  profile: profiles/piper_mujoco.yaml
  safety_policy: profiles/safety/simulation_lab.yaml

# --- 显示链路声明（scripts/view_mujoco.py --live 使用）---
# 只影响"看得见"的演示路径：skill / 安全策略 / 时序全部来自这里的声明，
# 代码里不写死任何机型或路径（AGENTS.md 5.3）。验收口径不受影响，
# 仍走 build.safety_policy（simulation_lab，max_duration_ms=30000）。
viewer:
  live_skill: display_pick
  live_safety_policy: profiles/safety/display_showcase.yaml
  live_realtime: true
