schema_version: iraf.machine-declaration/v1
# 机型运行时绑定（**联合场景**版）：与 `piper.yaml` 唯一差别是 `backend_config.report` 指向
# **联合报告**（狗+臂同模型的产物）⇒ 臂在联合场景里工作，而**不改**臂侧既有绑定与验收。
robot:
  id: piper
  profile: profiles/piper_mujoco.yaml
  backend: mujoco_arm
  backend_config:
    mode: scene_report
    report: build/scenes/handoff_lab/handoff_lab_joint.json
    target_tolerance_m: 0.005
    # **演示必须实时步进**（2026-09-29 实测）：原先 false ⇒ 8 s 仿真只花 0.78 s 墙钟，
    # 而窗口（模型加载 + GL 初始化）要十几秒才出来 ⇒ 用户看到的第一个画面里狗**已经站在交接位**，
    # "一开始没有走的动作"就是这么来的（狗实际走了 0.45 m，只是发生在窗口出来之前）。
    # 与 config/machines/piper.yaml 同一口径：交互/演示实时；批量与 CI 另建声明设 false。
    realtime: true
  plant:
    # 共享植物角色：**guest** —— 本本体在联合场景里注入 `owner`（四足）持有的植物，
    # 因此不得推进时间，只能写自己 name_map 界定的执行器（越界即显式失败）。
    # guest_timeout_factor = 等 owner 推进时间的**墙钟**余量系数（超时 = 步数 × timestep × 系数）。
    # 取值依据：四足 100 Hz 控制循环在 4 核机上约 3000 步/墙钟秒（实测 build/iraf-a6a14/
    # shared-plant-dog-owner.json：stand 9000 步 ≈ 数秒墙钟），臂一段 2000 ms 的 move_joint
    # 需要 200 步 ⇒ 30 倍余量足以覆盖机器被占满的情况；仍会显式超时而不是静默失败。
    role: guest
    owner: unitree_go2
    guest_timeout_factor: 30.0
skills:
  safety_policy: profiles/safety/simulation_lab.yaml
