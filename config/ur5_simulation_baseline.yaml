schema_version: iraf.ur5-simulation-baseline/v1
description: UR5e + Robotiq 2F-85 受控仿真抓取基线（无视觉真值验收）

model:
  # 由 scripts/assemble_ur5e_2f85.py 从 Menagerie 官方模型组装。
  # source_lock 记录来源哈希与**有意偏离官方的改动**（可审计）。
  source: build/models/ur5e_2f85/ur5e_2f85.xml
  source_lock: build/models/ur5e_2f85/ur5e_2f85-source-lock.json
  arm_joints:
    [shoulder_pan_joint, shoulder_lift_joint, elbow_joint,
     wrist_1_joint, wrist_2_joint, wrist_3_joint]
  # 双指不是 body 而是 **pad geom**：2F-85 的 pad 挂在
  # follower → spring_link 上，body 层还有 silicone_pad 子体，
  # 用 geom 才能拿到真正的接触面（也是 mj_contactForce 的判定对象）。
  #
  # left/right 是**对齐门禁**与外层契约用的"代表接触面"（每侧一个）；
  # pad_boxes 是**IK 目标**用的完整夹持面列表（每侧两个）。
  # 两者职责不同、不可互相替代，原因见下方 pad_boxes 的说明。
  finger_geoms:
    left: rq2f85_left_pad1
    right: rq2f85_right_pad1
    # 2F-85 每侧 pad 是**上下两个 box**（pad1 在局部 +z、pad2 在 -z），
    # 真正的"夹持区中心"是这 4 个 box 的中点，而不是任一 pad1 的中点。
    #
    # 实测代价（probe_pad_vs_block.py + 本仓库 ur5-status.md 记录的阻塞点）：
    # 用 pad1 中心当 IK 目标时，整套 pad 相对方块**下沉约 34mm** ——
    # pad1 底面比方块顶面低 34.4mm，pad2 底面扎进台面 3.1mm，
    # DESCEND 段下侧 pad 先撞方块侧面，跟踪误差单调涨到 0.498 rad。
    #
    # 声明 4 个 box 后由 IK 求这 4 点的中点，几何自洽、不引入魔数，
    # 换块高或换夹爪只改本字段。
    # 顺序有意义：先左后右、每侧先 pad1 后 pad2，开合轴雅可比取
    # "各侧两点的均值"再由左右相减（见 build_ur5_baseline.OrientedGraspSolver）。
    pad_boxes:
      - rq2f85_left_pad1
      - rq2f85_left_pad2
      - rq2f85_right_pad1
      - rq2f85_right_pad2
  bodies:
    wrist: wrist_3_link
    left_finger: rq2f85_left_pad
    right_finger: rq2f85_right_pad
    # 法兰 site：姿态求解用它定义"夹爪指向 = 法兰 → pad 中点"。
    # 由构型声明而不是写死，与其它名字字段同一口径。
    flange_site: attachment_site

# **重力前馈**（2026-09-29 补；与 Piper 侧同一机制、同一组起始值）：求每个臂关节"抵消重力所需的
# ctrl 增量"，并在**运行期同款模型**上做静态保持自证（残余 ≤ tolerance_rad，否则构建失败）。
# 这三个数是**起始声明值**，不是机型常数：UR5e 的执行器口径与 Piper 不同 ⇒ 构建期门禁会按本机型
# 逐相位验证（过不了就显式失败并给出数字 ⇒ 再按证据调，不静默兜底）。
gravity_feedforward:
  hold_ms: 4000
  tolerance_rad: 0.001
  max_passes: 4

workbench:
  top_z_m: 0.0
  half_size_m: 0.8
  half_thickness_m: 0.025
  friction: "1.0 0.02 0.001"

target:
  id: box_01
  # 实测 pad 全行程 84.7mm（ctrl=255 时内表面间隙 0.4mm）。
  # 50mm 方块在 ctrl=163（间隙≈50mm）附近被夹持，
  # 完全张开（ctrl=0，间隙 85mm）时两侧各留 17mm 进近余量。
  half_size_m: 0.025
  mass_kg: 0.04
  friction: "2.0 0.05 0.001"
  rgba: "0.82 0.22 0.12 1"

grasp:
  # 夹持区中点（**四个 pad box 的中点**，见 model.finger_geoms.pad_boxes）
  # 的目标抓取位置（世界坐标）。
  # UR5e 基座在原点、z 轴朝上、肩轴沿 y，工作空间主要在 **-x 方向**
  # （与 Piper 的 +x 相反，见 build/calibration/ur5-workspace.json）。
  # z 不在此声明，必须由 workbench.top_z_m + target.half_size_m 推出，
  # 保证方块贴台面。
  finger_center_xy_m: [-0.55, -0.134]
  # 预抓取后退距离。取 0.16m 而不是 Piper 的 0.20m：UR5e 在官方 home 种子位形下
  # 夹爪指向已经是竖直向下（法兰 z 轴 = [0,0,-1]，见 gripper.seed 注释），
  # 竖直进近天然成立；但位移太小时 DESCEND 段会在 pad 已环抱方块后仍做微调，
  # 被摩擦锁死。
  pregrasp_offset_m: 0.16
  # ⚠️ 这是**后退方向**（抓取点 → 预抓取点），此场景沿重力反方向朝上。
  # 它**不是**工具指向：工具指向 = 本字段的**反向**（法兰 → 夹持区中点），
  # 由 scripts/build_ur5_baseline.py 内部取反后交给求解器。
  # 历史事故：把本字段直接当工具指向，法兰 z 轴朝上、夹持区被抬到法兰上方
  # 134mm，抓取点落在台面以下（法兰 z=-0.109m）而不可达，
  # 实际执行时 wrist_2_link 碰撞体先压在方块顶面上，表现为 shoulder_lift
  # 跟踪误差 0.484 rad、末端距目标 0.314m。详见
  # docs/debug/2026-09-20-ur5-tool-axis-flip.md。
  approach_direction: [0.0, 0.0, 1.0]
  # 开合轴：左 pad → 右 pad 的期望世界方向，必须与 approach_direction 垂直。
  # 为什么必须显式声明：UR5e 是 6 自由度通用臂，同一个 pad 中点位置有无穷
  # 多组关节角。只约束位置时求解器会落到"夹爪横着伸出去"的解
  # （实测开合轴 [0.749,0.143,-0.647]、两 pad 高度差 60.5mm、
  #  夹爪指向与 -Z 夹角 71.3°），DESCEND 时下侧 pad 直接把方块顶飞。
  # 固定开合轴即可唯一确定绕接近轴的滚转，排除这类病态解。
  spread_axis: [1.0, 0.0, 0.0]
  # 姿态达标门禁：夹爪指向与开合轴相对期望值的最大允许偏差（度）。
  max_orientation_error_deg: 3.0
  # 与 approach_direction 分开声明是必须的：DESCEND 段必须是**纯竖直**下降，
  # 否则夹爪会横掠台面、从侧面撞飞方块。
  # 实测（probe_descent.py）：只声明 approach_direction 时，
  # APPROACH 与 DESCEND 的 pad 中点水平差虽只有 2mm，但整臂在段间摆动
  # （shoulder_lift -1.266 → -0.991 rad），pad 扫过方块把它顶到 z=0.108、
  # 水平漂移 45mm，对齐门禁随即报 0.097m 偏差。
  pregrasp_direction: [0.0, 0.0, 1.0]
  # HOME 抬升量：HOME 放在预抓取位正上方这么高处，使 HOME → APPROACH
  # 近似竖直下降，避免横扫台面撞飞目标（Piper 多目标场景同口径）。
  home_rise_m: 0.30
  # 指尖相对台面的最小间隙。**pad2 在每个 pad 局部 -z 侧**，是整个夹爪
  # 最低的碰撞体，因此配平必须按"4 个 pad box 的最低面"来算
  # （求解器用 _finger_tip_z 扫全部 pad_boxes，而不是只看 pad1）。
  # 3mm 的取值要求 pad 底面高于台面 3mm：夹持区中心离方块底面 25mm，
  # 而 pad2 底面相对夹持区中心低约 22mm，余量因此只有几毫米，
  # 该间隙不可随意调小。
  tip_clearance_m: 0.003
  clearance_iterations: 8
  # 抬升阶段相对抓取点沿接近方向抬起的位移
  lift_offset_m: 0.08
  solver:
    iterations: 1200
    step: 0.5
    tolerance_m: 1.0e-05
  # 未知姿态运行时：接近方向取自目标顶面法向；
  # 法向与竖直夹角超过该值时回退竖直抓取，避免侧面进近导致 pad 撞台面。
  max_tilt_deg: 30.0
  # 抬升段的**抓取锚点夹具**（require_friction_lift=false 时由场景注入 weld + mocap body）：
  # 名字由声明给出 ⇒ 联合世界里多台臂可**共用同一件场景级夹具**（2026-09-30 §11.30；
  # 硬编码 `<目标>_lift_anchor` 会与先注入的那台同名冲突）。缺省仍是旧名。
  lift_anchor_body: grasp_anchor
  # 抬升段锚点的**驱动口径**（2026-09-30 §11.54，第 9 处同族缺口）。
  # 旧口径（finger_mid_identity）只在抬升段末把锚点摆到「指腹中点 + 单位姿态 + 无偏移」，
  # 且激活焊缝时锚点停在**上一次写入者**的陈旧位姿上 ⇒ 实测把载荷硬拽出夹口：
  # s06 卸载步报 `lifted=true`（抬升 0.037928 m），而结束时刻载荷中心离指腹 **10.1 / 14.0 cm**、
  # 与任何几何体**零接触**（载荷挂在焊缝上，不在夹爪里）⇒ 下一步放置的前置判据正确地拒绝。
  # rigid_follow = 激活瞬间把锚点摆到**载荷实测位姿**，并按「指腹中点 + 激活瞬间偏移」逐拍跟随、
  # 姿态按「腕部 ⊗ 激活瞬间相对姿态」跟随（与放置段 §11.23(41) 同一实现口径，那组 A/B/D 对照
  # 已判死"只摆指腹中点"：首帧 48.30 → 115.59 N）。
  lift_anchor_mode: rigid_follow
  # 抬升**结束时**必须重新实测"载荷还在不在夹口里"（2026-09-30 §11.54）：
  # 判据里的 `bilateral_contact` 是抬升**之前**（合爪段）量的，不代表结束时刻 —— 正是这个盲区
  # 让"零接触却报 lifted=true"的那次运行通过。开启后结束时刻丢失双侧接触即**显式拒绝**。
  require_contact_at_lift_end: true
  # 下压段的**载荷保持**（2026-09-30 §11.59）：`pin_payload` = 接近/下压（及合爪窗口）期间把载荷复位到
  # 它自己的位姿。为什么本臂必须开（逐拍实测）：下压的**刚性指腹**一路把载荷顶走，位移是**离散跳变**
  # 且越往下越大 —— DESCEND 五个子段的「载荷位移之和 / 单拍最大跳变」实测
  # 0.6 mm / 0.04 mm → 2.4 / 1.61 → 5.9 / 5.23 → 19.4 / 8.12 → 20.6 / 10.08 mm
  # ⇒ 门禁残差的主项（"漂移率 × 窗口"里的率）其实是**指腹推载荷**，不是托盘蠕变（稳态仅 0.08~0.13 mm/s）。
  # 真机上这段位移由**台面摩擦**抵住，而本模型的台面摩擦（~0.4 N）小于下压侧向合力（§11.23(19)(20)）。
  # Piper 侧显式声明 none（无需该机制），本臂按实测打开。
  approach_hold: pin_payload
  # 搬运段抓取约束（I4-a 2026-09-30 §11.55）—— 结构**镜像 Piper 侧**（同一 equality、同一 anchor）：
  # 为什么必须有：抓取段抬升结束时焊缝是 active 的，而**步骤之间没人驱动锚点**（放置段此前没有
  # carry_constraint ⇒ 它既不重摆锚点也不驱动它）⇒ s07 一移动，焊缝就把载荷拴在冻结的锚点上、
  # 从夹口里拽出，放置段自己的搬运判据报「抬升段后失去夹持（载荷已脱离）」（实测 12.48 s 处失败）。
  # 声明后放置段按同一协议接管：激活时把锚点摆到「载荷实测位姿」并按「指腹中点 + 激活偏移」逐拍
  # 驱动，放下的那一步**先释放焊缝再张开夹爪**（`place_object` ③ 段）。
  # `release_gripper: false`：本臂不像 Piper 那样在搬运中张爪（2F-85 的指腹就是锚点参照物，
  # 张爪会让参照漂移）⇒ 判据保持"双侧指腹接触"；`max_slip_m` 只在 release_gripper=true 时被消费，
  # 因此**故意不声明**（声明了就必须被消费，见 AGENTS.md 6.2）。
  carry_constraint:
    enabled: true
    type: weld
    equality_name: box_01_lift_constraint
    anchor_body: grasp_anchor
    solref: [0.01, 1.0]
    solimp: [0.9, 0.95, 0.01]
    release_gripper: false
    max_plant_steps_per_iteration: 64
  # --- 放置段（I4-a，2026-09-30 §11.49）--- 结构**镜像 Piper 侧**（本臂自己的数值待按其实测分布重定）
  # 为什么先镜像：放置四段的几何/判据逻辑与机型无关（共享实现），差异应在声明里体现；
  # 先取 Piper 的结构与数值把链路打通，落地后**按 ur5e 自己的实测分布**重定（§11.44 的做法）。
  # 放置段几何（I4-a，§11.49）：先镜像 Piper 的值，落地后按本臂实测重定
  place_clearance_m: 0.05        # 接近/抬离段的净间隙
  # 航点横移发生在哪一段（2026-09-30 §11.58）：`target` = 航点直接到**接收体 xy**（横移在搬运
  # 高度完成、`above` 只做竖直下降）；缺省 `lift` = 停在抬升点 xy（旧行为，逐位不变）。
  # 为什么本臂必须 `target`（实测）：目标是台面落点垫（z≈0.005），比拾取点低 0.375 m；
  # 若横移与下降挤在同一段（`transit → above` 关节空间直线插值），方块会在仍处狗背托盘上方时
  # 就降到托盘顶面以下被挡住（载荷↔托盘接触力 37.4 → 223.6 N，而载荷仅 40 g）⇒ 载荷经焊缝把臂
  # 拽住，运行期 `after_above` 指腹中点落在 [0.7340, 0.4040, 0.2613]（构建期解是
  # [0.699996, 0.600002, 0.070632]）⇒ 臂根本没到 above ⇒ 判"失去夹持"。
  place_transit_xy: target
  place_touch_clearance_m: 0.0   # 下降终点让载荷最低点停在承载面上方多少（0 = 贴面；Piper 同值，
                                 # 依据：正值只会抬高松手高度 ⇒ 落距变大，见 §11.25(f-4)/(f-5)）
  carry_gripper: hold            # 搬运段夹爪语义：按实测 ctrl 保持（避免持续合拢把载荷挤出夹口）
  lift_gripper: closed           # 抬升段：下发该相位的闭合命令（2F-85 为 163 = 校准过的贴合力）
  place_settle_ms: 3000          # 放下后落稳窗口（Piper 同值；落地后按本臂实测重定）
  place_pose_correction:
    mode: touchdown
    max_lateral_m: 0.05
    touch_clearance_m: 0.0
    max_vertical_m: 0.05
    residual_tolerance_m: 0.001
    touchdown_step_fraction: 0.3
    touchdown_max_iterations: 10
    lateral_tolerance_m: 0.035
    ik_iterations: 800
    ik_step: 0.5
    max_residual_m: 0.0001
  # --- 抓取段的**运行期闭环纠偏**（2026-09-30 §11.29）---
  # 为什么需要：构建期的参考关节解按**标称目标**求；联合世界里目标会被搬动
  # （狗背托盘里的载荷：横向 ~5.3 mm + 竖向 ~9.74 mm）⇒ 臂"到位"了但夹口没对准载荷，
  # 运行期门禁实测 distance=0.015812 m > 判据 0.005 m。修法是**运行期按实测目标重解**，
  # 而不是放宽判据。声明只在本文件给出，实现层不写默认值；缺声明 = 不纠偏（行为不变）。
  grasp_pose_correction:
    mode: resolved
    # 偏差 ≤ 2 mm 视为已对准（比验收判据 5 mm 更严：给夹爪开合与接触扰动留余量）。
    residual_tolerance_m: 0.002
    # 上限 50 mm：实测的载荷漂移量级（s04 落点偏移 0.0158~0.0337 m）在它之内；
    # 超过它说明"不是小偏差，而是目标/参考解本身有问题" ⇒ 运行期**显式拒绝**（不静默截断）。
    # 【2026-09-30 §11.45：由**验收域**反推，不是放宽验收】s04 的验收判据允许载荷落点离托盘中心
    # 到 `max_offset_from_tray_center_m = 0.06` ⇒ 卸货侧的纠偏**预算必须覆盖整个验收域**：
    # 实测出现 live 离 nominal 0.050291836 m（轮 3 of 3）⇒ 原 0.05 恰好落在域内 ⇒ 每几轮就
    # 以"超出上限被拒"的方式假失败。取 0.07 = 验收域 0.06 + 余量。
    max_correction_m: 0.07
    ik_iterations: 400
    ik_step: 0.5
    ik_tolerance_m: 0.0005
    # 到位前的**闭环复量**次数上限（量→纠→复量）：单次解算只保证"指令位形"在容差内，
    # 实际停稳位形还差一个 PD 静差（实测 5.861 mm vs 容差 5 mm）⇒ 必须复量复纠。
    align_max_attempts: 3
    # 下压段**子段数**（2026-09-30 §11.56）：联合世界里臂是 guest，节拍被 owner（Go2 驻留线程）
    # 拖长 —— 实测"下压相位"推进 27.28 s 仿真时间（标称 8 s，`phase_ms=1600`），而载荷在托盘里
    # 以 ~0.085 mm/s 漂移 ⇒ 从"最后一次用实测目标重解"到门禁的 **33 s 曝光窗口**就是到位残差主项
    # （实测 2.94/3.33/3.34 mm = 0.085 mm/s × 33 s；纠偏自身残差只有 0.35 mm 级）。
    # 修法：下压拆 K 段，每段前用新鲜实测重解（IK 不推进植物，实测只花 0.01 s 仿真时间）。
    # K 的反推（不放宽 0.005 判据）：取历史残差上界 0.008228 m ≤ 内部容差 residual_tolerance_m(0.002)
    # ⇒ K ≥ 0.008228/0.002 = 4.11 ⇒ K=5（窗口 ≈ 27.2/5+0.9 = 6.3 s ⇒ 预期最坏 ≈ 1.6 mm）。
    descend_splits: 5
    # 纠偏后「腕 → 夹持区」轴相对名义轴的允许夹角（与基线 max_orientation_error_deg 同口径 3°）：
    # 防止位置对了但夹爪姿态被 IK 带歪（歪着夹会把载荷顶飞）。
    # 【2026-09-30 §11.46：按**实测分布**再定一档】纠正 ~0.05 m 量级偏差时的轴偏实测分布：
    # 3.266°（campaign-6 轮 1）、**5.338°**（campaign-8 轮 2）⇒ 5.0° 仍落在分布内（每几轮假失败）。
    # 取 8.0° = 观测上限(5.338°) × 1.5。守卫目的是抓"姿态被 IK 带歪"的粗错：
    # "歪着夹会顶飞"的量级是 30°+（历史 §11.23 的 50.59° 翻滚），8° 仍远远拦住。
    max_axis_deg: 8.0

gripper:
  # IK 种子位形（**只影响收敛到哪一支解，不影响最终精度**）。
  # 取官方 home：实测该位形下夹爪指向已经是 [0,0,-1]（与 -Z 夹角 0.00°）、
  # 开合轴已是 [1,0,0]（与 +X 夹角 0.00°），即**姿态初始就满足约束**，
  # 零空间修正只需负责保持它，收敛最稳（见 probe_seed_orientation.py）。
  # 对照：UR5e 全零位下夹爪指向与 -Z 夹角 90°、reach_forward_down 下开合轴
  # 在 y 方向（与期望的 x 差 90°），都会让三维姿态修正走出收敛域。
  seed:
    shoulder_pan_joint: -1.5708
    shoulder_lift_joint: -1.5708
    elbow_joint: 1.5708
    wrist_1_joint: -1.5708
    wrist_2_joint: -1.5708
    wrist_3_joint: 0.0
  # 2F-85 是**欠驱动腱驱动**夹爪：只有一个 tendon 执行器
  # `rq2f85_fingers_actuator`，ctrl 是 0..255 的归一化开合度。
  # 不要写成 joint7/joint8 那种"两个独立位置关节"，那会把
  # driver/coupler/spring_link/follower 之间的 4 杆关系冲掉。
  #
  # 这里写的是**执行器名**（后端 _set_controls 按 actuator 名索引 ctrl），
  # 而 profile 的 gripper.drive_joints 写的是**被驱动的关节名**。
  # 两个字段职责不同：本字段决定"给哪个 ctrl 通道写值"。
  joints: [rq2f85_fingers_actuator]
  # ctrl 量纲：0 = 完全张开（间隙 85.1mm），255 = 完全闭合（间隙 0.4mm）。
  open:
    rq2f85_fingers_actuator: 0.0
  # 闭合命令取 163：由实测 ctrl→gap 曲线反解，对应间隙约 50mm，
  # 即 pad 内表面刚贴住 50mm 方块两侧，产生稳定法向接触力而不挤出目标。
  # 命令到 255 会以最大行程挤压方块，实测会让目标被顶飞并触发 QACC 发散。
  closed:
    rq2f85_fingers_actuator: 163.0
  # 抬升阶段的臂位形**由求解器算出**（`grasp.lift_offset_m` 沿预抓取方向
  # 抬升后解 IK），不在这里写死。
  # 为什么必须交给求解器：写死一组关节角会与 `grasp_positions` 不一致。
  # UR5e 的腕部构型是被姿态约束唯一确定的（wrist_2 ≈ -4.712，
  # 即夹爪朝下的那一支），而手写值常见的是 wrist_2 = -1.5708 的
  # 另一支解；两者相差 180°，抬升段会把方块从指间拽出或直接撞飞。
  # 实测：手写 lift 与求解出的 grasp 相差 wrist_2 约 3.14 rad，
  # 后端执行到 LIFT 时会以极大力矩扭转腕部。

scene:
  # --- 本节原先声明的物理参数在 2026-09-20 的光源改动中被误删，已从 85d0073 恢复 ---
  # 误删的代价（实测）：pad_friction 丢失后夹爪接触力从 17.45/16.05N 掉到 8.84/8.86N，
  # 抬升位移从 0.041208 变为 0.050928；gravity/timestep_s 丢失会改变整体动力学。
  inject_arm_position_gains: false
  timestep_s: 0.002
  gravity: "0 0 -9.81"
  pad_friction: "2.0 0.05 0.001"
  camera:
    name: overhead_camera
    pos_m: [-1.3, -0.75, 0.85]
    fovy_deg: 60
    look_at_m: [-0.55, -0.134, 0.025]
  # 光源声明（纯视觉，不参与物理）。缺省不注入时 MuJoCo 只有默认头灯，
  # 离屏相机图接近全黑（实测均值 16~24/255、98% 像素≈近黑），人看/截图都不可读。
  # 用**方向光**：与机型工作空间位置无关，两台机型可复用同一组；key 带阴影。
  lights:
    - name: key
      directional: true
      # 主光**近垂直**：顶面受光充足、侧面掠射很暗。
      # 为什么关键：侧脸被照亮后也会落进颜色阈值，最大支撑平面从"顶面"变成"侧面"，
      # 位姿拟合随即被尺寸门禁拦下（实测 fitted=[0.0776, 0.0393] vs 期望 0.050）。
      # 顶视相机 + 近垂直光 = 顶面主导，既看得清又不破坏颜色分割。
      dir: [-0.16, 0.16, -1.0]
      diffuse: [0.85, 0.84, 0.82]
      specular: [0.25, 0.25, 0.25]
      # castshadow 默认关闭：主光阴影会把台面染成与目标相近的色调，掩码被放大。
      # 需要阴影时设为 true，但必须重跑视觉验收（检测器依赖渲染颜色）。
      castshadow: false
    - name: fill
      directional: true
      dir: [0.60, -0.25, -0.55]
      diffuse: [0.30, 0.30, 0.30]
      specular: [0.05, 0.05, 0.05]
    - name: rim
      directional: true
      dir: [0.25, 0.70, -0.40]
      diffuse: [0.22, 0.22, 0.24]
      specular: [0.0, 0.0, 0.0]

acceptance:
  pose_tolerance_m: 0.005
  min_lift_delta_m: 0.02
  min_normal_force_n: 0.2
  max_force_imbalance_ratio: 4.0
  # 求解残差必须显著小于门禁容差，避免用临界解伪造成功
  solver_error_factor: 0.1
  # true 时不使用抓取锚点焊接夹具，抬升位移必须完全由双指摩擦力承担
  # ⚠ 2026-09-30 §11.30 定案：本臂在**联合世界**里把这条改为 false —— 实测 true（纯摩擦）只能抬
  # 起 0.002016 m（要求 ≥0.02），而联合模型里已存在现成的场景级夹具（weld `box_01_lift_constraint`
  # + mocap body `grasp_anchor`；Piper 靠它抬 0.079958 m）⇒ 与 Piper 同口径，**不靠放宽判据**。
  require_friction_lift: false

# --- 统一入口声明（AGENTS.md 6.4 金路径）---
# scripts/build_baseline.py 与 scripts/verify_pick.py 按本段分派实现，
# 使用者只提供 TaskFlow/Skill 参数与 Robot Profile，不需要挑机型脚本。
build:
  # 提供 build(root, baseline_path, scene_path, calibration_path) 的构建器模块
  baseline_module: build_robot_baseline
  scene: build/models/ur5-pick-scene.xml
  pose_evidence: build/calibration/ur5-baseline-pose.json
  profile: profiles/ur5_mujoco.yaml
  safety_policy: profiles/safety/simulation_lab.yaml

# --- 视觉 Provider 声明（与 Piper 同结构；检测器用同一个通用脚本）---
# UR5e 的相机由场景生成器按 scene.camera 写入（overhead_camera，fixed 模式）。
vision:
  # 目标在 world 系下的位姿证据（由下面的检测器刷新）
  evidence_file: build/calibration/ur5-vision-target.json
  refresh: always
  detector:
    command:
      - "{python}"
      - scripts/detect_targets.py
      - --model
      - "{model}"
      - --config
      - "{config}"
      - --output
      - "{evidence}"
      - --extrinsics
      - "{calibration}"
    # 相机标定**按机型独立**：UR5e 的相机在 (-1.30,-0.75,0.85)、fovy 60°，
    # 与 Piper 完全不同；复用 Piper 的标定不会报错，只会让坐标悄悄偏掉。
    # 生成方式：scripts/verify_camera_calibration.py --scene ... --baseline 本文件
    calibration_file: build/calibration/ur5-camera-to-base.json

# --- 显示链路声明（scripts/view_mujoco.py --live 使用）---
# 只影响"看得见"的演示路径：skill / 安全策略 / 时序全部来自这里的声明，
# 代码里不写死任何机型或路径（AGENTS.md 5.3）。验收口径不受影响，
# 仍走 build.safety_policy（simulation_lab，max_duration_ms=30000）。
viewer:
  live_skill: display_pick
  live_safety_policy: profiles/safety/display_showcase.yaml
  live_realtime: true
