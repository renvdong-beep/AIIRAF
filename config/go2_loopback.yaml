schema_version: iraf.quadruped-loopback/v1
# Go2 MuJoCo loopback 验收（步骤 15）的**唯一数字来源**。
# 纪律（AGENTS.md 5.3 / 铁律 1.3）：实现层不得含任何数字默认值；
# 缺段或缺键即显式失败（退出码 2），不得"用模型/机型默认值兜底"。
simulation: true

robot:
  id: unitree_go2
  # 关节身份来自 Profile（单一事实来源），不是脚本里的关节名单。
  profile: profiles/unitree_go2_mujoco.yaml
  # S2 场景执行器（步骤 18）的后端绑定：只写 iraf_adapters.factory.KNOWN_BACKENDS 的登记键。
  # 为什么写在机型声明里：「这台本体用哪个适配器」是部署事实，属声明而不是脚本常量（铁律 5.3）；
  # 缺键即显式失败（执行器退出码 3），**禁止**在脚本里猜测/硬编码后端入口。
  backend: unitree_go2_mujoco

model:
  # 被测模型 = 场景构建产物（步骤 13）：保证"演示与验收走同一条链路"。
  # 未生成即显式失败（退出码 3），**不**静默回退到厂商原始模型。
  file: build/scenes/handoff_lab/handoff_lab.xml
  builder: scripts/build_scene.py

initial:
  # 初始状态取厂商模型自带关键帧（实测 build/iraf-24h/15/probe-api.txt：
  # nkey=1、name=home、qpos 基座 z=0.27 m、四腿 (hip, thigh, calf)=(0, 0.9, -1.8)）。
  keyframe: home

control:
  # 控制频率必须与模型 timestep 整除（实测 timestep=0.002 s ⇒ 100 Hz = 5 个物理步）；
  # 不整除即声明非法，不四舍五入。
  frequency_hz: 100
  # PD 增益（力矩型电机：τ = kp·Δq + kd·Δq̇ + τ_ff，再按模型 ctrlrange 截断）。
  # 取值依据 = 增益扫描（同一段实现层代码，证据 build/iraf-24h/15/pd-scan.json）：
  #   kp=30 /kd=1  → 高度 0.223974 m（下垂 46 mm）、姿态 4.98°、跟踪 0.354 rad，**不达标**；
  #   kp=80 /kd=2  → 0.272229 m / 0.31° / 0.092 rad，达标；
  #   kp=150/kd=4  → 0.280101 m / 0.058° / 0.045 rad，达标（本值，留 2.7 倍到失稳的余量）；
  #   kp=250/kd=6  → 0.283245 m / 0.035° / 0.027 rad，达标但更接近失稳；
  #   kp=400/kd=8 与 kp=250/kd=12 → 发散（控制量饱和 8431 / 8846 次，高度 −34.6 / −26.1 m）。
  # 因此本声明选 150/4：下垂未饱和、姿态与跟踪余量足够，且距失稳阈值有余量。
  # ⚠ 口径提醒（战役 iraf-24h-2 步骤 02 第六轮 A′ ⑤）：上表扫描值测于**对齐前**的场景
  # （关键帧 `home` 下四足足端球穿入台面 18.372 mm）；场景生成改为"按实测抬到贴台面"（提交 2043111）后，
  # kp=150/kd=4 的实测变为 0.279954 m / 0.112° / 0.046468 rad（证据 build/iraf-24h-2/02/loopback-after-align.txt）。
  # 两者同量级、档位结论不变（150/4 仍是达标档），但**旧值自提交 2043111 起被取代**，不得再当代事实引用。
  kp_nm_per_rad: 150.0
  kd_nm_s_per_rad: 4.0
  # 重力前馈：取当前位形下 qvel=0 的 qfrc_bias 作为 τ_ff。
  # 实测该站立位形的 12 条腿关节前馈仅 ~1 N·m 量级（probe-api.txt：受地面约束的支撑力矩
  # 不在自由浮动基的偏置里），因此它只用来消除稳态下垂，站立载荷由 PD 承担。
  gravity_feedforward: true
  # 力矩上限只从模型 ctrlrange 读（实测 hip/thigh ±23.7、calf ±45.43 N·m），
  # 本键只允许取值 model：任何"在配置里另写一套限幅"的写法都是第二份安全边界，必须显式失败。
  torque_limit_source: model

# 力矩级反馈平衡器（步骤 02b / ADR-0008 决策 1c + **1d（B1，2026-09-21 主窗口授权）**）：
# **支撑腿走力矩级力控**（位置级权重 0）、摆动腿仍走位置级 PD，两者在执行器级按**逐关节**权重混合，
# 由声明 `stance_weight_position` / `weight_position` 给出；支撑集按**实测接触力**判定（不做相位推断）。
# 缺任一键即显式失败（退出码 2），无默认值兜底。
# 为什么必须做（实测，勿重复量）：位置级（关节空间）足端目标偏移这一族执行器已被两轮独立实测证否 ——
# 步高压到 0.001 m（四足基本不离地、支撑相 1.0）后，幅度 0 的对照稳定
# （z_mean 0.279955 m、倾角 0.091°、漂移 0.00649 m、饱和 0），而幅度 **5 mm** 即翻倒
# （z_mean −2.989653 m、倾角 172.139°、饱和 2145）；且「常量重心平移」可行域为**空集**。
# 第一轮（纯"叠加纠正量"档）实测证明：力矩纠正量受摩擦预算双头夹（10 N 太弱、40 N 把腿顶飞），
# 因为位置级 PD 与力矩纠正**同时**作用于支撑腿 ⇒ B1 改为「支撑腿只受力矩级」。
# ⚠ 力矩上限**不在这里声明**：最终控制量仍按模型 ctrlrange 截断（control.torque_limit_source=model
# 是唯一来源），本段只声明反馈增益/权重/分配上限/判据。
balance:
  # ⚠ 当前取值 **false**（与 `gait.stabilization.enabled` 同一处理方式）：B1 的**实验组**由验收入口
  #   `scripts/verify_go2_balance.py` 按本声明生成证据区副本、只改本开关后开启（声明副本入库于
  #   build/iraf-24h-2/02b/），从而：① 生产路径（stand/stop/步态）与步骤 02 的实现**逐位一致**，
  #   既有 stand/stop 数字不被本步改动污染；② 同一份声明的启用/关闭两组可直接并列（对照实验）。
  #   取值口径由实测决定，见 docs/debug/2026-09-21-quadruped-gait-trot-to-wave.md §14。
  enabled: false
  # 位置级 PD 与力矩级平衡项的混合权重：τ = position_weight ⊙ τ_pd + w_bal·τ_bal（见下两键）。
  # `weight_position` 作用于**非支撑（摆动）关节**；`stance_weight_position` 作用于**支撑关节**。
  weight_position: 1.0
  # **B1 核心键**：支撑关节的位置级权重。取 0 ⇒ 支撑腿的 τ_pd（含 PD 与重力前馈）被整体乘 0，
  # 该腿只受力矩级力控驱动 ⇒ 位置目标不再被 PD"顶回"（这正是 5 mm 即翻的直接原因）。
  # 允许取值 [0,1]；实现层强制 `stance_weight_position` 与 `weight_balance` 不得同时为 0
  # （那样支撑腿控制量恒为零 ⇒ 整机直接塌陷）。
  stance_weight_position: 0.0
  weight_balance: 1.0
  # 是否把 mg 作为法向支撑前馈。**B1 必须为 true**：支撑腿关掉位置级分量后不再有 PD 平衡点，
  # mg 支撑只能由力矩级提供（F_z = mg + 高度纠正，再经足端力分配摊到各支撑腿）。
  # 旧结构（位置级承重 + 力矩级纠正）取 false：站立载荷已由 PD 承担（实测四腿合计 152.617937 N
  # ≈ mg=153.0 N），再叠加一份 mg 会让升力翻倍。
  include_gravity_support: true
  # 支撑集判定口径（决策 1e ⇒ 1f ⇒ **1g**）：本段是「**控制模式** → 判定口径」的**映射**。
  # 控制模式由**运行期事实**决定（实现层只判定「本次运行是否存在声明相位」，不写死任何路径名）：
  #   · `gait_clock_active`：步态时钟激活（存在声明相位，步态路径）⇒ 生产声明 = `declared_and_contact`
  #     （声明相位 ∧ 实测接触）。理由：自锁的机制是「该抬未抬的腿在 contact_only 下仍被计入支撑、
  #     分摊 ~mg/4 ⇒ 被压在地面上，而支撑腿位置权重为 0 ⇒ 轨迹抬不动它」；解除自锁的唯一手段就是把
  #     声明摆动窗口内的腿排除出支撑集。实测复评（wave/trot）见 docs/debug §18 与 §22。
  #   · `gait_clock_inactive`：无声明相位（静态保持/纯位置路径）⇒ 生产声明 = `contact_only`
  #     （只用实测接触力，物理接触即支撑）。**这是 1g 修掉的回归**：1f 让 `declared_and_contact`
  #     全局生效后，静态保持路径（没有摆动窗口）仍按步态时钟做相位分类 ⇒ 一条腿被排除出支撑集
  #     但物理上仍在地面上 ⇒ 三足力控 + 一足位置伺服同时作用 ⇒ 翻倒（实测 116.0440876799953°、
  #     漂移 1.1044264000056412 m、看门狗触发；对照组 enabled=false 逐位不变）。
  # 该模式下没有摆动腿 ⇒ 声明支撑集 = **全部腿**；1f 的兜底仍然生效（任何腿离地/异常接触持续超过
  # `stance_integrity` 的上限即显式报错），组合游程门禁（1g）亦生效。
  # 键缺失 / 取值非法 / 出现未定义的控制模式键 ⇒ 装配期显式失败（禁止默认值兜底）。
  # ⚠ 本键只改变「支撑腿怎么算」；`balance.enabled: false` 时平衡器通路根本不安装 ⇒ 步态/stand/stop
  #   的**生产轨迹逐位不变**（第十七轮已用 config.sha256 单独佐证过同一事实）。
  stance_classification:
    gait_clock_active: declared_and_contact
    gait_clock_inactive: contact_only
  # 姿态 PD（滚转/俯仰，不含偏航）与力矩上限。
  # B1 下本档**必须按倒立摆权限重新定档**（实测，勿回退）：支撑腿失去位置伺服后，整机的姿态
  # 稳定性只剩本段（不再有"腿的 PD 平衡点"兜底）⇒ 失稳项 m·g·h = 15.596408×9.81×0.28 ≈ 42.8 N·m/rad。
  #   · 回正增益必须大于失稳项：kp=60（旧档）虽然勉强 > 42.8，但 5 N·m 上限在 4.8° 就截断 ⇒
  #     一旦倾角超过 ~4.8° 就没有回正权限（实测 b1-base：40 N×0.2 s 冲量后 179.99° 翻倒、漂移 0.524 m、
  #     看门狗触发；隔离探针 build/iraf-24h-2/02b/probe-static-variants.txt）。
  #   · 本档 kp=150 N·m/rad、上限 15 N·m：上限对应 kp·θ ⇒ 5.7°，力矩-倾角曲线在全判据区间
  #     （≤15°）都大于失稳项（150×0.262 = 39 N·m ≫ 11.1 N·m），实测 tilt 1.227°、看门狗未触发。
  #   · 上限为何不是越大越好：足端力分配靠"两侧腿垂直力差"兑现 τ_x ≈ 0.284·Δ（旧档推导保留），
  #     超预算的请求会被逐腿法向力上限截断，反而不兑现。
  attitude:
    kp_nm_per_rad: 150.0
    kd_nm_s_per_rad: 6.0
    max_torque_nm: 15.0
  # 高度保持 PD：F_z = include_gravity_support·mg + 本项（按 max_force_n 截断）。
  # 取 600 N/m ⇒ 10 mm 高度误差请求 6 N；B1 下这是唯一的**竖直位置**伺服（支撑腿无长度环）。
  height:
    kp_n_per_m: 600.0
    kd_n_s_per_m: 60.0
    max_force_n: 40.0
  # 机身速度阻尼（**不含位置项**：逐相位重心转移是有意的机身位移，位置项会与它对抗）。
  # B1 下水平方向**只有**本项（支撑腿不再有位置伺服）⇒ 增益必须按"冲量/漂移预算"定档：
  #   声明冲量 = 40 N × 0.2 s = 8 N·s；纯速度阻尼的漂移上界 ≈ 冲量/增益。
  #   旧档 20 Ns/m ⇒ 0.4 m，**必然**超静态判据的 max_drift_m=0.15 m（与实现无关，是算术）。
  #   本档 80 Ns/m ⇒ 上界 0.1 m ≤ 0.15 m；实测漂移 0.088075 m（隔离探针 b1-authority）。
  # ⚠ 历史坑（勿重复）：首跑档（linear_gain 80 / max_force 60、attitude max 20 N·m）在**旧结构**
  #   （位置级承重 + 力矩级纠正）下实测过度 —— 40 N 水平冲量下四足失去接触 254 个周期并翻倒（167.83°），
  #   成因是**法向力差**超出接触预算。本档把法向/水平预算分开定（水平总 30 N = 7.5 N/腿，
  #   单腿法向 ≈ mg/4 ≈ 38 N、μ 取保守 0.6 ⇒ 摩擦裕度 23 N/腿），并已在 B1 结构下实测通过。
  velocity:
    linear_gain_ns_per_m: 80.0
    max_force_n: 30.0
    angular_gain_nms_per_rad: 4.0
    max_torque_nm: 4.0
  # 足端力分配：支撑腿数下限（四足 ⇒ ≥3 才有唯一最小范数解）、逐腿法向力上下限、水平力上限。
  # ⚠ 上限口径随 `include_gravity_support` 变：B1 下法向力**含 mg 支撑**（不再是纯纠正量），
  #   取值依据 = mg=153.0 N ÷ 3 腿支撑 = 51 N，加姿态纠正所需 ±Δ（5 N·m ÷ 0.284 m 力臂 ≈ 18 N）
  #   ⇒ 120 N ≈ 2.3×mg/3，留足余量以免把支撑力截断（截断 ⇒ 力旋量残差非零 ⇒ 机身下沉）。
  #   旧档 30 N 是"纯纠正量"口径（mg 由位置级 PD 承担），B1 下会把支撑力削掉。
  allocation:
    min_stance_legs: 3
    max_normal_force_n: 120.0
    # 法向力下界：B1 下取 **0**（地面无粘附 ⇒ 法向力不可为负；含 mg 支撑时解出的法向力恒为正，
    # 该下界不构成约束）。旧档 −30 是"纯纠正量"口径（纠正量可为负），在 B1 下会把支撑力向下削。
    # ⚠ 历史坑（勿重复）：在"位置级承重 + 力矩级纠正"结构下取 0 会让负向纠正被整段截掉，
    #   表现为「力矩残差 == 目标力矩」（姿态力矩完全没兑现，静态抗倾覆反而更差 4.07° vs 1.70°）。
    normal_force_floor_n: 0.0
    # 水平力上限：摩擦预算 μ·N（单腿法向 ~38 N，μ 取保守 0.26 ⇒ 10 N）；首档 40 N/腿实测把四足顶离地面。
    max_horizontal_force_n: 10.0
  # 看门狗：连续「无有效支撑腿」的周期数上限；超过即停止施加平衡力矩并记 watchdog_triggered
  # （不得在站不住的状态下继续施加力矩级动作）。
  watchdog:
    max_consecutive_no_stance_cycles: 10
  # 支撑集完整性兜底（决策 1f 的 fail-closed 部分，2026-09-21 19:05 授权落地）。
  # 口径 `declared_and_contact` 下会出现两类「声明与实测不一致」，都**不得静默**：
  #   ① 摆动窗口内仍接触（自锁的观测对象）⇒ 记录 + 连续超过 `max_swing_abnormal_contact_cycles`
  #      即 `stance_integrity_error` 显式报错；
  #   ② 声明支撑窗内实测不接触（悬空/打滑）⇒ 记录 + 连续超过 `max_declared_stance_gap_cycles`
  #      即显式报错（**不得当作摆动腿**：它既不是支撑腿也不是摆动腿，是故障态）。
  # 阈值必须 >1 个周期：实测启动瞬态周期 1~2 四腿接触力全 < 2 N、周期 3 才四腿接触，
  # 取 1 会让「启动瞬态必然报错」变成恒真门禁（实现层也强制 minimum=2）。
  # `swing_contact_force_n` 与 `gait.verification.contact_force_threshold_n` 是两个口径：
  # 后者判「算不算接触」，前者判「摆动腿上的接触是否已经异常（被压住）」。
  stance_integrity:
    swing_contact_force_n: 5.0
    max_swing_abnormal_contact_cycles: 5
    max_declared_stance_gap_cycles: 5
    # 决策 1g 新增的**组合**游程门禁：逐周期「至少一条腿声明与实测不符」（两类中任意一类）的
    # 连续周期数上限。单类游程会被两类交替重置（gap → swing → gap …），组合游程不会 ⇒ 它拦的是
    # 「持续处于不一致状态」这种单类门禁看不见的形态。
    # 取值依据（两条不等式，缺一即不可满足或遮蔽诊断）：
    #   ① 下界 = `max(两个单类上限)` = 5（**实现层强制** `>=`）：低于它时会先于单类门禁触发，
    #      把「是悬空/打滑还是自锁」的诊断挤掉（零余量/遮蔽）；本处取 12，比下界高 7 个周期，
    #      使「两类交替（gap → swing → gap …）但持续不一致」这种单类门禁看不见的形态有真实余量；
    #   ② 上界：必须 < 一个摆动窗口的周期数（(1 − duty)=0.25 × period 0.8 s ÷ dt 0.01 s = 20 个周期），
    #      否则「整段摆动窗口都不一致」也判不出来 ⇒ 门禁恒不触发。
    # 12 ∈ [5, 20) ⇒ 可满足且仍有区分力。改 duty/period/dt 时必须重算本条（声明自洽）。
    max_inconsistent_run_cycles: 12
  # 验收判据（数字全在这里，脚本与实现层不写第二份）。
  verification:
    report: build/acceptance/go2-balance/report.json
    # 静态抗扰：站立位形下在躯干上施加声明的水平力，力撤除后必须回到阈值内。
    # 后续 3.8 s 为恢复窗口（判据取恢复窗口内的最坏值，不是取末值——末值会被"倒下后躺平"骗过）。
    static_disturbance:
      force_n: 40.0
      axes: [x, y]
      duration_s: 0.2
      hold_s: 3.8
      max_tilt_deg: 15.0
      max_height_error_m: 0.05
      max_drift_m: 0.15
      max_saturated_samples: 0
    # 隔离实验（第 5 轮同一实验的复跑）：步高压到 0.001 m 关掉抬腿/落地动力学，幅度扫描；
    # 判据 = no_fall_amplitude_m（0.005 m）档不再翻倒 —— 对照：修前该档 z_mean −2.989653 m。
    isolation:
      step_height_m: 0.001
      amplitudes_m: [0.0, 0.005, 0.01, 0.02]
      duration_s: 4.0
      no_fall_amplitude_m: 0.005
      fall_base_height_m: 0.15
      max_tilt_deg: 15.0

stand:
  # 站立参考位形来自 Profile 的 spec.home（避免数字出现两份）。
  pose_source: profile_home
  # 目标位形从初始位形线性过渡的时长（初始关键帧位形与目标一致时为 0 过渡）。
  ramp_s: 0.5
  duration_s: 8.0
  # 必须达到的"连续达标保持时长"；duration_s ≥ ramp_s + hold_s 由声明门禁强制（自相矛盾即失败）。
  hold_s: 6.0
  # 躯干高度目标 = 厂商关键帧基座 z（0.27 m，台面 z=0 由场景 workbench.top_z_m 声明）。
  height_target_m: 0.27
  # 高度容差：目标取厂商关键帧基座 z（0.27 m），实测在选定增益（kp=150/kd=4）下稳定高度
  # 0.279954 m（接触地面后腿略伸），偏差 9.95 mm 落在本容差内；下调 kp 则下垂变大
  # （kp=30 时 0.223974 m，偏差 46 mm，**不达标**）。容差不是为了"凑通过"：
  # 首跑（kp=30）就是失败，修的是增益声明而不是判据（证据 build/iraf-24h/15/pd-scan.json）。
  height_tolerance_m: 0.02
  # 稳定段高度标准差上限：用于把"上下振荡"和"稳稳站住"分开。
  height_std_max_m: 0.01
  # 躯干姿态偏差上限（相对竖直，四元数夹角）。
  attitude_tolerance_deg: 5.0
  # 躯干线速度容差（站立窗口内任意采样不得超过）。
  speed_tolerance_mps: 0.05
  # 关节跟踪误差上限：站立窗口内 max|q − q_des|。选定增益下实测 0.046468 rad（对齐后重测；
  # 对齐前 0.044739 rad，自提交 2043111 起被取代），
  # 本值留 ~1.5 倍余量（kp=30 时实测 0.354 rad，会被这条门禁拦下）。
  max_tracking_error_rad: 0.07

stop:
  # 力矩型执行器松力即失能：stop = 控制量归零（**站立态**停机语义；别的取值必须显式失败）。
  # 与移动语义的关系（步骤 01，战役 iraf-24h-2）：移动中的 stop 由
  # `iraf_skills.quadruped.resolve_stop_mode` 解析为 `damped_hold`（受控停止），
  # 本键只在**未移动**时生效，且是既有验收事实（步骤 15/17 报告）——站立停机语义未改变。
  # 逐位一致门禁的**当前基准**（战役 iraf-24h-2 步骤 02 第六轮 A′ ⑤ 对齐后重测，证据
  # build/iraf-24h-2/02/loopback-after-align.txt）：height_mean_m=0.279953602548388、
  # 末速 0.0038248382123762478 m/s。战役 1 的旧值（0.2801007638069918 / 0.003964950131491022）
  # 测于"关键帧四足穿台 18.372 mm"的旧场景，自提交 2043111（场景生成改为按实测抬升贴台面）起
  # **被取代**，不得再作为当前基准引用。若要改为 damped_hold，须另立步骤并重跑 loopback 验收。
  mode: torque_zero_release
  duration_s: 3.0
  # 速度衰减判定：松力后必须出现"连续 static_hold_s 秒速度低于 speed_tolerance_mps"的静止段。
  speed_tolerance_mps: 0.05
  static_hold_s: 0.5
  # 末段速度的统计窗口（末段速度 = 最后 final_window_s 秒的均值）。
  final_window_s: 0.2

# 移动语义的**控制实现参数**（步骤 01）：只写实现参数与"来源路径"，
# **不写**任何速度/加速度/位移/倾角阈值 —— 阈值只在安全策略
# `profiles/safety/quadruped_lab.yaml` 的 `spec.quadruped_limits` 声明一次（避免同一事实两处）。
# 消费点：`iraf_skills.quadruped.load_locomotion_declaration`（解析来源 + 跨文件自洽门禁）；
# 缺任一键、来源路径解析不到、或自洽不成立都显式失败（退出码 2 风格，不做默认值兜底）。
locomotion:
  # 速度指令斜坡时长（s）：v=0 → 安全策略 max_speed_mps 所用的控制预算。
  # 与 max_accel_mps2 互锁：自洽门禁要求 ramp_s × max_accel_mps2 ≥ max_speed_mps
  # （0.5 × 1.0 = 0.5 = max_speed_mps，恰好成立 ⇒ 从静止到最高速用时 1 s）。
  ramp_s: 1.0
  # 控制环频率：与 control.frequency_hz 是**同一事实** ⇒ 只声明来源路径，不写第二个数字
  # （写第二份数字就会出现"两处不一致时听谁的"的问题）。
  control_frequency_source: control.frequency_hz
  # 控制心跳周期（ms）：每个控制周期一次心跳（100 Hz ⇒ 10 ms）。
  # 看门狗超时上限只在安全策略声明（quadruped_limits.watchdog_timeout_ms=100 ms）；
  # 自洽门禁要求 heartbeat_period_ms ≤ watchdog_timeout_ms。
  heartbeat_period_ms: 10.0
  # 看门狗触发时的停止语义：**只允许** damped_hold（受控停止）。
  # 失能停机只用于急停/安全事件；声明成 torque_zero_release 会被显式拒绝。
  watchdog_action: damped_hold
  # damped_hold 的参数来源（禁止第二份数字）：减速走同一段斜坡，保持位形复用 stand 的参考位形来源。
  damped_hold:
    deceleration_source: locomotion.ramp_s
    hold_pose_source: stand.pose_source

# 步态参数（步骤 02）：参数化对角小跑。**只写生成器参数与验收判据**；
# 速度/加速度/位移/倾角的安全上限仍只在安全策略声明一次（本段与 locomotion 段都不重复）。
# 缺任一键、取值越界、相位不自洽（对角配对不成立）都显式失败（退出码 2），无默认值兜底。
# 几何（大腿/小腿长 0.213 m、中立足端 z=-0.26480585 m）**不在这里声明**：
# 它们由实现层 `iraf_adapters.unitree.gait.measure_leg_geometry` 从被测模型实测，
# 避免同一事实两处（实测证据 build/iraf-24h-2/02/probe-legs.txt）。
gait:
  # 步态类型：wave = 准静态四相位步态（一次只抬一条腿 ⇒ 任意时刻 ≥3 条腿支撑 ⇒ **静态稳定**，
  # 不需要机身平衡器）。依据：ADR-0008 决策 1（2026-09-21 修订为 wave，trot 列为二期性能优化）。
  # 为什么不用 trot：动态小跑的 19 条判据 11 条失败（height_mean_m −38.66691503360235、
  # max_tilt_deg 149.00568880619002、max_displacement_m 3.5763946259283177 等），
  # 且 26 组参数扫描（步频×步高×kd）+ 阻尼/截断对照**每一组都倒下** ⇒ 调参不是出路。
  # 证据：build/iraf-24h-2/02/scan*.json、build/iraf-24h-2/02/acceptance-final.txt。
  kind: wave
  # 步频（一个完整步态周期的 Hz）：1.25 Hz ⇒ 周期 0.8 s、每条腿的摆动窗口 0.2 s。
  # 取值依据：10 s 验收时长内 12.5 个周期（扣掉 1 s 幅度斜坡后约 11 个稳态周期，
  # 满足 min_clear_swing_cycles_per_leg = 8）；再快会缩短摆动窗口（落地冲击变大），
  # 再慢会减少可用于「明确离地」统计的稳态周期数。
  # ⚠ 第二十一轮实测（授权 1h 的「步频单变量」复评，证据 build/iraf-24h-2/02b/r21-frequency-table.md）：
  #   0.8 / 0.9 / 1.0 Hz 三档 × 两条路径（位置级 wave、wave+B1+declared_and_contact）共 6 次运行，
  #   失败集合**全部仍为翻倒类**（height_mean_m −47.6 ~ −54.6 m、max_tilt_deg 121.9~178.7°、
  #   min_base_height_m ≈ −200 m），判据数与阈值一字未改；降频只把 B1 组的看门狗推迟
  #   （触发周期 14 → 61）、翻倒推迟（242 → 351），**不改变失败类别** ⇒ 本键单独不足以让 wave 站住。
  #   声明保持 1.25 Hz（实测最优：翻倒前力控参与率与既有基线可比；降频并未带来类别改善）。
  frequency_hz: 1.25
  # 摆动相抬脚高度：0.08 m。
  # 取值依据（**实测**，不是拍脑袋）：中立位形（关键帧 home）下四个足端球最低点在台面下
  # 0.0183725 m（证据 build/iraf-24h-2/02/probe-neutral-clearance.txt）；又因腿的 PD 柔度，
  # 需要「命令抬起约 0.017 m」才真正把接触力卸到阈值以下（trot 扫描实测：抬脚 ≤0.01 m 从未离地、
  # ≥0.02 m 才离地）。因此步高必须明显大于该卸载阈值，摆动窗口才有一段是**真的**离地。
  step_height_m: 0.08
  # 中立（支撑/摆动）足端目标的**离地间隙**（m，> 0）：实测中立足端 z（躯干系）再抬高本值。
  # 为什么需要这个键（步骤 02 A′ ②，2026-09-21）：关键帧 `home` 下四足足端球最低点在台面下
  # **18.372 mm**（证据 build/iraf-24h-2/02/probe-neutral-clearance.txt）；A′ ① 已把初始位姿抬到
  # 足端贴台面（场景报告 `initial_alignment.lift_m = 0.01837250030255797`，独立对照 contact dist=0）。
  # ⚠ **实测边界（本步证明，勿重复扫参）**：在自由浮动基座 + 关节空间刚性足端目标的组合下，
  #   该键**只能平移机身高度，不能改变接触穿透**。实测（4 s、步高 0.001 m、sway=0，生产路径）：
  #     c=0.0001 ⇒ z_mean 0.279705148、四腿力合计 152.617937 N、瞬时峰值 53.4 N、饱和 0；
  #     c=0.0084 ⇒ z_mean 0.270497433、合计 152.619127 N、瞬时峰值 **365.2 N**、饱和 **36**；
  #     c=0.00997⇒ z_mean 0.268570621、合计 152.618637 N、瞬时峰值 **419.3 N**、饱和 **93**。
  #   接触力合计 5 位有效数字不变（mg = 153.0 N）⇒ 站立载荷与"预压"无关，δ 由接触刚度决定；
  #   增大 c 等于把机身放低，落地/接触瞬态被放大（ADR 引用的"409 N"正是这一类瞬态，不是静态预压）。
  #   推导：命令位形恒在支撑面下 δ（=mg/4 对应的接触挠度），与 c 无关 ⇒ "使中立目标不穿透"
  #   **不可由本机制达成**，要改 δ 只能改接触刚度或走力矩级反馈（B 路线）。
  # 取值来源 = 上表实测的**最小有害档**：取最小正间隙以免放大瞬时峰值与饱和。
  # 证据：build/iraf-24h-2/02/probe-contact-forces.txt（改前/改后两组）与 probe-contact-forces.json。
  stance_clearance_m: 0.0001
  # 支撑相占周期比例：准静态 wave 的 0.75。
  # 取值依据 = 静态稳定条件「任意时刻至少 n−1 条腿支撑」⇒ duty ≥ (n−1)/n = 0.75（四足）。
  # 该下限由 `gait.load_gait_declaration` 按 kind 分派后强制（更小的占空比会让两条腿同时摆动）。
  # ⚠ 实测（第二十一轮，2026-09-21，证据 build/iraf-24h-2/02b/r21-duty-bounds.txt）：本键的
  #   **可行取值集合只有 0.75 一个点** —— 下界来自上面的门禁，上界来自 `verification.min_swing_fraction`
  #   的判据算术（逐周期支撑相 ≤ 1 − 0.25 = 0.75，见该键注释）⇒ 宽度 0，零余量。
  #   因此授权 1h 写的「`duty_factor 0.75 → 0.6`（必要时 0.65）」是**降低**方向，被门禁原样拒绝
  #   （原文：`gait.duty_factor 必须落在 [0.750000, 1.0)，实际: 0.6`）；而同一句话里的
  #   「提高占空比」方向虽被门禁接受（0.85 通过），却在**理想轨迹**下也必然打掉 4 条
  #   `leg_*_clear_swing_cycles`（同证据 r21-duty-ideal.txt）⇒ 两个方向都不能由声明层或实现层
  #   自行落地，方向必须由人工定（改门禁 / 改 `min_swing_fraction` / 保持 0.75 三选一）。
  duty_factor: 0.75
  # 摆动相抬脚轨迹形状：半个正弦 h·sin(πv)（离地/落地时刻高度为 0，无阶跃）。
  # 在同样步高下它在摆动窗口起点/终点的斜率最大 ⇒「真正离地」的窗口最宽，正是 wave 需要的方向。
  swing_profile: sine
  # 幅度斜坡：0 → 满幅用时（s），避免起步的阶跃输入把机身弹起来。
  ramp_s: 1.0
  # 机身阻尼（**当前关闭**：实测本形式的阻尼偏移是净失稳项，见下）。
  # 设计动机：对角两条腿支撑时，「足端目标相对机身」等价于「足端跟着机身走」⇒ 机身水平速度被放大。
  # 阻尼形式：足端目标偏移 = k·(v_body + ω_body × r_foot)（机身系），推导见 gait.stabilization_offset。
  # 实测结论（10 s 验收时长、同一段实现层代码、只改本段声明；证据 build/iraf-24h-2/02/scan7-run1.txt）：
  #   enabled=true  k=0.12 clamp=0.04 ⇒ height_mean −74.65627960456835 m、ctrl_saturated 8278、tracking 0.4916
  #   enabled=false               ⇒ height_mean −38.66691503360235 m、ctrl_saturated 7306、tracking 0.3102
  #   enabled=true  k=0.12 clamp=0.20 ⇒ height_mean −79.019873 m、ctrl_saturated 8314、tracking 1.5155
  # ⇒ 开阻尼在**每一项**指标上都更差，且放宽截断上限更差（排除了「偏移被截断导致阻尼不足」的假设）。
  # 因此本声明取实测最优的一档（关闭）；**不是**放宽判据：19 项判据与阈值一字未改，验收仍为不通过。
  # 改走 wave 后的判断（**未重新做扫描**，如实登记）：准静态 wave 任意时刻 ≥3 条腿支撑，
  # 不存在 trot 那种「只剩两条腿 ⇒ 足端跟着机身走」的正反馈前提，因此保持关闭、不引入平衡器；
  # 若将来 trot 二期重新启用，必须先补该形式的扫描证据再改 enabled。
  # 缺任一键即失败（键位保留：schema 要求本段三键齐备；关闭只改 enabled，不删键）。
  stabilization:
    enabled: false
    # 阻尼时间常数（s）：本形式未取得稳定效果前的保留值，重新启用时必须先补扫描证据。
    linear_damping_s: 0.12
    # 偏移上限（m）：超出即截断（不与 Profile 限位冲突；实测最大偏移见调试记录）。
    max_linear_offset_m: 0.04
    # ---- 低频位置项三键（2026-09-23 新增，缺任一即显式失败；契约见
    #      docs/debug/2026-09-23-go2-gait-drift.md §9）----
    # 为什么要位置项：速度项 `k·(v+ω×r)` 在 v→0 时修正量→0，实测声明内 19 档调参最好
    # max_displacement_m = 0.5959 m（判据 0.05 m）⇒ 低速残余漂移只能靠"对位移本身"的反馈压住。
    # position_gain_s_per_m：位移 → 足端偏移增益；**0.0 = 该项关闭**（生产档先关，避免与既有
    #   stand/stop/loopback 基线互相污染；启用走专用验收 + 重新取证）。
    position_gain_s_per_m: 0.0
    # position_window_s：滑动平均窗口（s），必须**严格大于一个步态周期**（本档 0.8 s ⇒ 4.0 s ≈ 5 个周期），
    #   否则滑动平均会把逐相位重心转移当成漂移去对抗（契约 §9 的反例）。
    position_window_s: 4.0
    # position_limit_m：位置项偏移上限（m），与速度项的 max_linear_offset_m 分开，便于分别取证。
    position_limit_m: 0.06
  # 腿部身份与相位偏移（矩阵式外置，禁止在实现层写 leg 名与关节名的对应关系）。
  # 偏移分配 = **环形抬腿顺序** RL → RR → FR → FL（每 1/4 周期抬下一条，相位偏移升序 =
  # 抬腿顺序的逆序）。为什么必须是环形顺序（2026-09-21 决策 A 的实现约束，实测推导）：
  # 抬每条腿时重心要移向「剩余三腿支撑三角形的内法线」方向，而该方向对四条腿分别是
  #   RL (+x,−y)、RR (+x,+y)、FR (−x,+y)、FL (−x,−y)
  # ⇒ 只有按环序抬腿时该矢量才**每次转 90°**（平滑旋转，重心沿闭合曲线走）；
  #   旧分配（FL/RR/FR/RL = 0/0.25/0.5/0.75，抬腿顺序 RL→FR→RR→FL）会让 x 分量每窗口翻转
  #   （+x/−x/+x/−x），重心在两个相位之间来回跳，属**声明层面的抖动**。
  legs:
    FL: {hip_joint: FL_hip_joint, thigh_joint: FL_thigh_joint, calf_joint: FL_calf_joint, contact_geom: FL, phase_offset: 0.0}
    FR: {hip_joint: FR_hip_joint, thigh_joint: FR_thigh_joint, calf_joint: FR_calf_joint, contact_geom: FR, phase_offset: 0.25}
    RR: {hip_joint: RR_hip_joint, thigh_joint: RR_thigh_joint, calf_joint: RR_calf_joint, contact_geom: RR, phase_offset: 0.5}
    RL: {hip_joint: RL_hip_joint, thigh_joint: RL_thigh_joint, calf_joint: RL_calf_joint, contact_geom: RL, phase_offset: 0.75}
  # 逐相位重心转移（wave 的静态稳定必要项，2026-09-21 决策 A）。缺本段 ⇒ 声明非法（退出码 2）。
  # 为什么必需（实测，不重复量）：中立站姿四足接触点构成 0.3868 × 0.2840 m 矩形，整机
  # （15.596408 kg）重心投影距「抬单腿后支撑三角形」最紧边的有符号余量仅 ±0.000227483 m
  # （抬 RL/RR 为负）；矩形对角线恒过中心 ⇒ 与站位宽度无关。且「常量重心平移」可行域为空集
  # （对角腿对所需平移夹角 180.00°、两相位余量之和上确界 +0.000000000 m，穷举 10201 点最优
  # 余量 −0.000227483 m）⇒ 只能**逐相位**把重心移进当前支撑三角形。
  # 证据：build/iraf-24h-2/02/{support-margin-round3.json,probe-constant-shift.txt}。
  sway:
    # 机身（重心）逐相位的位移目标幅度（m，躯干系水平面）。
    # 取值依据 = 探针实测「目标余量 0.010 m」所需的平移量（FL 0.009796 m、RL 0.010228 m 量级）
    # ÷ 关节空间偏移的兑现率：命令平移 (0.010,0.010) 时机身实测只位移 (0.00561,0.00370)
    # （兑现 56%/37%，证据 build/iraf-24h-2/02/trial-static-three-leg.json）⇒ 需按兑现率放大；
    # 档位由本步扫描实测选定（build/iraf-24h-2/02/scan-sway-run*.txt）：0.02/0.03/0.05 档
    # height_mean_m 在 −3.0 ~ −7.8 之间（均翻倒），0.06 档最好（height_mean_m +0.226235、
    # min_base_height_m 0.1351、max_displacement_m 0.90133）⇒ 本档为实测最优，**不是**判据放宽。
    # ⚠ 诚实边界：本形式的重心转移**已被隔离实测证明不是可用执行器**（见下 ramp_s 注释与
    # docs/debug/2026-09-21-quadruped-gait-trot-to-wave.md §9）：抬腿高度 0.001 m（四足基本不离地）
    # 时，幅度 0（对照）z_mean 0.279955 m / 倾角 0.091° / 漂移 0.00649 m；
    # 而幅度 0.005 m（5 mm）即 z_mean −12.184303 m、倾角 171.175°、漂移 4.78069 m。
    amplitude_m: 0.06
    # 参与转移的轴（躯干系）：x = 前后、y = 左右。两个分量都需要（对角腿对的方向不与轴平行）。
    axis: [x, y]
    # 各腿摆动窗口内机身要移动的**单位方向**＝抬起该腿后支撑三角形「最紧边」的内法线
    # （实测方向见上表）。装配期由 `gait.sway_direction_report` 按被测模型的实测足迹复核
    # （夹角 ≤ direction_tolerance_deg），写反即显式失败——这条门禁抓的是「方向写反」这类
    # 会静默失效的缺陷（照着错方向跑，判据全绿但机身翻倒）。
    phase_map:
      FL: {x: -0.592, y: -0.806}
      FR: {x: -0.592, y: 0.806}
      RL: {x: 0.592, y: -0.806}
      RR: {x: 0.592, y: 0.806}
    # 相邻窗口之间的方向过渡时长（s）：升余弦核平滑，避免阶跃输入。
    # 取值以「过渡不产生高加速度」为准：0.8 s 周期下 0.20 s ≈ 窗口长度的 0.8，
    # 横向加速度量级 ≈ A·(2π/T)²（A = 0.06 m ⇒ 1.85 m/s²）。档位同样是扫描实测最优
    # （0.08/0.16/0.20 三档里 0.20 最好；降低步频到 0.4 Hz 不改善 ⇒ 不是速度问题）。
    smooth_s: 0.20
    # 幅度建立的斜坡时长（s）：0 = 首次抬腿前就建立满幅。
    # 为什么单独给斜坡（不与步高 ramp_s 共用）：步高从 0 起坡是合理的（避免起步冲击），
    # 但**重心转移必须在第一次抬腿之前就到位**，否则第一个摆动窗口在「重心仍在支撑三角形边界上」
    # 的状态下抬起 ⇒ 第一个周期就倾覆（实测 wave 首个周期即倾 4.20°，见时间线证据）。
    # ⚠ 隔离实测（本步，证据 build/iraf-24h-2/02/scan-sway-isolation.txt）：把步高降到 0.001 m
    # （四足基本不离地、支撑相 1.0）后，幅度 0 的对照完全稳定（z_mean 0.279955、倾角 0.091°、
    # 漂移 0.00649 m、饱和 0），而幅度 0.005/0.01/0.02/0.04 m 全部翻倒 ⇒ 失稳由**重心转移本身**
    # 造成，与抬腿/落地动力学无关；且 5 mm 即失稳、幅度越大不一定越差（非单调）⇒ 是足–地
    # 黏滑推进（stick-slip）而不是「重心没移到位」。⇒ 本形式（关节空间足端目标偏移）不是可用的
    # 重心转移执行器，路线需人工再决策（见调试记录 §9）。
    ramp_s: 0.0
    # 方向门禁容差（度）：声明方向与实测内法线的夹角上限（上界 45° 由实现层强制，
    # 防止把容差写成 180° 让门禁恒真）。
    direction_tolerance_deg: 5.0
  # ---- 落足点规划（迈步式 crawl，专项 C / ADR-0008 决策 1j）----
  # 语义：相位 → **足端水平落点**。`static` = 落点恒为中立足端（现行「原地踏步」行为）；
  # `per_phase` = 逐相位把摆动腿的落点挪到计划位置，让支撑三角形**跟着移动**，而不是平移机身。
  # 为什么需要它（实测）：对称矩形足迹下，抬起任意一条腿后的三腿支撑三角形与「对角腿连线」
  # 只交于中心一点 ⇒ 静态支撑余量 -0.000227483 m（≈0），机身常量平移的可行域是空集；
  # 重心移到支撑三角形形心需平移 0.079~0.081 m（此时最小法向力 47.325754 N = 30.9317 % mg）。
  # 因此「落点不变 + 移机身」的 wave 没有静态稳定前提，必须逐相位重新构造支撑多边形。
  # 证据：docs/progress/2026-09-21-quadruped-walk-special-design.md §3、ADR-0008 决策 1j。
  # 消费点：src/iraf_adapters/unitree/gait.py 的 `_load_foothold`（解析与门禁）与
  # `gait_joint_targets`（目标生成，per_phase 分支）。缺本段即显式失败（wave 必需键）。
  # ⚠ 当前值为 `static`：`per_phase` 的落地点（目标生成 + 摆动相落到计划落点）**尚未实现**，
  #   按铁律 2「未实现的能力不得声明」保持 static；实现并通过 L1 验收后再翻转本键。
  foothold:
    mode: static
    # 落足点规划**专项验收**判据（`scripts/verify_go2_crawl.py` 消费）。
    # 为什么单独一套而不是复用 gait.verification：后者是「原地踏步」口径 —— 它的
    # `max_displacement_m: 0.05` 量的是**全程机身位移峰值**（注释写明「位移目标恒为 0，
    # 本判据证明没有偷偷走出去」），而迈步式 crawl **必然**在周期内真实平移（实测重心需移
    # 0.079~0.081 m）。留在原地口径下该路线永远不可能通过 —— 那不是严，是把判据套在错量上。
    # 因此 crawl 用**新增**判据集；既有 20 项判据与阈值一字不动，仍由
    # `scripts/verify_go2_gait_in_place.py` 强制执行。
    verification:
      report: build/acceptance/go2-crawl/report.json
      # 验收时长：10 s = 12.5 个步态周期（扣掉 1 s 斜坡仍有 11 个），与原地验收同量级。
      duration_s: 10.0
      # 落点误差上限（m）：实测「稳态窗内相邻两个落点等级的足端躯干系位置差」与声明值
      # `(高等级−低等级)·stride_m·方向` 的偏差。取值依据 = 静态支撑余量的量级：
      # 中立足迹（0.3868 × 0.2840 m 矩形）下三腿支撑三角形的静态余量实测 **−0.000227483 m**，
      # 落点误差若大于该量级，「把重心移进支撑三角形」的计划就被落点误差本身吞掉 ⇒ 失去意义。
      # ⚠ 诚实边界：**当前实测不达标**（stride 0.01、有效窗内四腿误差 0.001837~0.004891 m，
      #   是 8~21 倍余量），本阈值不予放宽；它同时是下一阶段的目标值。
      # ⚠ 盲区（已登记）：判据只测「落点位移兑现」（两等级之差），**共模**偏移（所有帧同加
      #   常量）在差分里抵消、本判据看不见；中立位的绝对一致性当前无判据覆盖。
      landing_error_max_m: 0.000227
      # 稳态支撑相帧的接触达标率下限（比例，∈[0,1]）：静态可稳的前提是「任意时刻 ≥3 条腿承载」
      # （`balance.allocation.min_stance_legs = 3`）⇒ 声明为支撑相的帧必须真的接触。
      # 阈值取 1.0（不允许「声明支撑却没承载」的帧）；相接处的一个采样周期由稳态窗起点外推，
      # 不在统计内（稳态窗跳过 ramp_s 与 2 个整周期）。
      # ⚠ 诚实边界：**当前实测不达标**（有效窗内 43.7~56.6%）。
      min_stance_contact_rate: 1.0
      # 周期净漂移上限（m/周期）：「原地」语义要求足迹闭环 ⇒ 每周期净漂移 → 0。
      # 取值依据 = 落点位移量 2·stride_m 的 1/4（漂移超过它即说明足迹没有闭环、落点规划失去意义）；
      # 定标条件：首次出现稳定 crawl 时按实测复核（与 `duty_tolerance` 的定标条件同做法）。
      net_drift_per_cycle_m: 0.005
      # 稳态窗内机身水平位移**峰值**上限（m）：crawl 在周期内必然平移，本键给出该平移的上界。
      # 取值依据：机身质心必须留在支撑三角形内 ⇒ 位移量级不得与足迹尺度（0.2840 m 宽）同量级；
      # 取 0.10 m = ADR-0008 §3 的到点判据（S4 位置误差 0.10 m）同量级，便于二期接力时口径一致。
      peak_body_excursion_m: 0.10
  verification:
    report: build/acceptance/go2-trot-in-place/report.json
    # 验收持续时长：10 s ⇒ 16 个完整步态周期（扣掉 1 s 斜坡后仍有 14 个稳态周期）。
    duration_s: 10.0
    # 机身高度目标 = 与 stand 同一目标（厂商关键帧基座 z）；本键与 stand.height_target_m 都是
    # 「同一事实的两条消费面」的声明值，改动必须两处同文（步态验收与站立验收对的都是同一个物理量）。
    height_target_m: 0.27
    # 容差（实测后定）：步态只有对角两条腿支撑，躯干必然比站立略低；实测均值见调试记录，
    # 阈值 = 实测值 + 余量，用于把「正常下沉」与「塌陷」分开，不是「凑通过」。
    height_mean_tolerance_m: 0.03
    # 稳态高度标准差上限：把「稳定踏步」与「上下弹跳」分开（实测值与余量见调试记录）。
    height_std_max_m: 0.02
    # 跌倒判据：机身高度低于它即判为跌倒。取值依据 = 躯干碰撞盒半高 0.057 m（趴地约 0.06~0.08 m）
    # 与站立 0.27 m 之间，留 ~2 倍余量。
    fall_base_height_m: 0.15
    # 原地踏步的位移上限（m）：位移目标恒为 0，本判据证明「没有偷偷走出去」。
    # 取值依据：台面半边长 0.8 m，机身碰撞盒半长 0.1881 m ⇒ 走到台边至少 0.61 m；
    # 0.05 m 远小于该尺度，又远大于纯数值噪声（足端滑移的实测值与余量见调试记录）。
    max_displacement_m: 0.05
    # 支撑判定阈值（足端接触法向力 N）：单腿站立载荷约 mg/4 ≈ 38 N，2 N 只判「是否着地」。
    contact_force_threshold_n: 2.0
    # 「明确离地」的判据（**实现口径**：一个周期内支撑相比例 ≤ 1 − 本值，即至少 1/4 周期离地；
    # 早先本行注释写成 `duty − 本值`，与实现不一致，已按实现改正——阈值一字未改）。
    # ⚠ 未决冲突（已登记，未私自改判据）：duty = 0.75 时本判据要求「支撑相 ≤ 0.75」，而
    #   「任意时刻 ≥3 条腿支撑」又要求「离地比例 ≤ 1/4」⇒ 两者夹出「离地比例恰好 = 1/4」的零余量点：
    #   一条腿的离地窗口必须恰好铺满整个摆动窗口（含起落瞬间），落地/离地的卸载时间必须为零。
    #   证据与推导见 docs/debug/2026-09-21-quadruped-gait-trot-to-wave.md；处理方式待人工决策。
    # 【第二十一轮实测（2026-09-21，证据 build/iraf-24h-2/02b/r21-duty-ideal.txt）】本键与
    #   `gait.duty_factor` 的关系已量成**算术结论**（与动力学无关）：本键给出 duty 的**上界**
    #   1 − 本值 = 0.75（判据 `leg_*_clear_swing_cycles` 的实现口径就是「逐周期支撑相 ≤ 1 − 本值」）
    #   ⇒ duty 可行集合 = [0.75, 0.75]（宽度 0）。正例对照：duty=0.75 + 理想轨迹 ⇒ 18 条判定全过；
    #   反例：duty=0.85 + 理想轨迹 ⇒ **恰好** 4 条 `leg_*_clear_swing_cycles` 失败
    #   （clear_swing_cycles 0/0/1/1，同期 12 个周期）。⇒ duty > 0.75 时腿只要照声明执行，
    #   逐周期支撑相就 > 0.75、判据必然失败；想让「提高占空比」可满足必须改本键（= 改阈值），
    #   属人工决策，代理不改。
    min_swing_fraction: 0.25
    # 10 s × 1.25 Hz = 12.5 周期，扣掉 1 s 斜坡后约 11 个稳态周期；本下限取 8（留 ~1.4 倍余量）。
    min_clear_swing_cycles_per_leg: 8
    # 稳态支撑相比例与声明占空比的**对称**容差：|实测 − duty| ≤ 本值。
    # 目的不是「精确对表」，而是把两种退化形态拦下：脚一直粘在地上（≈1.0）或一直悬空（≈0.0）。
    # 取值依据：接触判定阈值 2.0 N 相对单腿载荷 ~38 N 是数量级之差，相位切换处的判定边界
    # 只占一个采样周期（0.01 s = 周期的 1.6%），因此 0.10 已是宽松上界。
    # 定标条件：本值在**首次出现稳定踏步的验收**时用实测值复核（当前验收未通过 ⇒
    # 尚无稳定运行的实测支撑相比例可对表，按「本键与判据同文交付、不写死进实现」处理）。
    duty_tolerance: 0.10
    # 对角相位结构容差（相位环 20 格上，同组/半周期折叠后的最大支撑相比例差）。
    diagonal_profile_tolerance: 0.25
    # PD 跟踪误差上限（rad）：步态是连续变化的参考轨迹，容差比站立宽松；实测值与余量见调试记录。
    max_tracking_error_rad: 0.25
    # 相位环分箱数（必须为 ≥4 的偶数，便于对折比较半周期）。
    profile_bins: 20

sample:
  frequency_hz: 100

# 显示参数（S1 交互 `scenario.py interact` 与场景观看 `--display` 的**唯一来源**）：
# 实现层与脚本不得写死分辨率或相机名；`render.camera` 必须在被装配的模型里真实存在
# （from_config 期校验，缺失即失败）；`render_hz` 是窗口渲染频率上限。
render:
  camera: overhead_camera
  width_px: 640
  height_px: 480
  render_hz: 30.0
  # 交互窗口是否强制 Mesa 软件渲染（LIBGL_ALWAYS_SOFTWARE=1 + GALLIUM_DRIVER=llvmpipe）。
  # 依据：2026-09-23 实测（docs/debug/2026-09-23-go2-viewer-3d-black-screen.md）——本机默认 GL 路径下
  # 窗口 3D 视口几乎不亮（固定相机 mean=22.2、自由相机 mean=36.4），使用者反馈"看不到 Go2、只有红方块"；
  # 强制软件渲染后同一场景正常（固定相机 mean=95.1/非黑 68.3%、自由相机 mean=42.5）。
  # 该开关只影响**交互窗口**（离屏渲染 `render.camera` 走的路径一直正常）；关掉即回到默认 GL。
  software_gl: true

# 速度指令 `locomote` 的接线声明（A6a-④ ⑤；Provider 配置与默认时长必须来自声明，铁律 5.3）。
# 语义：`locomote` 的能力声明**不在这里** —— Profile 的 `capabilities` 仍只有 [stand, stop]，
# 本段只提供"怎么做"的参数；能力声明要等本机判据 + aarch64 板复测都过（铁律 6.8）。
locomote:
  # MPC Provider 的部署与模型声明文件（含 `mpc_provider` / `mpc_model` / `mpc_gait` 三段）。
  provider_config: config/go2_locomote.yaml
  # 未显式给 `duration_ms` 时的默认执行时长（**秒**；与 `resolve_duration_ms` 的
  # `declared_seconds` 参数同单位 —— 该函数返回秒）。
  duration_seconds: 3.0
  # MPC 路径的**位置级 PD 权重**（逐关节混合 τ = w ⊙ τ_pd + w_bal·τ_bal 里的 w）。
  # 为什么不用 `balance.stance_weight_position`（=0）：那个 0 是**平衡路径**的语义（有平衡器
  # 自己的力分配+姿态控制兜底，支撑腿可以完全交给力控）；MPC 路径没有那层兜底，支撑腿若失去
  # 位置环，腿的构型（腿长/姿态）就没人守 —— 实测 0.9 s 内倾角级联到 46.02°、力矩长期顶在模型
  # 上限 45.430 N·m。上游 `leg_controller` 的结构是"每条腿都有位置/速度回路 + 叠加 −Jᵀf"，
  # 故这里取 1.0/1.0：PD 守构型，MPC 的接触力矩叠加在上面。
  stance_position_weight: 1.0
  swing_position_weight: 1.0
  # 速度指令**斜坡**时长（秒）：指令不是阶跃给进 QP，而是按 `min(1, elapsed/ramp)` 缩放。
  # 依据（2026-09-23 实测）：从静止直接给 vx=+0.2 阶跃时，QP 第 0 拍给出 Σfx=+74.803 N
  # （而匀速态只需 +0.495 N），这段反向冲量把机身推成 −0.224 m/s 的恒定后漂、指令增益只有 0.335。
  # 上游闭环 `eval_trot_23.py` 同样是斜坡起速（其 `--settle` 默认 1.0 s），此处取同口径。
  velocity_ramp_s: 1.0
  # 本路径的腿部 PD 增益缩放（乘在 `control.kp_nm_per_rad` / `kd` 上；1.0 = 与 stand 同档）。
  # 依据（2026-09-23 实测）：`kp=150/kd=4` 是按**静态站立**指标选的；在 trot 3 Hz 摆动目标下
  # 跟踪误差 Δq 达 0.10~0.26 rad ⇒ `kp·Δq` 撞到每关节力矩上限（逐关节：髋/大腿 ±23.7、
  # 小腿 −45.4 全部饱和）⇒ B1 的 MPC 载荷被截断吃掉（零指令 hold：|τ总|max = |τ位置|max = 45.43 N·m，
  # MPC 载荷只有 6~16 N·m）。本键用于按**本路径**的判据重新定档，不再借用 stand 的档位。
  # 只在该次 `locomote()` 执行内生效（结束即恢复），stand/stop 不受影响。
  leg_position_gain_scale: 0.3
  # 档位选择依据（2026-09-23 实测细扫；同一 3 s / 100 Hz 工况，只改本键；报告 build/iraf-a6a7/gain*-{hold,forward,backward}.json）：
  #   档位   零指令 hold 净位移   倾角      forward 误差   倾角     偏航       |τ位置环|max  MPC载荷
  #   1.0        0.5742 m       3.12°      0.6053       9.45°   +31.94°      45.43(饱和)     9.98
  #   0.4        0.1227 m       2.22°      0.3310       2.16°    +0.27°      4.1             8.4
  #   0.3        0.1131 m       3.53°      0.3381       3.24°    +0.04°      4.1             8.2
  #   0.25       0.1032 m       4.75°      0.3449       4.42°    +0.63°      4.0             8.0
  #   0.2        0.0895 m       7.39°      0.3320       7.74°    +0.26°      4.7             7.9
  # 取 0.3：相对 1.0 档**逐项不劣**（漂移 5.1×↓、误差 1.8×↓、偏航漂移 5×↓、倾角与 1.0 档相当且远在 15° 内），
  # 且 MPC 载荷峰值（8.2）> 位置环峰值（4.1）⇒ 命令不再被截断（判据见 docs/debug/2026-09-23-go2-locomote-zero-command-drift.md §1.8）。
  # 0.25/0.2 漂移更小但姿态变差、后退误差分化 ⇒ 不做单点过拟合；生产取 0.3，后续按四工况判据再评估。

# 停靠（dock_for_handoff）：闭环走到**声明目标帧**并停住。
# 判据（平移/偏航容差、末速上限）**由调用方传入**（场景步骤的 criteria）—— 本段只放接近参数，
# 同一事实不出现两处；实现层不写任何默认值。
dock_for_handoff:
  # 目标帧名：来自**场景**（scenes/handoff_lab/scene.yaml 的 props.tray_01 → frame: tray_frame），
  # 模型里必须是 site 或 body（实测：tray_frame 在构建产物里是 site）。
  target_frame: tray_frame
  # 接近速度上限（m/s）：必须 ≤ 安全策略 max_speed_mps=0.5；只允许收紧。
  # 初始档 0.15 是"慢速接近"的工程选择，**待按停靠判据标定**（标定后在声明里写明扫描范围与依据）。
  approach_speed_mps: 0.15
  # 误差 → 速度的比例增益（1/s）：v = gain·误差，再按上面上限限幅。
  gain_s_inv: 0.8
  # 到位后保持时长（s）：停靠判据含"末速"，必须有保持窗才能验收。
  settle_s: 1.0
  # 总超时（s）：超时未进容差 ⇒ 显式失败（DOCK_TIMEOUT），不返回"近似成功"。
  timeout_s: 60.0

state:
  # 传感器按名字解析（关节名 ≠ 执行器名：go2.xml 关节 FL_hip_joint / 执行器 FL_hip）。
  sensors:
    quat: imu_quat
    gyro: imu_gyro
    acc: imu_acc
    torque_pattern: "{actuator}_torque"
  # 判据全部与独立计算的模型量比对（不是与硬编码常数比），见实现层 assess()。
  quat_norm_tolerance: 1.0e-9
  gyro_max_abs_error_rad_s: 1.0e-9
  torque_max_abs_error_nm: 1.0e-9

skills:
  # 技能层验收（步骤 17）的声明：本段是"同一机型、第二条消费面"的**唯一**数字/路径来源，
  # 入口 scripts/verify_quadruped_skills.py 里不得出现路径或阈值默认值（铁律 5.3）。
  # 安全策略（放行清单 + 四足速度/工作空间上限）：由 iraf_skills.quadruped 的门禁消费。
  safety_policy: profiles/safety/quadruped_lab.yaml
  report: build/acceptance/go2-skills/report.json
  # 拒绝用例数下限：成功路径与拒绝路径都要有证据（AGENTS.md 2.8）。
  minimum_rejection_cases: 5
  # 标称序列（S2 场景步骤 s01/f01/f03 的子集）：站立 → 停止。
  # **行走不在序列内**：决策 4.B 首期无步态控制器，locomote 必须被显式拒绝，
  # 绝不允许用 mock 步态把"行走"补进成功路径（铁律 1.5）。
  nominal_sequence: [stand, stop]
  # 期望被拒绝的能力（能力未声明 → Policy 拒绝；Provider 层再兜一层显式拒绝）。
  refused_capability: locomote

report:
  path: build/acceptance/go2-loopback/report.json