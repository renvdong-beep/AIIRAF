[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "intewell-iraf"
version = "0.2.0"
description = "Intewell Robot Application Framework runtime"
readme = "docs/README.md"
requires-python = ">=3.9"
license = {text = "Proprietary"}
dependencies = [
  "jsonschema>=4.18,<5",
  "mujoco>=3.2,<4",
  "protobuf>=5.29,<6",
  "PyYAML>=6,<7",
]

[project.optional-dependencies]
simulation = ["grpcio>=1.71,<2", "Pillow>=10,<13"]
dev = ["pytest>=8,<9"]

[project.scripts]
iraf-runtime-http = "iraf_adapters.http.runtime_http:main"
iraf-runtime-grpc = "iraf_adapters.grpc.server:main"
iraf-task = "iraf_tools.run_task:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["iraf_core*", "iraf_adapters*", "iraf_skills*", "iraf_tools*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
