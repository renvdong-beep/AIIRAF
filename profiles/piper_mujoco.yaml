apiVersion: iraf.intewell.io/v1
kind: RobotProfile
metadata:
  name: piper_mujoco
  version: 0.2.0
spec:
  simulation: true
  verification: development
  control_frequency_hz: 100
  joints: [joint1, joint2, joint3, joint4, joint5, joint6, joint7, joint8]
  joint_limits:
    joint1: [-3.14, 3.14]
    joint2: [-3.14, 3.14]
    joint3: [-3.14, 3.14]
    joint4: [-3.14, 3.14]
    joint5: [-3.14, 3.14]
    joint6: [-3.14, 3.14]
    joint7: [0.0, 0.035]
    joint8: [-0.035, 0.0]
  capabilities: [move_joint, pick_object, visual_pick, stop]
  # 结构化差异声明：把关节语义、夹爪位形、Home 位姿与相机视角
  # 从脚本魔数收敛为 profile 数据，换机械臂只需替换本文件。
  joint_roles:
    joint1: arm
    joint2: arm
    joint3: arm
    joint4: arm
    joint5: arm
    joint6: arm
    joint7: gripper_drive_left
    joint8: gripper_drive_right
  gripper:
    drive_joints: [joint7, joint8]
    left_index: 0
    right_index: 1
    open_positions: {joint7: 0.035, joint8: -0.035}
    closed_positions: {joint7: 0.023, joint8: -0.023}
    pad_offset_m: 0.0298
    max_tilt_deg: 30.0
  # 构建期声明（`spec.model.*`）：供**联合模型**构建器（`--attach piper`）读取。
  # 机械臂自己的产物仍走 `config/piper_simulation_baseline.yaml` 的 model 段（本场景不改其语义）。
  model:
    vendor: agilex_piper
    file: vendor/agilex_piper/piper_description/mujoco_model/piper_description.xml
    # 本体的"根" body（挂载参考系的宿主）；机械臂无挂载系 ⇒ 只声明根
    trunk_body: link1
  home:
    joint1: 0.0
    joint2: 0.65
    joint3: -1.15
    joint4: 0.0
    joint5: 0.35
    joint6: 0.0
  camera:
    lookat_m: [0.06, 0.0, 0.12]
    distance_m: 1.05
    azimuth_deg: 180.0
    elevation_deg: -8.0
  manipulation:
    targets:
      box_01:
        body: box_01
        pose_tolerance_m: 0.005
