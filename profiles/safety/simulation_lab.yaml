apiVersion: iraf.intewell.io/v1
kind: SafetyPolicy
metadata:
  name: simulation_lab
  version: 1.0.0
spec:
  verification: development
  simulation_only: true
  default: deny
  # reset_scene（2026-10-23）：开发/调试用的场景复位。它在 default: deny 下必须显式放行，
  # 否则策略会拒（实测 AgentOS 会话曾用 /tmp 覆盖才通过 —— 不该靠临时文件）。
  allowed_skills: [move_joint, pick_object, visual_pick, place_object, accept_payload, stop, reset_scene]
  max_duration_ms: 30000
