apiVersion: iraf.intewell.io/v1
kind: RobotProfile
metadata:
  name: unitree_go2
  version: 0.1.0
spec:
  # 场景/模型层 Profile（步骤 13 交付）：只声明"这台本体是什么"，
  # 不声明任何运动能力 —— capabilities 为空是**事实**（stand/stop/locomote 属 U4，
  # 由步骤 16/17 逐项验收后回填），不是漏写。
  simulation: true
  verification: unverified
  control_frequency_hz: 100

  # 关节与限位来自厂商 MJCF 的编译结果（实测，不是抄文档）：
  # `mujoco.MjModel.from_xml_path(vendor/unitree_go2/unitree_robots/go2/go2.xml)` 的
  # `jnt_range`，证据 build/iraf-24h/13/trunk-geom.txt 与 go2-model-facts.json。
  # hip=±1.0472；thigh 前腿 [-1.5708, 3.4907] / 后腿 [-0.5236, 4.5379]；calf [-2.7227, -0.83776]。
  joints:
    [FL_hip_joint, FL_thigh_joint, FL_calf_joint,
     FR_hip_joint, FR_thigh_joint, FR_calf_joint,
     RL_hip_joint, RL_thigh_joint, RL_calf_joint,
     RR_hip_joint, RR_thigh_joint, RR_calf_joint]
  joint_limits:
    FL_hip_joint: [-1.0472, 1.0472]
    FL_thigh_joint: [-1.5708, 3.4907]
    FL_calf_joint: [-2.7227, -0.83776]
    FR_hip_joint: [-1.0472, 1.0472]
    FR_thigh_joint: [-1.5708, 3.4907]
    FR_calf_joint: [-2.7227, -0.83776]
    RL_hip_joint: [-1.0472, 1.0472]
    RL_thigh_joint: [-0.5236, 4.5379]
    RL_calf_joint: [-2.7227, -0.83776]
    RR_hip_joint: [-1.0472, 1.0472]
    RR_thigh_joint: [-0.5236, 4.5379]
    RR_calf_joint: [-2.7227, -0.83776]

  # 站立参考位形（单一事实来源）：loopback 验收（步骤 15）用的目标位形从这里读，
  # 四腿 (hip, thigh, calf) = (0.0, 0.9, -1.8)。
  # 数值来自厂商 MJCF 自带关键帧（实测 `nkey=1`、`name=home`、
  # `qpos = [0,0,0.27, 1,0,0,0, 0,0.9,-1.8 ×4]`，证据 build/iraf-24h/15/probe-api.txt）——
  # 四腿数值完全相同，因此 qpos 里的关节顺序不影响映射。
  # 注意：home 是"参考位形"而不是能力声明（本 Profile 的 capabilities 仍为空，
  # stand/stop 属 U4，需在步骤 16/17 逐项验收后回填）。
  home:
    FL_hip_joint: 0.0
    FL_thigh_joint: 0.9
    FL_calf_joint: -1.8
    FR_hip_joint: 0.0
    FR_thigh_joint: 0.9
    FR_calf_joint: -1.8
    RL_hip_joint: 0.0
    RL_thigh_joint: 0.9
    RL_calf_joint: -1.8
    RR_hip_joint: 0.0
    RR_thigh_joint: 0.9
    RR_calf_joint: -1.8

  # 四足步态的首期不重写（design §2 边界 1）：本 Profile **不声明** joint_roles ——
  # iraf_core.profile 的角色词表只有 arm/gripper_drive*，四足角色需要新词表 +
  # 新的安全边界，属未出 ADR 的扩展，不得在本步骤偷带进来（铁律 6.8）。
  #
  # capabilities（步骤 17 回填，**仅在技能层验收通过后**）：
  # - `stand` / `stop`：经 TaskFlow → SkillRuntime → Policy → Provider → 适配器 全链路验收
  #   （证据 build/acceptance/go2-skills/report.json，simulation=true）；
  # - `locomote`：**2026-09-23 回填**（两层证据齐备后才动手）：
  #     · 适配器层四工况：forward 误差 0.0659、backward 0.0571（判据 ≤0.10）、方向门禁通过、
  #       倾角 3.14°/1.98°（≤15°）、无 max_iter/damped_hold；turn_left/right 符号门禁通过
  #       （量值按声明**仅记录**，上游未定义转向跟踪容差 —— 这里没有偷偷加判据）；
  #       零指令 hold 漂移 0.0286 m/3 s；报告 build/acceptance/go2-locomote/report.json（passed=true）
  #     · **技能层**（TaskFlow → SkillRuntime → Policy → Provider → 适配器）：stand/locomote/stop
  #       三步全 SUCCEEDED、rejected=0；报告 build/iraf-a6a12/skill-layer-run.json
  #     · 回归：loopback 三基准**逐位不变**（0.279953602548388 / 3.302184116303541e-05 /
  #       0.0032068060511409）、10/10
  #     · **边界**：全部 simulation=true；**上板部署证据（A7）另计**，本项不构成上板能力证据；
  #       适用速度受安全策略 max_speed_mps=0.5 约束。
  # - `read_state` / `emergency_stop` 已实现但本轮不经技能层验收，故不声明
  #   （"实现即必须声明"会逼出没有技能验收支撑的声明；方向只允许 declared ⊆ implemented）。
  # `dock_for_handoff`（2026-09-24 回填）：**三层证据齐备后**才入列 ——
  #   · 适配器层：build/iraf-a6a14/station-acceptance.json（9/9 判据全过：
  #     平移 0.026780452 m ≤ 0.03、偏航 −0.235676284° ≤ 2.0°、末速 2.96742e-04 m/s ≤ 0.05、
  #     全程最大倾角 5.2546° ≤ 15°、目标帧世界固定、接近真的执行过 settled_at_s=6.560 s）；
  #   · 技能层：见本提交的证据（TaskFlow → SkillRuntime → Policy → Provider → 适配器）；
  #   · 场景层：s02_dock 解除"待交付"登记（scenario.yaml）。
  # 边界（诚实）：全部 simulation=true；停靠目标是**世界固定站位帧**（handoff_station_frame，0.55 m），
  # 其坐标前提是臂基座在台面原点附近、且只按位置可达筛选（未约束工具姿态）；上板证据另计。
  capabilities: [stand, stop, locomote, dock_for_handoff]

  # ---- 构建期声明（场景构建器消费；iraf_core.profile 只读它已知的键，忽略本节）----
  # 厂商模型路径与挂载点集中在 Profile，禁止散落到脚本里（铁律 5.3）。
  model:
    vendor: unitree_go2
    file: vendor/unitree_go2/unitree_robots/go2/go2.xml
    # 躯干 body 名（实测 bodies 列表中的承力体）：挂载点与传感器都挂在这里。
    trunk_body: base_link
    # 厂商自带 IMU site（实测 site 列表只有 imu 一个），场景构建器只读引用，不复制、不改写。
    imu_site: imu
    mount_frames:
      # 四足背上的托盘参考系（scene.yaml 的 props[].pose.mount.frame 引用它）。
      # z 值来自实测躯干碰撞盒顶面（base_link 下唯一 box geom：pos.z=0, size.z=0.057），
      # 证据 build/iraf-24h/13/trunk-geom.txt。
      tray_frame:
        body: base_link
        # ⚠ 本帧是**场景停靠判据**（平移 ≤30mm、偏航 ≤2deg）的测量帧 ⇒ **不得移动**
        # （2026-09-28 实测：整体改到侧挂位会让 s02 报 `Provider output does not match schema:
        #  None is not of type 'number'`，并连带把 s03 一起拖红）。侧挂交接位用**新帧** pannier_frame。
        pos_m: [0.0, 0.0, 0.057]
        quat_wxyz: [1.0, 0.0, 0.0, 0.0]
      # **侧挂交接筐位**（2026-09-28 §11.23(31)(32)）：给托盘道具用的可声明挂位。
      # 为什么需要：背上 `tray_frame`（= 躯干碰撞盒顶面）已是背上的**最低点**，但"指腹朝下送达其上方"
      # 要求腕部半径 0.707 m > 可达 0.594 m ⇒ 几何不可达（构建器警告 + 实跑离托盘 41 cm）。
      # 侧挂位把 xy 收回可达区、高度降到 ≈0.21 m，**语义仍是"放到机器狗身上"**（侧挂筐）。
      # y 取负 = 朝臂的一侧（狗在站位处偏航≈0 ⇒ 躯干局部轴≈世界轴）；
      # z = 0.21(目标顶面) - 0.01(托盘半厚) - 0.288372(躯干原点高度)。
      pannier_frame:
        body: base_link
        pos_m: [0.0, -0.22, -0.088372]
        quat_wxyz: [1.0, 0.0, 0.0, 0.0]
    # 初始位姿对齐（步骤 02 A′ ①，2026-09-21）：把初始位姿抬到「本体最低几何点刚好落在支撑面」。
    # 为什么必须显式声明：这是**改变初始条件**的构建期行为，隐式施加会让任何"看起来像 Profile"的
    # 文件也能改物理初始态；缺本段即不做（Piper 等其它本体不受影响）。
    # 实测依据：关键帧 `home` 下四足足端球最低点在台面下 **18.372 mm**
    # （证据 build/iraf-24h-2/02/probe-neutral-clearance.txt：dist=-0.018372500、球半径 0.022 m）。
    # 抬升量由构建器按编译后的模型**实测**得出并写入场景报告（`initial_alignment` 段），不是常数。
    initial_alignment:
      enabled: true
      # 只支持这一种语义（单次平移基座 z，使最低几何点落在支撑面）；其它取值显式失败，不做近似。
      mode: lift_lowest_geom_to_support_plane
      # 支撑面 z 的来源（场景声明内的点号路径）：地形工作台顶面。
      support_plane_source: terrain.workbench.top_z_m
      # 量"最低点"时的几何范围：只支持 collision（`contype/conaffinity` 非零的可碰撞几何）。
      # 为什么不是"所有 geom"：视觉网格不参与接触，把它们算进来没有物理意义
      # （本步实测：厂商 `FL_calf/calf_0` 视觉网格用包围球下界会算出 −0.096406 m，
      #  抬升量从 18.372 mm 变成 96.406 mm；证据 build/iraf-24h-2/02/scene-initial-alignment-run1.txt）。
      geometry_scope: collision
      # 对齐容差（m）：抬升后 |最低点 − 支撑面| ≤ 本值视为完成（数值容差，不是物理阈值）。
      tolerance_m: 1.0e-4

  # 交互窗口的**自由相机**初始视角（S1/显示入口用；`scripts/view_go2_gait.py` 消费）。
  # 为什么必须声明（2026-09-23 实测的显示缺陷）：本段缺失时 viewer 回退到臂侧默认
  #   `lookat=[0,0,0.1]`/`distance=1.0`/`azimuth=180`/`elevation=-8`（那是 UR5e/Piper 的取景，
  #   对四足不是"看不见"而是取景与朝向都不对）；且显示入口原先每帧强制**固定相机**
  #   （`viewer.cam.type = mjCAMERA_FIXED`），按 MuJoCo 语义固定相机**禁用鼠标旋转**。
  # 取值依据 = 分割渲染扫描（`build/iraf-a6a4/`），判据**两条**（只看覆盖率会选错）：
  #   ① 机器人占画面比例 ∈ [6%, 25%]（太小看不出、太大看不到全身）；
  #   ② **躯干像素 > 托盘像素**（狗背上挂着 tray_01，俯视时托盘会挡住躯干 —— 首版取 el=−35°、
  #      dist=1.0，覆盖率虽高（16.37%）但托盘 8,643 px 盖过躯干，画面主体成了托盘背面）。
  # 实测对照（640×480，lookat 取关键帧 home 的四足质心 z=0.268730095598 ⇒ 写 0.27）：
  #   dist=1.2 az=120 el=−5  ⇒ 机器人 9.72%、躯干 12,254 px、托盘 1,228 px、腿 9,199 px ← 采用
  #   dist=1.2 az= 90 el= −5 ⇒ 9.57%、躯干 11,032、托盘 1,465、腿 9,831
  #   dist=1.0 az= 90 el=−35 ⇒ 16.37%、躯干被托盘遮挡（托盘 8,643 px）           ← 已弃用
  #   dist=1.5 az=120 el=−5  ⇒ 6.11%（偏小）
  # 注意：本段只影响**交互窗口的自由相机初值**（可被鼠标拖动旋转/缩放覆盖）；离屏渲染仍用
  #       `render.camera`（overhead_camera），两者是不同用途，不要互相替代。
  camera:
    lookat_m: [0.0, 0.0, 0.27]
    distance_m: 1.2
    azimuth_deg: 120.0
    elevation_deg: -5.0